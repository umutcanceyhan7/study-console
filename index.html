<meta charset="utf-8" />
<title>CCAF Study Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<style>
/* ============================================================
   DOSYA — case file. Sıcak kum kâğıt, koyu nar mürekkep.
   Tek dosya, harici bağımlılık yok, sistem fontları.
   Ana kural: YANLIŞ OLMAK RENK TAŞIMAZ. Kroma bütçesi
   yalnızca "resmî kaynak ne diyor" eksenine harcanır.
============================================================ */

:root {
  color-scheme: light;

  --surface:        oklch(.968 .008 75);
  --surface-sunk:   oklch(.942 .010 72);
  --surface-raise:  oklch(.991 .004 80);

  --ink:            oklch(.24  .016 45);
  --ink-2:          oklch(.46  .014 50);
  --ink-3:          oklch(.56  .012 55);

  --rule:           oklch(.885 .010 70);
  --rule-2:         oklch(.820 .012 68);

  --garnet:         oklch(.44  .14  25);
  --garnet-deep:    oklch(.36  .13  25);
  --garnet-wash:    oklch(.935 .028 30);
  --garnet-on:      oklch(.972 .012 40);

  --pine:           oklch(.44  .09  155);
  --pine-wash:      oklch(.948 .026 160);

  --ochre:          oklch(.45  .10  72);
  --ochre-wash:     oklch(.950 .030 80);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono",
          "JetBrains Mono", Menlo, Consolas, monospace;

  --rail: 264px;
  --toc: 220px;
  --measure: 68ch;
  --r-s: 3px;
  --r-m: 6px;

  --ease: cubic-bezier(.16, 1, .3, 1);
  --t: 180ms;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:        oklch(.205 .012 55);
  --surface-sunk:   oklch(.172 .010 55);
  --surface-raise:  oklch(.248 .013 55);
  --ink:            oklch(.93  .008 78);
  --ink-2:          oklch(.74  .010 70);
  --ink-3:          oklch(.55  .010 60);
  --rule:           oklch(.302 .012 55);
  --rule-2:         oklch(.385 .014 55);
  --garnet:         oklch(.66  .15  20);
  --garnet-deep:    oklch(.74  .14  22);
  --garnet-wash:    oklch(.265 .035 28);
  --garnet-on:      oklch(.16  .015 30);
  --pine:           oklch(.68  .11  158);
  --pine-wash:      oklch(.245 .030 158);
  --ochre:          oklch(.75  .11  75);
  --ochre-wash:     oklch(.262 .032 75);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:        oklch(.205 .012 55);
    --surface-sunk:   oklch(.172 .010 55);
    --surface-raise:  oklch(.248 .013 55);
    --ink:            oklch(.93  .008 78);
    --ink-2:          oklch(.74  .010 70);
    --ink-3:          oklch(.55  .010 60);
    --rule:           oklch(.302 .012 55);
    --rule-2:         oklch(.385 .014 55);
    --garnet:         oklch(.66  .15  20);
    --garnet-deep:    oklch(.74  .14  22);
    --garnet-wash:    oklch(.265 .035 28);
    --garnet-on:      oklch(.16  .015 30);
    --pine:           oklch(.68  .11  158);
    --pine-wash:      oklch(.245 .030 158);
    --ochre:          oklch(.75  .11  75);
    --ochre-wash:     oklch(.262 .032 75);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
::selection { background: var(--garnet-wash); color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--garnet);
  outline-offset: 2px;
  border-radius: 2px;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 200;
  background: var(--garnet); color: var(--garnet-on);
  padding: 10px 16px; border-radius: var(--r-s); font-weight: 700; font-size: .9rem;
  transition: top var(--t) var(--ease);
}
.skip:focus { top: 12px; }

/* ---------------- Shell ---------------- */

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--rule);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 26px 14px 48px;
  background: var(--surface);
}

.mast { padding: 0 10px 26px; }
.mast .wordmark {
  font-family: var(--mono); font-size: .8rem; font-weight: 600; letter-spacing: .02em;
  color: var(--garnet); display: block;
}
.mast h1 {
  font-size: 1.02rem; font-weight: 750; letter-spacing: -.02em;
  line-height: 1.25; margin: 4px 0 0;
}
.mast p { font-size: .78rem; color: var(--ink-2); margin: 3px 0 0; line-height: 1.45; }

.navgroup { margin-bottom: 26px; }
.navgroup > .glabel {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); padding: 0 10px 9px; display: block;
}

.nav {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-s);
  font-size: .885rem; color: var(--ink-2);
  transition: background-color var(--t) var(--ease), color var(--t) var(--ease);
  position: relative;
}
.nav:hover { background: var(--surface-sunk); color: var(--ink); }
.nav[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--surface-sunk); }
.nav[aria-current="page"]::before {
  content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 3px; background: var(--garnet); border-radius: 50%;
}
.nav .glyph { color: var(--ink-3); font-size: .82rem; width: 14px; text-align: center; flex: none; }
.nav[aria-current="page"] .glyph { color: var(--garnet); }
.nav .n {
  margin-left: auto; font-family: var(--mono); font-size: .72rem; font-weight: 600;
  color: var(--ink-2); flex: none;
}
.nav .mono-code {
  font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .02em;
  color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 2px;
  width: 30px; text-align: center; flex: none; padding: 1px 0;
}
.nav[aria-current="page"] .mono-code { color: var(--garnet); border-color: var(--garnet); }

/* ---------------- Topbar ---------------- */

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter: saturate(160%) blur(10px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 14px;
  padding: 11px 32px;
}
.crumbs {
  font-size: .8rem; color: var(--ink-2); display: flex; align-items: center; gap: 8px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.crumbs b { color: var(--ink); font-weight: 650; }
.crumbs a { color: var(--ink-2); }
.crumbs a:hover { color: var(--garnet); }
.crumbs .sep { color: var(--ink-3); }

.finder {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--surface-raise); border: 1px solid var(--rule-2);
  border-radius: var(--r-s); padding: 5px 10px; width: 250px; max-width: 38vw;
  transition: border-color var(--t) var(--ease);
}
.finder:focus-within { border-color: var(--garnet); }
.finder .g { color: var(--ink-3); font-size: .85rem; flex: none; }
.finder input {
  border: 0; background: transparent; outline: none; color: var(--ink);
  font-family: var(--sans); font-size: .85rem; width: 100%; min-width: 0;
}
.finder input::placeholder { color: var(--ink-3); }
.finder kbd {
  font-family: var(--mono); font-size: .68rem; color: var(--ink-2);
  border: 1px solid var(--rule-2); border-radius: 2px; padding: 0 5px; flex: none;
}

.iconbtn {
  border: 1px solid var(--rule-2); background: var(--surface-raise); color: var(--ink-2);
  border-radius: var(--r-s); width: 32px; height: 32px; flex: none;
  display: grid; place-items: center; font-size: .95rem;
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.iconbtn:hover { color: var(--garnet); border-color: var(--garnet); }
.menubtn { display: none; }

.content { padding: 40px 32px 120px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.reading { max-width: var(--measure); }
.reading table {
  width: 100%; border-collapse: collapse; margin: 18px 0 4px;
  font-size: .82rem; display: block; overflow-x: auto;
}
.reading table thead th {
  text-align: left; font-weight: 700; color: var(--ink-2);
  font-size: .715rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 0 14px 8px; border-bottom: 1px solid var(--rule-2); white-space: nowrap;
}
.reading table td {
  padding: 8px 14px; border-bottom: 1px solid var(--rule); vertical-align: top;
}
.reading table tbody tr:last-child td { border-bottom: none; }
.reading table td:first-child { font-weight: 650; }

/* ---------------- Type ---------------- */

.eyebrow {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--garnet); margin: 0 0 14px;
}
h2.title {
  font-size: 1.95rem; font-weight: 750; letter-spacing: -.026em; line-height: 1.14;
  margin: 0 0 14px; max-width: 22ch;
}
.briefing {
  font-size: clamp(2rem, 1.5rem + 1.9vw, 2.85rem);
  font-weight: 800; letter-spacing: -.035em; line-height: 1.06;
  margin: 0 0 20px; max-width: 17ch;
}
.briefing .quiet { color: var(--ink-2); font-weight: 750; }
.lede { font-size: 1.02rem; color: var(--ink-2); margin: 0 0 32px; max-width: var(--measure); }

h3 {
  font-size: 1.32rem; font-weight: 700; letter-spacing: -.014em; line-height: 1.3;
  margin: 56px 0 14px; scroll-margin-top: 88px;
}
h3:first-of-type { margin-top: 44px; }
h4 { font-size: 1.02rem; font-weight: 700; letter-spacing: -.005em; margin: 32px 0 10px; }
p { margin: 0 0 16px; }
strong, b { font-weight: 650; }
.small { font-size: .865rem; line-height: 1.6; }
.quiet { color: var(--ink-2); }

.mlabel {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); display: flex; align-items: center; gap: 7px;
}
.mlabel code { text-transform: none; letter-spacing: 0; font-weight: 600; }

code {
  font-family: var(--mono); font-size: .84em;
  background: var(--surface-sunk); border: 1px solid var(--rule);
  border-radius: 2px; padding: 1px 5px; word-break: break-word;
}
pre {
  background: var(--surface-sunk); border: 1px solid var(--rule); border-radius: var(--r-m);
  padding: 16px 18px; overflow-x: auto; margin: 0 0 18px;
  font-size: .8rem; line-height: 1.65;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }

ul, ol { margin: 0 0 16px; padding-left: 22px; }
li { margin-bottom: 7px; }
li::marker { color: var(--ink-3); }

hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 48px 0; }

/* ---------------- Chips ---------------- */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .715rem; font-weight: 700; letter-spacing: .04em;
  border-radius: var(--r-s); padding: 3px 9px;
  border: 1px solid var(--rule-2); color: var(--ink-2); background: transparent;
  white-space: nowrap; line-height: 1.5;
}
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }

.chip.v-ok    { color: var(--pine);   border-color: var(--pine); }
.chip.v-warn  { color: var(--ochre);  border-color: var(--ochre); }
.chip.v-conf  { color: var(--garnet-on); background: var(--garnet); border-color: var(--garnet); }

.tcode {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .02em;
  border: 1px solid var(--rule-2); border-radius: 2px;
  padding: 1px 6px; color: var(--ink-2); flex: none;
}
a:hover > .tcode, .row:hover .tcode { border-color: var(--garnet); color: var(--garnet); }

.stars { font-size: .75rem; color: var(--ink-3); letter-spacing: .12em; flex: none; }
.stars .on { color: var(--garnet); }

.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------------- Ledger rows ---------------- */

.ledger { border-top: 1px solid var(--rule); margin: 0 0 8px; }

.row {
  display: block; position: relative;
  padding: 18px 18px 18px 20px;
  border-bottom: 1px solid var(--rule);
  transition: background-color var(--t) var(--ease);
}
a.row:hover, a.row:focus-visible { background: var(--surface-sunk); }
a.row::before {
  content: ""; position: absolute; left: 5px; top: 24px;
  width: 3px; height: 3px; background: var(--garnet);
  opacity: 0; transition: opacity var(--t) var(--ease);
}
a.row:hover::before, a.row:focus-visible::before { opacity: 1; }

.row .rtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
.row .rid {
  font-family: var(--mono); font-size: .72rem; font-weight: 600; letter-spacing: .04em;
  color: var(--ink-2); flex: none;
}
.row .rq { font-size: .97rem; font-weight: 550; line-height: 1.55; margin-bottom: 8px; max-width: 78ch; }
.row .ra { font-size: .845rem; color: var(--ink-2); max-width: 78ch; }
.row .ra .k { color: var(--pine); font-weight: 700; }

/* ---------------- Data strip ---------------- */

.strip {
  display: flex; flex-wrap: wrap;
  border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2);
  margin: 0 0 44px;
}
.strip > div {
  padding: 16px 28px 16px 0; margin-right: 28px;
  border-right: 1px solid var(--rule);
}
.strip > div:last-child { border-right: 0; margin-right: 0; }
.strip .n {
  font-size: 1.7rem; font-weight: 750; letter-spacing: -.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.strip .n.acc { color: var(--garnet); }
.strip .l { font-size: .78rem; color: var(--ink-2); margin-top: 2px; }

/* ---------------- Cards (sparingly) ---------------- */

.card {
  border: 1px solid var(--rule); border-radius: var(--r-m);
  padding: 20px 22px; background: transparent;
}
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* ---------------- Bars ---------------- */

.bar { height: 5px; background: var(--surface-sunk); border-radius: 20px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--garnet); border-radius: 20px; }
.bar.q > i { background: var(--rule-2); }

/* ---------------- Answer blocks ---------------- */

/* Yanlış olmak renk taşımaz: nötr, çökertilmiş, glif + etiketle işaretli. */
.ans-wrong {
  background: var(--surface-sunk); border: 1px solid var(--rule);
  border-radius: var(--r-m); padding: 15px 18px; margin: 0 0 14px;
}
.ans-wrong .mlabel { color: var(--ink-2); margin-bottom: 8px; }
.ans-wrong .body { font-size: .95rem; color: var(--ink-2); }
.ans-wrong .body code { background: var(--surface); }

.ans-right { border-top: 1px solid var(--pine); padding: 15px 2px 4px; margin: 0 0 8px; }
.ans-right .mlabel { color: var(--pine); margin-bottom: 8px; }
.ans-right .body { font-size: .95rem; color: var(--ink); font-weight: 500; }

/* ---------------- Callouts (no side stripes) ---------------- */

.note {
  border: 1px solid var(--rule-2); border-radius: var(--r-m);
  padding: 18px 20px; margin: 0 0 22px;
}
.note .mlabel { margin-bottom: 9px; }
.note p:last-child { margin-bottom: 0; }
.note.acc { border-color: var(--garnet); background: var(--garnet-wash); }
.note.acc .mlabel { color: var(--garnet); }
.note.warn { border-color: var(--ochre); background: var(--ochre-wash); }
.note.warn .mlabel { color: var(--ochre); }
.note.ok { border-color: var(--pine); background: var(--pine-wash); }
.note.ok .mlabel { color: var(--pine); }

/* ---------------- Flow / remember ---------------- */

.remember { background: var(--surface-sunk); border-radius: var(--r-m); padding: 20px 22px; }
.remember .mlabel { margin-bottom: 14px; color: var(--ink); }
.flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flow.vert { flex-direction: column; align-items: flex-start; gap: 8px; }
.flow .node {
  font-family: var(--mono); font-size: .78rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 6px 11px;
}
.flow .node.no { border-color: var(--rule-2); color: var(--ink-2); text-decoration: line-through; }
.flow .node.yes { border-color: var(--pine); color: var(--pine); }
.flow .arrow { color: var(--ink-3); font-size: .9rem; flex: none; }
.flow.vert .arrow { margin-left: 14px; }

/* ---------------- Doc links ---------------- */

.doc {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border: 1px solid var(--rule); border-radius: var(--r-m);
  margin-bottom: 8px;
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease);
}
.doc:hover, .doc:focus-visible { border-color: var(--garnet); background: var(--surface-sunk); }
.doc .g { color: var(--ink-3); font-size: .85rem; flex: none; }
.doc:hover .g { color: var(--garnet); }
.doc .m { min-width: 0; }
.doc .t { font-size: .9rem; font-weight: 600; }
.doc .u { font-family: var(--mono); font-size: .74rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc .x { margin-left: auto; color: var(--ink-3); font-size: .85rem; flex: none; }

/* ---------------- Pills ---------------- */

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .82rem; border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 5px 11px; color: var(--ink-2);
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.pill:hover, .pill:focus-visible { border-color: var(--garnet); color: var(--garnet); }

/* ---------------- Buttons ---------------- */

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .875rem; font-weight: 650;
  border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 9px 16px; color: var(--ink);
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease), color var(--t) var(--ease);
}
.btn:hover { border-color: var(--garnet); color: var(--garnet); }
.btn.pri { background: var(--garnet); border-color: var(--garnet); color: var(--garnet-on); }
.btn.pri:hover { background: var(--garnet-deep); border-color: var(--garnet-deep); color: var(--garnet-on); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }

.back {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .85rem; color: var(--ink-2); margin-bottom: 22px;
  transition: color var(--t) var(--ease);
}
.back:hover { color: var(--garnet); }

/* ---------------- Filters ---------------- */

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.fbtn {
  font-size: .82rem; border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 6px 13px; color: var(--ink-2);
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease), color var(--t) var(--ease);
}
.fbtn:hover { border-color: var(--garnet); color: var(--garnet); }
.fbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.fbtn .n { font-family: var(--mono); font-size: .74rem; opacity: .75; margin-left: 5px; }

/* ---------------- TOC ---------------- */

.with-toc { display: grid; grid-template-columns: minmax(0, 1fr) var(--toc); gap: 56px; align-items: start; }
.toc { position: sticky; top: 88px; font-size: .82rem; }
.toc .mlabel { margin-bottom: 12px; }
.toc a {
  display: block; color: var(--ink-2); padding: 5px 0 5px 14px;
  border-left: 1px solid var(--rule);
  transition: color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.toc a:hover { color: var(--garnet); border-left-color: var(--garnet); }

/* ---------------- Roadmap ---------------- */

.road { position: relative; padding-left: 34px; }
.road::before {
  content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px;
  width: 2px; background: var(--rule);
}
.step { position: relative; margin-bottom: 22px; }
.step .dot {
  position: absolute; left: -34px; top: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--rule-2);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: .6rem; font-weight: 700; color: var(--ink-2);
}

const EXAMS_BUILTIN = {
  1: { name: "Practice Exam 1", attempt: "Deneme 4", total: 65, correct: 55, wrong: 10 },
  2: { name: "Practice Exam 2", attempt: "Deneme 3", total: 60, correct: 44, wrong: 16 },

};

/* ============================================================
   DURUM — built-in kayıtlar + localStorage içe-aktarımı
============================================================ */

const LS_KEY = "ccaf_state_v3";
const LS_KEY_LEGACY = "ccaf_imported_v2";

/* v2 → v3 tek seferlik taşıma: reviewLog + settings eklenir. Eski key güvenli
   geri dönüş için silinmez; v3 bir kez yazıldıktan sonra ondan okunur. */
function loadStore(){
  const empty = { mistakes: [], exams: {}, reviewLog: {}, settings: {} };
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      const legacy = localStorage.getItem(LS_KEY_LEGACY);
      if (legacy) {
        const s = JSON.parse(legacy);
        const migrated = { mistakes: s.mistakes || [], exams: s.exams || {}, reviewLog: {}, settings: {} };
        try { localStorage.setItem(LS_KEY, JSON.stringify(migrated)); } catch (e) {}
        return migrated;
      }
      return empty;
    }
    const s = JSON.parse(raw);
    return {
      mistakes: s.mistakes || [], exams: s.exams || {},
      reviewLog: s.reviewLog || {}, settings: s.settings || {},
    };
  } catch (e) { return empty; }
}
function persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STORE)); } catch (e) {} }

let STORE = loadStore();
let M = M_BUILTIN.concat(STORE.mistakes);
let EXAMS = Object.assign({}, EXAMS_BUILTIN, STORE.exams);
function rebuild(){
  M = M_BUILTIN.concat(STORE.mistakes);
  EXAMS = Object.assign({}, EXAMS_BUILTIN, STORE.exams);
}

const byId = id => M.find(m => m.id === id);
const inTopic = t => M.filter(m => m.topic === t);
const isImported = m => STORE.mistakes.some(x => x.id === m.id);

/* Konu monogramı — emoji yerine mono kod. Renk körlüğü güvenli, tarama hızlı. */
const TOPIC_CODE = { pe: "PE", tool: "MCP", cc: "CC", agent: "AG", ctx: "CTX" };

/* Verdict tek kroma eksenidir: "resmî kaynak ne diyor". */
const VERDICT = {
  ok:            { glyph: "✓", label: "Resmî dokümanla uyumlu",   short: "Uyumlu",        cls: "v-ok"   },
  conflict:      { glyph: "⚠", label: "Kurs cevabı resmî dokümanla ÇELİŞİYOR", short: "Çelişki", cls: "v-conf" },
  dated:         { glyph: "◑", label: "Kabaca doğru ama güncel değil", short: "Güncel değil", cls: "v-warn" },
  authoritative: { glyph: "★", label: "Resmî doğruyu veren referans soru", short: "Doğruyu veren", cls: "v-ok" },
  unverified:    { glyph: "◷", label: "Henüz resmî kaynakla doğrulanmadı", short: "Doğrulanmadı", cls: "v-warn" },
};

/* İçe aktarılan metin ham yapıştırmadır — kaçırılır. Built-in kayıtlar HTML içerir. */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function field(m, key){ return isImported(m) ? esc(m[key]) : (m[key] || ""); }

/* ============================================================
   ROUTING
============================================================ */

const view = document.getElementById("view");
const crumbEl = document.getElementById("crumbs");
const mainEl = document.getElementById("main");

function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [base, arg] = h.split("/");
  return { base: base || "", arg: arg ? decodeURIComponent(arg) : "" };
}

let booted = false;

function router(){
  const { base, arg } = parseHash();
  const finder = document.getElementById("finder");
  if (finder) finder.value = "";
  window.scrollTo(0, 0);

  const handler = App.router.routes[base] || App.router.routes["*"];
  handler(arg);

  buildRail();
  closeMobileNav();
  if (booted) mainEl.focus({ preventScroll: true });
  booted = true;
}
window.addEventListener("hashchange", router);

/* ============================================================
   KABUK — rail + breadcrumb
============================================================ */

/* Rail veri-güdümlü: App.router.navGroups üzerinden çizilir. Özellikler kendi
   nav öğelerini App.router.addNav(group, item) ile ekler; bu fonksiyon dokunulmaz. */
function navItemHTML(it, base, arg){
  const active = it.active ? it.active(base, arg) : false;
  const count = typeof it.count === "function" ? it.count() : it.count;
  const badge = it.code
    ? `<span class="mono-code" aria-hidden="true">${it.code}</span>`
    : `<span class="glyph" aria-hidden="true">${it.glyph}</span>`;
  return `<a class="nav" href="#/${it.hash}"${active ? ' aria-current="page"' : ""}>
    ${badge}
    <span>${it.label}</span>
    ${count != null ? `<span class="n">${count}</span>` : ""}
  </a>`;
}

function buildRail(){
  const { base, arg } = parseHash();
  const groups = App.router.navGroups.map(g => {
    const items = g.items.map(it => navItemHTML(it, base, arg)).join("");
    return `<div class="navgroup"><span class="glabel">${g.label}</span>${items}</div>`;
  }).join("");

  document.getElementById("rail").innerHTML = `
    <div class="mast">
      <a href="#/" aria-label="Panele dön">
        <span class="wordmark">CCA-F</span>
        <h1>Study Console</h1>
        <p>Yanlışlardan türetilmiş kişisel dosya</p>
      </a>
    </div>
    ${groups}`;
}

function setCrumbs(arr){
  crumbEl.innerHTML = arr.map((c, i) => {
    if (i === arr.length - 1) return `<b>${c.t}</b>`;
    const node = c.h ? `<a href="${c.h}">${c.t}</a>` : `<span>${c.t}</span>`;
    return `${node}<span class="sep" aria-hidden="true">/</span>`;
  }).join("");
}

/* ============================================================
   PARÇALAR
============================================================ */

function topicTag(k){
  return `<span class="tcode" title="${TOPICS[k].name}">${TOPIC_CODE[k]}</span>
    <span class="small quiet">${TOPICS[k].short}</span>`;
}

function diffStars(d){
  const labels = ["", "kolay", "orta", "zor"];
  return `<span class="stars" title="Zorluk: ${labels[d]}" aria-label="Zorluk: ${labels[d]}">
    <span class="on">${"★".repeat(d)}</span>${"☆".repeat(3 - d)}</span>`;
}

function verdictChip(v, full){
  const x = VERDICT[v]; if (!x) return "";
  return `<span class="chip ${x.cls}"><span aria-hidden="true">${x.glyph}</span>${full ? x.label : x.short}</span>`;
}

function rowHTML(m){
  const c = field(m, "correct");
  const short = c.length > 130 ? c.slice(0, 128) + "…" : c;
  return `<a class="row" href="#/q/${m.id}">
    <div class="rtop">
      <span class="rid">E${m.exam}·Q${m.q}</span>
      ${topicTag(m.topic)}
      ${diffStars(m.diff)}
      ${m.verdict !== "ok" ? verdictChip(m.verdict) : ""}
      ${isImported(m) ? badge("İçe aktarıldı") : ""}
    </div>
    <div class="rq">${field(m, "scenario")}</div>
    <div class="ra"><span class="k">Doğrusu:</span> ${short}</div>
  </a>`;
}

function ledger(items, emptyMsg){
  if (!items.length) return `<p class="empty">${emptyMsg || "Kayıt yok."}</p>`;
  return `<div class="ledger">${items.map(rowHTML).join("")}</div>`;
}

function docHTML(title, url){
  let host = url; try { host = new URL(url).host; } catch (e) {}
  return `<a class="doc" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
    <span class="g" aria-hidden="true">❖</span>
    <span class="m"><span class="t">${esc(title)}</span><span class="u">${esc(host)}</span></span>
    <span class="x" aria-hidden="true">↗</span>
  </a>`;
}

/* ------------------------------------------------------------
   Parça kütüphanesi — tekrar eden HTML tek yerde.
   Görünüm değişince buradan değişir. Yeni özellikler App.components.* kullanır.
------------------------------------------------------------ */

/* Sayaç rozeti. Varsayılan nokta glifi; opts.cls/opts.glyph durum rozetleri için. */
function badge(text, opts){
  const o = opts || {};
  const cls = o.cls ? " " + o.cls : "";
  const mark = o.glyph ? `<span aria-hidden="true">${o.glyph}</span>` : `<span class="dot"></span>`;
  return `<span class="chip${cls}">${mark}${text}</span>`;
}

/* İlerleme çubuğu. opts.muted → soluk (.q), opts.maxWidth → satır-içi genişlik. */
function progressBar(pct, opts){
  const o = opts || {};
  const cls = o.muted ? " q" : "";
  const style = o.maxWidth ? ` style="max-width:${o.maxWidth}"` : "";
  return `<div class="bar${cls}"${style}><i style="width:${pct}%"></i></div>`;
}

/* Kılcal-kutu callout (.note). tone: acc | warn | ok. body ham HTML. */
function callout(o){
  const tone = o.tone ? " " + o.tone : "";
  const reading = o.reading === false ? "" : " reading";
  const style = o.style ? ` style="${o.style}"` : "";
  const label = o.label
    ? `<span class="mlabel">${o.glyph ? `<span aria-hidden="true">${o.glyph}</span>` : ""}${o.label}</span>`
    : "";
  return `<div class="note${tone}${reading}"${style}>${label}${o.body || ""}</div>`;
}

/* Sağ sütun içindekiler. items: [{href,label}] veya falsy (atlanır). */
function toc(title, items){
  const links = items.filter(Boolean).map(it => `<a href="${it.href}">${it.label}</a>`).join("");
  return `<aside class="toc" aria-label="Sayfa içeriği">
    <span class="mlabel">${title}</span>
    ${links}
  </aside>`;
}

/* Genel bölüm: başlık + gövde. Yeni view'lar için. */
function section(title, body, opts){
  const o = opts || {};
  const id = o.id ? ` id="${o.id}"` : "";
  return `<h3${id}>${title}</h3>${body}`;
}

/* Sınav kartı (panel). */
function examCard(ex){
  const pct = ex.total ? Math.round(ex.correct / ex.total * 100) : 0;
  const pass = pct >= 72;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <h4 style="margin:0">${esc(ex.name)}</h4>
      <span class="small quiet">${esc(ex.attempt || "")}</span>
    </div>
    <div class="small quiet" style="margin:6px 0 14px">${ex.correct} doğru · ${ex.wrong} yanlış · ${ex.total} soru</div>
    ${progressBar(pct)}
    <div class="small quiet" style="margin-top:9px">
      %${pct} · geçme eşiği ~%72
      ${pass ? `<span class="chip v-ok" style="margin-left:6px"><span aria-hidden="true">✓</span>Geçer</span>`
             : `<span class="chip v-warn" style="margin-left:6px"><span aria-hidden="true">◑</span>Eşik altı</span>`}
    </div>
  </div>`;
}

/* Not kartı (notlar listesi satırı). */
function noteCard(n){
  return `<a class="row" href="#/note/${n.id}">
    <div class="rtop">
      <span class="tcode">${TOPIC_CODE[n.topic]}</span>
      <b>${n.title}</b>

let parsed = null;

function mapDomain(s){
  s = (s || "").toLowerCase();
  if (s.includes("prompt engineering")) return "pe";
  if (s.includes("tool design") || s.includes("mcp")) return "tool";
  if (s.includes("claude code")) return "cc";
  if (s.includes("agentic")) return "agent";
  if (s.includes("context")) return "ctx";
  return "pe";
}

function parseUdemy(text){
  const lines = text.split("\n").map(l => l.trim()).filter(l => l.length);
  const exNum   = (text.match(/Practice Exam\s+(\d+)/i) || [])[1] || "";
  const attempt = (text.match(/Deneme\s+\d+/i) || [])[0] || "";
  const total   = (text.match(/(\d+)\s*tümü/) || [])[1];
  const correct = (text.match(/(\d+)\s*doğru/) || [])[1];
  const wrong   = (text.match(/(\d+)\s*yanlış/) || [])[1];
  const nameM   = text.match(/(Practice Exam[^\n]*?)\s*-\s*Sonuçlar/i);

  const CORR  = ["Doğru cevap", "Doğru seçim"];
  const WRONG = ["Cevabınız yanlış", "Seçiminiz yanlış"];
  const MARK  = ["Doğru cevap", "Doğru seçim", "Cevabınız yanlış", "Seçiminiz yanlış", "Seçiminiz doğru"];

  const hdr = [];
  lines.forEach((l, i) => { if (/^Soru\s+\d+$/.test(l)) hdr.push(i); });

  const mistakes = [];
  hdr.forEach((start, hi) => {
    const end = (hi + 1 < hdr.length) ? hdr[hi + 1] : lines.length;
    let B = lines.slice(start, end);
    const fi = B.findIndex(l => /Sonuçlara genel bakış|En üste geri dön|Kurs içeriği/.test(l));
    if (fi > 0) B = B.slice(0, fi);
    if (!B.some(l => WRONG.includes(l))) return; // yalnızca yanlışlar

    const qNum = (B[0].match(/^Soru\s+(\d+)$/) || [])[1];
    const dai = B.findIndex(l => l.includes("Bunu daha detaylı açıkla"));
    const sStart = dai >= 0 ? dai + 1 : 2;
    let sEnd = B.findIndex((l, idx) => idx >= sStart && MARK.includes(l));
    if (sEnd < 0) sEnd = sStart + 1;
    const scenario = B.slice(sStart, sEnd).join(" ");

    const correctParts = [], yourParts = [];
    let whyText = "";
    B.forEach((l, idx) => {
      if (CORR.includes(l) && B[idx + 1]) correctParts.push(B[idx + 1]);
      if (WRONG.includes(l) && B[idx + 1]) {
        yourParts.push(B[idx + 1]);
        if (!whyText && B[idx + 2] === "Açıklama" && B[idx + 3]) whyText = B[idx + 3];
      }
    });

    const gi = B.findIndex(l => l.includes("Genel açıklama"));
    const ei = B.findIndex(l => l.includes("Etki alanı"));
    let official = "", docs = [];
    if (gi >= 0) official = B.slice(gi + 1, ei > gi ? ei : B.length).join(" ");
    const ref = (official.match(/(?:Ref|Reference)\.?:\s*(https?:\/\/\S+)/i) || [])[1];
    official = official.replace(/(?:Ref|Reference)\.?:\s*https?:\/\/\S+/i, "").trim();
    if (ref) docs.push(["Kursun verdiği kaynak", ref]);
    const domain = (ei >= 0 && B[ei + 1]) ? B[ei + 1] : "";

    mistakes.push({
      id: "u" + exNum + "q" + qNum, exam: +exNum, q: +qNum,
      topic: mapDomain(domain), diff: 2,
      concepts: [], related: [], verdict: "unverified", docs,
      scenario: scenario || "(senaryo ayrıştırılamadı)",
      your: yourParts.join("  ·  ") || "—",
      correct: correctParts.join("  ·  ") || "—",
      why: whyText || "İçe aktarıldı. Resmî doğrulama ve koçluk için aşağıdaki kopyala düğmesini kullan.",
      official: official || "Kurs genel açıklaması bulunamadı.",
    });
  });

  const exam = {
    num: +exNum,
    name: nameM ? nameM[1].trim() : ("Practice Exam " + exNum),
    attempt, total: +total || 0, correct: +correct || 0, wrong: +wrong || mistakes.length,
  };
  return { exam, mistakes };
}

function cancelImport(){ parsed = null; document.getElementById("previewArea").innerHTML = ""; }

function commitImport(){
  if (!parsed) return;
  const ids = new Set(parsed.mistakes.map(m => m.id));
  STORE.mistakes = STORE.mistakes.filter(m => !ids.has(m.id)).concat(parsed.mistakes);
  if (parsed.exam && parsed.exam.num) {
    STORE.exams[parsed.exam.num] = {
      name: parsed.exam.name, attempt: parsed.exam.attempt,
      total: parsed.exam.total, correct: parsed.exam.correct, wrong: parsed.exam.wrong,
    };
  }
  persist(); rebuild(); parsed = null;
  renderImport(); buildRail();
}

function deleteImportedExam(num){
  STORE.mistakes = STORE.mistakes.filter(m => String(m.exam) !== String(num));
  delete STORE.exams[num];
  persist(); rebuild(); renderImport(); buildRail();
}

function clearAllImported(){
  STORE = { mistakes: [], exams: {} };
  persist(); rebuild(); renderImport(); buildRail();
}

const finderEl = document.getElementById("finder");

function runSearch(q){
  const needle = q.trim().toLowerCase();
  if (!needle) { router(); return; }

  const hits = M.filter(m => {
    const hay = [m.scenario, m.correct, m.your, m.why, m.official,
                 TOPICS[m.topic].name, TOPICS[m.topic].short,
                 "e" + m.exam + "q" + m.q, "q" + m.q].join(" ").toLowerCase();
    return hay.includes(needle);
  });

  setCrumbs([{ t: "Arama" }, { t: `${hits.length} sonuç` }]);
  view.innerHTML = `
    <p class="eyebrow">Arama</p>
    <h2 class="title">“${esc(q.trim())}”</h2>
    <p class="lede">${hits.length} sonuç. Aramayı temizlemek için alanı boşalt veya Esc'e bas.</p>
    ${ledger(hits, "Eşleşen yanlış yok. Başka bir terim dene.")}`;
  window.scrollTo(0, 0);
}

let searchTimer = null;
finderEl.addEventListener("input", e => {
  const v = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(v), 120);
});
finderEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { e.target.value = ""; e.target.blur(); router(); }

document.addEventListener("keydown", e => {

    e.preventDefault(); finderEl.focus();
  }
});

const themeBtn = document.getElementById("themeBtn");

(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
})();

themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  themeBtn.setAttribute("aria-label", next === "dark" ? "Açık temaya geç" : "Koyu temaya geç");
});

const App = {

    get M(){ return M; }, get EXAMS(){ return EXAMS; }, get STORE(){ return STORE; },
  },

  state: {
    get reviewLog(){ return STORE.reviewLog; },
    get mFilter(){ return mFilter; }, set mFilter(v){ mFilter = v; },
  },

  storage: { load: loadStore, persist, rebuild },

  utils: { esc, field, host: hostOf },

  components: {
    topicTag, diffStars, verdictChip, row: rowHTML, questionCard: rowHTML,
    ledger, doc: docHTML, badge, progressBar, callout, toc, section, examCard, noteCard,
  },

  /* Faz 3'te dolar. Özellikler kendi servisini buraya ekler. */
  services: { analytics: {}, graph: {}, learning: {}, import: {}, search: {} },

  router: {
    routes: {}, navGroups: [],
    parseHash, setCrumbs, buildRail, refresh: router,
    go(hash){ location.hash = hash; },
    add(base, handler){ this.routes[base] = handler; return this; },
    addNav(group, item, atStart){
      let g = this.navGroups.find(x => x.label === group);
      if (!g) { g = { label: group, items: [] }; this.navGroups.push(g); }
      if (atStart) g.items.unshift(item); else g.items.push(item);
      return this;
    },
  },

  views: {
    dashboard: renderDashboard, topics: renderTopics, topic: renderTopic,
    mistakes: renderMistakes, question: renderQuestion, conflicts: renderConflicts,
    connections: renderConnections, notes: renderNotes, note: renderNote,
    roadmap: renderRoadmap, resources: renderResources, import: renderImport,
    search: runSearch,
  },

  init(){
    document.documentElement.lang = "tr";
    router();
  },
};

/* ============================================================
   SERVİSLER — saf mantık, UI yok. Faz 4 özellikleri bunlara dayanır.
   reviewLog okunur; not/derece YOK — yalnızca tekrar sinyali (zaman + sayı).
============================================================ */

const analytics = {
  DAY: 864e5,

  /* Konu yanlış yoğunluğu, çoktan aza. */
  topicLoad(){
    return Object.keys(TOPICS)
      .map(k => ({ topic: k, count: inTopic(k).length }))
      .sort((a, b) => b.count - a.count);
  },
  weakTopics(n = 3){ return analytics.topicLoad().slice(0, n); },
  strongTopics(n = 3){ return analytics.topicLoad().slice().reverse().slice(0, n); },

  conflictCount(){ return M.filter(m => m.verdict === "conflict").length; },
  datedCount(){ return M.filter(m => m.verdict === "dated").length; },

  reviewCount(id){ const l = STORE.reviewLog[id]; return l ? l.length : 0; },
  lastReviewed(id){ const l = STORE.reviewLog[id]; return l && l.length ? l[l.length - 1] : null; },
  daysSince(id){ const t = analytics.lastReviewed(id); return t == null ? Infinity : (Date.now() - t) / analytics.DAY; },

  /* Ustalık 0..1: tekrar derinliği + tazelik. Derece değil, tekrar sinyali. */
  mastery(id){
    const c = analytics.reviewCount(id);
    if (!c) return 0;
    const recency = Math.max(0, 1 - analytics.daysSince(id) / 30); // ~30 günde unutma
    const depth = Math.min(1, c / 3);                              // ~3 tekrarda oturur
    return Math.round((0.5 * depth + 0.5 * recency) * 100) / 100;
  },

  /* Tekrar önceliği (yüksek = önce). Hiç görülmemiş / vadesi geçmiş / çelişki / zor öne çıkar. */
  reviewPriority(id){
    const m = byId(id); if (!m) return 0;
    const c = analytics.reviewCount(id);
    const d = analytics.daysSince(id);
    const overdue = d === Infinity ? 2 : Math.min(2, d / 14);
    const conflictBoost = m.verdict === "conflict" ? 1 : (m.verdict === "dated" ? 0.5 : 0);
    const diffBoost = (m.diff || 1) / 3;
    const unseen = c === 0 ? 1 : 0;
    return overdue + conflictBoost + diffBoost + unseen;
  },

  /* Son `days` günün günlük review sayıları, eski→yeni. */
  trend(days = 14){
    const now = Date.now(); const buckets = {};
    for (const id in STORE.reviewLog) {
      for (const t of STORE.reviewLog[id]) {
        const idx = Math.floor((now - t) / analytics.DAY);
        if (idx >= 0 && idx < days) buckets[idx] = (buckets[idx] || 0) + 1;
      }
    }
    const arr = []; for (let i = days - 1; i >= 0; i--) arr.push(buckets[i] || 0);
    return arr;
  },

  totalReviews(){ let n = 0; for (const id in STORE.reviewLog) n += STORE.reviewLog[id].length; return n; },
  reviewedCount(){ return Object.keys(STORE.reviewLog).filter(id => STORE.reviewLog[id].length).length; },

  stats(){
    return {
      weakTopics: analytics.weakTopics(), strongTopics: analytics.strongTopics(),
      conflictCount: analytics.conflictCount(), datedCount: analytics.datedCount(),
      totalReviews: analytics.totalReviews(), reviewedCount: analytics.reviewedCount(),
      total: M.length, trend: analytics.trend(),
    };
  },
};
App.services.analytics = analytics;

const graphSvc = {
  /* Zincirlenebilir filtre. App.services.graph.query().topic("pe").verdict("conflict").results() */
  query(source){
    let items = (source || M).slice();
    const api = {
      topic(t){ items = items.filter(m => m.topic === t); return api; },
      concept(c){ items = items.filter(m => (m.concepts || []).includes(c)); return api; },
      verdict(v){ items = items.filter(m => m.verdict === v); return api; },
      exam(n){ items = items.filter(m => String(m.exam) === String(n)); return api; },
      diff(d){ items = items.filter(m => m.diff === d); return api; },
      diffGte(d){ items = items.filter(m => (m.diff || 0) >= d); return api; },
      docHost(h){ items = items.filter(m => (m.docs || []).some(d => hostOf(d[1]).includes(h))); return api; },
      imported(flag = true){ items = items.filter(m => isImported(m) === flag); return api; },
      reviewedWithin(days){ const cut = Date.now() - days * analytics.DAY;
        items = items.filter(m => { const l = STORE.reviewLog[m.id]; return l && l.some(t => t >= cut); }); return api; },
      unreviewed(){ items = items.filter(m => { const l = STORE.reviewLog[m.id]; return !l || !l.length; }); return api; },
      where(fn){ items = items.filter(fn); return api; },
      sort(fn){ items = items.slice().sort(fn); return api; },
      limit(n){ items = items.slice(0, n); return api; },
      results(){ return items; },
      count(){ return items.length; },
      ids(){ return items.map(m => m.id); },
    };
    return api;
  },

  byConcept(c){ return graphSvc.query().concept(c).results(); },

  /* Docs-as-node çekirdeği: her benzersiz doc URL → onu referanslayan sorular + kavramlar. F-E kullanır. */
  docIndex(){
    const idx = {};
    for (const m of M) {
      for (const d of (m.docs || [])) {
        const url = d[1];
        if (!idx[url]) idx[url] = { title: d[0], url, host: hostOf(url), questions: [], concepts: new Set() };
        idx[url].questions.push(m.id);
        for (const c of (m.concepts || [])) idx[url].concepts.add(c);
      }
    }
    return Object.values(idx).map(x => ({ ...x, concepts: [...x.concepts] }));
  },
};
App.services.graph = graphSvc;

/* Cevap baştan gizli; kullanıcı hatırlamaya çalışır, sonra açar. Açılış bir
   review olayı yazar (not/derece YOK). renderQuestion #recall-gate + #recall-body üretir. */
function recallAgo(ts){
  if (ts == null) return "—";
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d <= 0 ? "bugün" : (d === 1 ? "dün" : d + " gün önce");
}
function recallGate(m){
  const A = App.services.analytics;
  const c = A.reviewCount(m.id);
  const seen = c
    ? `<span class="small quiet"><span aria-hidden="true">◷</span> ${c} kez tekrar edildi · son ${recallAgo(A.lastReviewed(m.id))}</span>`
    : `<span class="small quiet">Bu soruyu ilk kez tekrar ediyorsun.</span>`;
  return `<div id="recall-gate" class="note acc reading">
    <span class="mlabel"><span aria-hidden="true">◆</span>Aktif hatırlama</span>
    <p>Cevabı açmadan önce kendine sor: doğrusu ne, sen ne demiştin, neden kaçırdın? Hazır olunca aç.</p>
    <div class="btnrow" style="margin-top:4px;align-items:center;gap:16px">
      <button class="btn pri" onclick="recallReveal('${m.id}')">Cevabımı gördüm — Göster</button>
      ${seen}
    </div>
  </div>`;
}
function recallReveal(id){
  const body = document.getElementById("recall-body");
  const gate = document.getElementById("recall-gate");
  if (body) body.hidden = false;
  if (gate) gate.hidden = true;
  (STORE.reviewLog[id] = STORE.reviewLog[id] || []).push(Date.now());
  persist();
}

/* graph.query() zincirini görsel filtreye bağlar. Anlık sonuç, sayfa yeniden çizilmez. */
function qVal(id){ const el = document.getElementById(id); return el ? el.value : ""; }

function runQuery(){
  const g = App.services.graph;
  const t = qVal("qTopic"), vd = qVal("qVerdict"), df = +qVal("qDiff") || 0, dh = qVal("qHost"), rv = qVal("qReviewed");
  let q = g.query();
  if (t)  q = q.topic(t);
  if (vd) q = q.verdict(vd);
  if (df) q = q.diffGte(df);
  if (dh) q = q.docHost(dh);
  if (rv === "yes") q = q.reviewedWithin(1e6);
  if (rv === "no")  q = q.unreviewed();
  const res = q.results();

  const chain = ["query()", t && `.topic("${t}")`, vd && `.verdict("${vd}")`, df && `.diffGte(${df})`,
    dh && `.docHost("${dh}")`, rv === "yes" && ".reviewedWithin(∞)", rv === "no" && ".unreviewed()"]
    .filter(Boolean).join("");

  document.getElementById("qresults").innerHTML = `
    <div class="meta" style="margin:6px 0 6px"><b>${res.length}</b> sonuç</div>
    <pre class="qchain" style="font-family:var(--mono);font-size:.78rem;color:var(--ink-2);background:var(--surface-sunk);padding:8px 12px;border-radius:4px;margin:0 0 20px;overflow-x:auto">${esc(chain)}</pre>
    ${ledger(res, "Bu filtreyle eşleşen yanlış yok. Bir filtreyi gevşet.")}`;
}

        <h2 class="title" id="dtop">${esc(doc.title)}</h2>
        <div class="btnrow" style="margin:8px 0 28px">
          <a class="btn pri" href="${esc(doc.url)}" target="_blank" rel="noopener noreferrer">Resmî dokümanı aç ↗</a>
        </div>

        ${meta.paragraph
          ? `<h3 id="alinti">İlgili paragraf</h3>${callout({ tone: "acc", glyph: "❖", label: "Dokümandan", body: `<p style="margin-bottom:0">${meta.paragraph}</p>` })}`
          : callout({ tone: "acc", glyph: "◷", label: "Alıntı henüz eklenmedi", body: `<p style="margin-bottom:0">Bu kaynaktan birebir paragraf DOCS_META'ya eklenince burada vurgulanır. Şimdilik dokümanı açıp okuyabilirsin.</p>` })}

        <h3 id="sorular">Bu kaynağı kullanan sorular <span class="quiet">(${questions.length})</span></h3>
        <p class="small quiet reading" style="margin-bottom:20px">Bu dokümana dayanan yanlışların. Doğrulama zinciri burada birleşiyor.</p>
        ${ledger(questions, "Bu kaynağı kullanan soru yok.")}

        ${doc.concepts.length ? `<h3 id="kavram">İlişkili kavramlar</h3>
          <div class="pills">${doc.concepts.map(c => `<a class="pill" href="#/connections">${CONCEPTS[c] || c}</a>`).join("")}</div>` : ""}
      </div>
      ${toc("Bu kaynakta", [
        { href: "#alinti", label: "İlgili paragraf" },
        { href: "#sorular", label: `Sorular (${questions.length})` },
        doc.concepts.length && { href: "#kavram", label: "Kavramlar" },
      ])}
    </div>`;
}
App.views.doc = renderDoc;
App.router.add("doc", arg => renderDoc(arg));
/* === /FEATURE === */

/* === FEATURE: VERSION-HISTORY (kavram-keyed) === */
/* Anthropic sürekli değişiyor (extended → adaptive thinking). Sürüm geçmişi
   KAVRAMA bağlanır, tek soruya değil — M_BUILTIN'e dokunulmaz. Yalnızca resmî
   dokümanla doğrulanmış geçişler; gerisini kullanıcı ekler. */
const VERSIONS = {
  thinking: {
    title: "Extended → Adaptive thinking",
    timeline: [
      { date: "2025", label: "Extended thinking",
        note: "Uzun akıl yürütme <code>thinking: { type: 'enabled', budget_tokens: N }</code> ile açılır (min 1024, &lt; max_tokens).",
        docs: [["Extended thinking", "https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking"]] },
      { date: "2026", label: "Adaptive thinking",
        note: "En yeni modeller (Opus 4.7/4.8, Sonnet 5) <code>enabled</code>'ı reddeder: <code>thinking: { type: 'adaptive' }</code> + <code>output_config: { effort }</code>.",
        docs: [["Steering thinking (adaptive)", "https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost"]] },
    ],
  },
};

function versionTimeline(key){
  const v = VERSIONS[key]; if (!v) return "";
  const steps = v.timeline.map(s => `
    <div style="display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--rule)">
      <span class="mono-code" style="flex:none;align-self:flex-start">${esc(s.date)}</span>
      <div style="min-width:0">
        <b>${esc(s.label)}</b>
        <p class="small" style="margin:4px 0 8px">${s.note}</p>
        ${(s.docs || []).map(d => docHTML(d[0], d[1])).join("")}
      </div>
    </div>`).join("");
  return `<div class="reading">${steps}</div>`;
}

/* Soru sayfası için: sorunun kavramlarından sürüm geçmişi olanları göster. */
function questionVersions(m){
  const keys = (m.concepts || []).filter(c => VERSIONS[c]);
  return keys.map(c => `<h3 id="surum-${c}">Sürüm geçmişi — ${esc(VERSIONS[c].title)}</h3>
    <p class="small quiet reading" style="margin-bottom:4px">Bu kavram zamanla değişti. Sınavda hangi sürümün sorulduğuna dikkat et — eski sözdizimi tuzak olabilir.</p>
    ${versionTimeline(c)}`).join("");
}
App.services.versions = { timeline: versionTimeline, forQuestion: questionVersions, has: k => !!VERSIONS[k] };
/* === /FEATURE === */

App.init();
</script>
