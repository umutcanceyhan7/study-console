/* ---- Oturum kurulumu (#/bank/<topic>) ---- */

let bankSetup = { count: 10, order: "shuffle", filter: "all", mode: "instant" };

function bankSet(key, val){
  bankSetup[key] = val;
  App.router.refresh();
}

function bankPool(topic, filter){
  let pool = topic === "all" ? bankAll().slice() : bankInTopic(topic);
  if (filter === "unseen") pool = pool.filter(q => !bankLastAttempt(q.id));
  else if (filter === "wrong") pool = pool.filter(q => { const l = bankLastAttempt(q.id); return l && !l.ok; });
  else if (filter === "flagged") pool = pool.filter(q => bankFlagged(q.id));
  return pool;
}

function renderBankTopic(topic){
  if (!BANK) { renderBank(); return; }
  const known = topic === "all" || TOPICS[topic];
  if (!known) { renderBank(); return; }

  const name = topic === "all" ? "Karışık" : TOPICS[topic].short;
  setCrumbs([{ t: "Soru bankası", h: "#/bank" }, { t: name }]);

  const pool = bankPool(topic, bankSetup.filter);
  /* Sayı ham geçer, dize tırnaklanır — onclick zaten çift tırnak içinde, o
     yüzden JSON.stringify burada attribute'u kırardı. */
  const segs = (key, opts) => `<div class="segs">${opts.map(o => {
    const arg = typeof o.v === "number" ? o.v : `'${o.v}'`;
    return `<button class="seg" type="button" aria-pressed="${bankSetup[key] === o.v}" onclick="bankSet('${key}', ${arg})">${o.t}</button>`;
  }).join("")}</div>`;

  const counts = [10, 20, 40, 0].filter(c => c === 0 || c <= Math.max(pool.length, 10));
  const n = bankSetup.count === 0 ? pool.length : Math.min(bankSetup.count, pool.length);

  view.innerHTML = `
    <p class="eyebrow">Soru bankası</p>
    <h2 class="briefing">${esc(name)}</h2>
    <p class="lede">${topic === "all" ? "Tüm domainlerden" : TOPICS[topic].name + " domaininden"} havuzda <b>${pool.length}</b> soru var.</p>

    <div class="setrow">
      <span class="mlabel">Filtre</span>
      ${segs("filter", [
        { v: "all", t: "Hepsi" }, { v: "unseen", t: "Hiç çözmediklerim" },
        { v: "wrong", t: "Yanlış yaptıklarım" }, { v: "flagged", t: "İşaretlediklerim" },
      ])}
    </div>

    <div class="setrow">
      <span class="mlabel">Soru sayısı</span>
      ${segs("count", counts.map(c => ({ v: c, t: c === 0 ? "Hepsi" : String(c) })))}
    </div>

    <div class="setrow">
      <span class="mlabel">Sıra</span>
      ${segs("order", [{ v: "shuffle", t: "Karışık" }, { v: "seq", t: "Sınav sırası" }])}
    </div>

    <div class="setrow">
      <span class="mlabel">Mod</span>
      ${segs("mode", [{ v: "instant", t: "Anında geri bildirim" }, { v: "exam", t: "Sınav modu" }])}
      <p class="small quiet" style="margin:9px 0 0;max-width:var(--measure)">Anında modda her cevaptan sonra açıklama açılır. Sınav modunda hepsi sonda — gerçek sınava daha yakın.</p>
    </div>

    ${pool.length ? `<div class="btnrow" style="margin-top:28px">
        <button class="btn pri" onclick="bankStart('${topic}')">${n} soruyla başla →</button>
        <a class="btn" href="#/bank">Geri</a>
      </div>`
      : callout({ tone: "warn", glyph: "⚠", label: "Havuz boş",
          body: `<p style="margin-bottom:0">Bu filtreyle soru kalmadı. Filtreyi değiştir.</p>` })}`;
}

/* ---- Oturum ---- */

function bankStart(topic){
  const pool = bankPool(topic, bankSetup.filter);
  if (!pool.length) return;

  let ids = pool.map(q => q.id);
  if (bankSetup.order === "shuffle") {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  } else {
    ids.sort((a, b) => {
      const x = bankById(a), y = bankById(b);
      return x.exam - y.exam || x.q - y.q;
    });
  }
  if (bankSetup.count > 0) ids = ids.slice(0, bankSetup.count);

  const sid = "s" + Date.now().toString(36);
  BSTORE.sessions[sid] = {
    id: sid, topic, mode: bankSetup.mode, ids,
    i: 0, picks: {}, done: false, started: Date.now(),
  };
  bankPersist();
  App.router.go("#/drill/" + sid);
}

function bankPick(sid, idx){
  const s = BSTORE.sessions[sid];
  if (!s || s.done) return;
  const id = s.ids[s.i];
  if (s.picks[id] !== undefined) return;   /* aynı soruda ikinci tıklama yok */

  s.picks[id] = idx;
  const ok = bankById(id).correct === idx;
  (BSTORE.attempts[id] = BSTORE.attempts[id] || []).push({ t: Date.now(), picked: idx, ok });
  bankPersist();
  renderDrill(sid);
}

function bankNext(sid){
  const s = BSTORE.sessions[sid];
  if (!s) return;
  if (s.i >= s.ids.length - 1) { s.done = true; bankPersist(); App.router.go("#/review/" + sid); return; }
  s.i++; bankPersist(); renderDrill(sid);
}

function bankPrev(sid){
  const s = BSTORE.sessions[sid];
  if (!s || s.i === 0) return;
  s.i--; bankPersist(); renderDrill(sid);
}

function bankToggleFlag(sid){
  const s = BSTORE.sessions[sid];
  if (!s) return;
  const id = s.ids[s.i];
  const at = BSTORE.flagged.indexOf(id);
  if (at >= 0) BSTORE.flagged.splice(at, 1); else BSTORE.flagged.push(id);
  bankPersist(); renderDrill(sid);
}

function bankFinish(sid){
  const s = BSTORE.sessions[sid];
  if (!s) return;
  s.done = true; bankPersist(); App.router.go("#/review/" + sid);
}

/* ---- Çözücü (#/drill/<sid>) ---- */

/* Kursun açıklaması resmî kaynak DEĞİL. CLAUDE.md kuralı: doğrulanmamış
   iddiaya link uydurma, doğrulanmadığını yazı ile söyle. */
function bankExplain(q){
  return callout({ tone: "acc", glyph: "❖", label: "Kursun açıklaması",
    body: `<div>${q.explanation}</div>
      <p class="srcline none">Bu açıklama <b>kursa ait</b> ve resmî dokümana karşı doğrulanmadı. Pratik sınav cevap anahtarları bu projede kaynak sayılmaz — çelişki görürsen resmî doküman kazanır.</p>` });
}

function renderDrill(sid){
  const s = BSTORE.sessions[sid];
  if (!BANK) { App.router.go("#/bank"); return; }
  if (!s) {
    setCrumbs([{ t: "Soru bankası", h: "#/bank" }, { t: "Oturum yok" }]);
    view.innerHTML = `<h2 class="briefing">Oturum bulunamadı</h2>
      <div class="btnrow"><a class="btn pri" href="#/bank">Soru bankasına dön</a></div>`;
    return;
  }
  if (s.done) { renderReview(sid); return; }

  const name = s.topic === "all" ? "Karışık" : TOPICS[s.topic].short;
  setCrumbs([{ t: "Soru bankası", h: "#/bank" }, { t: name, h: "#/bank/" + s.topic }, { t: `Soru ${s.i + 1}` }]);

  const id = s.ids[s.i];
  const q = bankById(id);
  const picked = s.picks[id];
  const answered = picked !== undefined;
  const reveal = answered && s.mode === "instant";

  const opts = q.answers.map((a, k) => {
    let cls = "opt";
    if (reveal && k === q.correct) cls += " ok";
    else if (reveal && k === picked) cls += " no";
    else if (!reveal && k === picked) cls += " sel";
    const fb = reveal && (k === q.correct || k === picked) && q.feedbacks[k]
      ? `<p class="optfb">${q.feedbacks[k]}</p>` : "";
    return `<button class="${cls}" type="button" ${answered ? "disabled" : ""} onclick="bankPick('${sid}', ${k})">
      <span class="key" aria-hidden="true">${k + 1}</span>
      <span class="txt">${a}${fb}</span>
    </button>`;
  }).join("");

  const verdict = reveal
    ? (picked === q.correct
        ? `<span class="chip v-ok"><span aria-hidden="true">✓</span>Doğru</span>`
        : `<span class="chip v-warn"><span aria-hidden="true">✗</span>Yanlış</span>`)
    : "";

  view.innerHTML = `
    <div class="qhead">
      ${topicTag(q.topic)}
      <span class="rid">E${q.exam}·S${q.q}</span>
      ${verdict}
      ${bankFlagged(id) ? `<span class="chip"><span aria-hidden="true">⚑</span>İşaretli</span>` : ""}
      <span class="count">${s.i + 1} / ${s.ids.length}${s.mode === "exam" ? " · sınav modu" : ""}</span>
    </div>
    ${progressBar(Math.round(s.i / s.ids.length * 100), { muted: true })}

    <div class="qstem" style="margin-top:26px">${q.question}</div>
    <div class="opts">${opts}</div>

    ${reveal ? bankExplain(q) : ""}

    <div class="btnrow">
      ${s.i > 0 ? `<button class="btn" onclick="bankPrev('${sid}')">← Önceki</button>` : ""}
      <button class="btn${answered ? " pri" : ""}" onclick="bankNext('${sid}')">
        ${s.i >= s.ids.length - 1 ? "Bitir ve sonucu gör →" : "Sonraki →"}</button>
      <button class="btn" onclick="bankToggleFlag('${sid}')">${bankFlagged(id) ? "İşareti kaldır" : "İşaretle"}</button>
      <button class="btn" onclick="bankFinish('${sid}')">Testi bitir</button>
    </div>
    <p class="small quiet" style="margin-top:14px">Klavye: <code>1</code>-<code>4</code> şık · <code>Enter</code> sonraki · <code>F</code> işaretle</p>`;
}

/* ---- Sonuç (#/review/<sid>) ---- */

function renderReview(sid){
  const s = BSTORE.sessions[sid];
  if (!BANK) { App.router.go("#/bank"); return; }
  if (!s) { renderDrill(sid); return; }

  const name = s.topic === "all" ? "Karışık" : TOPICS[s.topic].short;
  setCrumbs([{ t: "Soru bankası", h: "#/bank" }, { t: name, h: "#/bank/" + s.topic }, { t: "Sonuç" }]);

  const answered = s.ids.filter(id => s.picks[id] !== undefined);
  const wrong = answered.filter(id => s.picks[id] !== bankById(id).correct);
  const right = answered.length - wrong.length;
  const pct = answered.length ? Math.round(right / answered.length * 100) : 0;
  const pass = pct >= 72;

  const byTopic = {};
  for (const id of answered) {
    const q = bankById(id);
    const t = (byTopic[q.topic] = byTopic[q.topic] || { n: 0, ok: 0 });
    t.n++; if (s.picks[id] === q.correct) t.ok++;
  }
  const topicRows = Object.keys(byTopic).map(k => {
    const t = byTopic[k], p = Math.round(t.ok / t.n * 100);
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px">
        <span>${topicTag(k)}</span>
        <span class="small quiet">${t.ok}/${t.n} · %${p}</span>
      </div>
      ${progressBar(p)}
    </div>`;
  }).join("");

  const wrongList = wrong.map(id => {
    const q = bankById(id);
    return `<div class="card" style="margin-bottom:16px">
      <div class="qhead">${topicTag(q.topic)}<span class="rid">E${q.exam}·S${q.q}</span>
        ${bankFlagged(id) ? `<span class="chip"><span aria-hidden="true">⚑</span>İşaretli</span>` : ""}</div>
      <div class="qstem" style="font-size:1rem;margin:10px 0 16px">${q.question}</div>
      <div class="ans-wrong">
        <span class="mlabel"><span aria-hidden="true">✗</span>Senin cevabın</span>
        <div class="body">${q.answers[s.picks[id]]}</div>
      </div>
      <div class="ans-right">
        <span class="mlabel"><span aria-hidden="true">✓</span>Doğrusu</span>
        <div class="body">${q.answers[q.correct]}</div>
      </div>
      ${bankExplain(q)}
    </div>`;
  }).join("");

  const skipped = s.ids.length - answered.length;

  view.innerHTML = `
    <p class="eyebrow">Sonuç · ${esc(name)}</p>
    <h2 class="briefing">${right} / ${answered.length} doğru</h2>
    <p class="lede">%${pct} isabet. Geçme eşiği ~%72 — ${pass ? "bu turda eşiği geçtin." : "bu turda eşiğin altındasın."}
      ${skipped ? ` ${skipped} soru boş bırakıldı.` : ""}</p>

    ${progressBar(pct)}
    <div style="margin:10px 0 40px">
      ${pass ? `<span class="chip v-ok"><span aria-hidden="true">✓</span>Eşik üstü</span>`
             : `<span class="chip v-warn"><span aria-hidden="true">◑</span>Eşik altı</span>`}
    </div>

    ${topicRows ? `<h3>Domain kırılımı</h3><div style="max-width:var(--measure);margin-bottom:40px">${topicRows}</div>` : ""}

    <div class="btnrow" style="margin-bottom:40px">
      ${wrong.length ? `<button class="btn pri" onclick="bankRetryWrong('${sid}')">${wrong.length} yanlışı tekrar çöz →</button>` : ""}
      <a class="btn" href="#/bank/${s.topic}">Yeni test</a>
      <a class="btn" href="#/bank">Soru bankası</a>
    </div>

    ${wrong.length ? `<h3>Yanlışların <span class="quiet">(${wrong.length})</span></h3>
      <p class="small quiet reading" style="margin-bottom:20px">Her birinde önce kendi cevabının neden çekici geldiğini düşün, sonra açıklamayı oku.</p>
      ${wrongList}`
      : callout({ tone: "ok", glyph: "✓", label: "Yanlış yok", body: `<p style="margin-bottom:0">Bu turda hepsi doğru.</p>` })}`;
}

function bankRetryWrong(sid){
  const s = BSTORE.sessions[sid];
  if (!s) return;
  const ids = s.ids.filter(id => s.picks[id] !== undefined && s.picks[id] !== bankById(id).correct);
  if (!ids.length) return;
  const nid = "s" + Date.now().toString(36);
  BSTORE.sessions[nid] = {
    id: nid, topic: s.topic, mode: s.mode, ids,
    i: 0, picks: {}, done: false, started: Date.now(),
  };
  bankPersist();
  App.router.go("#/drill/" + nid);
}

/* ---- Klavye ---- */
/* Tek dinleyici; hangi rotada olduğuna kendisi bakar. Metin alanındayken
   devre dışı, yoksa parola kutusuna "1" yazmak şık seçer. */
document.addEventListener("keydown", ev => {
  const { base, arg } = App.router.parseHash();
  if (base !== "drill" || !arg) return;
  const s = BSTORE.sessions[arg];
  if (!s || s.done) return;
  const tag = (ev.target && ev.target.tagName) || "";
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || ev.metaKey || ev.ctrlKey || ev.altKey) return;

  const q = bankById(s.ids[s.i]);
  if (!q) return;

  if (ev.key >= "1" && ev.key <= String(q.answers.length)) {
    ev.preventDefault(); bankPick(arg, +ev.key - 1);
  } else if (ev.key === "Enter" || ev.key === "ArrowRight") {
    ev.preventDefault(); bankNext(arg);
  } else if (ev.key === "ArrowLeft") {
    ev.preventDefault(); bankPrev(arg);
  } else if (ev.key === "f" || ev.key === "F") {
    ev.preventDefault(); bankToggleFlag(arg);
  }
});

App.views.bank = renderBank;
App.views.bankTopic = renderBankTopic;
App.views.drill = renderDrill;
App.views.review = renderReview;
App.services.bank = {
  get all(){ return bankAll(); },
  get unlocked(){ return !!BANK; },
  meta: BANK_BLOB, weight: BANK_WEIGHT,
  byId: bankById, inTopic: bankInTopic, stats: bankTopicStats, summary: bankSummary,
  attempts: bankAttempts, lastAttempt: bankLastAttempt, flagged: bankFlagged,
  unlock: bankTryUnlock, lock: bankLock,
};
/* Analitik yüzeyine additive bağlantı — mevcut hesaplar değişmez. */
App.services.analytics.bankSummary = bankSummary;

App.router
  .add("bank", arg => (arg ? renderBankTopic(arg) : renderBank()))
  .add("drill", arg => renderDrill(arg))
  .add("review", arg => renderReview(arg))
  .addNav("Çalışma", { glyph: "⊙", label: "Soru bankası", hash: "bank",
    active: b => b === "bank" || b === "drill" || b === "review" }, true);
/* === /FEATURE === */

/* === FEATURE: HOLY NOTES (#/holy · #/holy/<id>) === */
/* Kullanıcının kendi cümleleriyle yazdığı notlar. NOTES resmî dokümanın
   sözcüklerini taşır; burası bilerek onun tersi: kişisel dil, kısa yol,
   "bana böyle oturuyor" formülasyonları. Bu yüzden zorunlu `source` alanı
   yok — bir HOLY notu resmî kaynak iddiası taşımaz. Doğrulanmış bir iddia
   gerekiyorsa gövdeden ilgili NOTES kaydına link verilir.

   Kayıt şekli:
     { id, title, hook, body, topic?, domain?, tags?[] }
   topic/domain isteğe bağlı — etiketsiz not da listelenir. */
const HOLY = [
];

function holyCard(n){
  const tags = (n.tags || []).map(t => badge(t)).join("");
  return `<a class="row" href="#/holy/${n.id}">
    <div class="rtop">
      <span class="tcode" title="${n.domain ? DOMAINS[n.domain].name : "Etiketsiz"}">${n.domain ? "D" + n.domain : "—"}</span>
      <b>${n.title}</b>
      ${n.topic ? badge(TOPICS[n.topic].short) : ""}
      ${tags}
    </div>
    <div class="ra">${n.hook}</div>
  </a>`;
}

function renderHoly(){
  setCrumbs([{ t: "Holy Notes" }]);
  view.innerHTML = `
    <p class="eyebrow">Kendi sözlerim</p>
    <h2 class="title">Holy Notes</h2>
    <p class="lede">Resmî sözcüklerle değil, kendi cümlelerimle yazılmış notlar. <a class="pill" href="#/notes">Notlar</a> bölümü dokümanın dilini korur — burası anladığım hâlini tutar. İkisi çelişirse doküman kazanır; çelişki notun içine yazılır.</p>
    ${HOLY.length
      ? `<div class="ledger">${HOLY.map(holyCard).join("")}</div>`
      : callout({ tone: "acc", glyph: "✦", label: "Henüz not yok", body: `<p style="margin-bottom:0">Bu bölüm senin cümlelerinle dolar. Notu yaz, <code>index.html</code> içindeki <code>HOLY</code> dizisine <code>{ id, title, hook, body }</code> olarak eklensin.</p>` })}`;
}

function renderHolyNote(id){
  const n = HOLY.find(x => x.id === id);
  if (!n) return renderHoly();
  setCrumbs([{ t: "Holy Notes", h: "#/holy" }, { t: n.title }]);
  const meta = [
    n.domain ? `Domain ${n.domain} · ${DOMAINS[n.domain].name} (${DOMAINS[n.domain].weight}%)` : null,
    n.topic ? TOPICS[n.topic].short : null,
  ].filter(Boolean).join(" · ");

  view.innerHTML = `
    <a class="back" href="#/holy"><span aria-hidden="true">←</span>Holy Notes</a>
    ${meta ? `<p class="eyebrow">${meta}</p>` : `<p class="eyebrow">Kendi sözlerim</p>`}
    <h2 class="title">${n.title}</h2>
    <p class="lede">${n.hook}</p>
    <div class="reading">${n.body}</div>`;
}

App.data.HOLY = HOLY;
App.views.holy = renderHoly;
App.views.holyNote = renderHolyNote;
App.router
  .add("holy", arg => (arg ? renderHolyNote(arg) : renderHoly()))
  .addNav("Çalışma", { glyph: "✦", label: "Holy Notes", hash: "holy",
    count: () => HOLY.length || null, active: b => b === "holy" }, true);
/* === /FEATURE === */

App.init();
</script>
