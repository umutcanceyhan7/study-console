    sections: [
      { id: "eli5", h: "In plain terms — the only question that separates the four surfaces", html: `
        <p>Everything in this task statement group reduces to one question: <b>when does this text enter the context window?</b> Not "how important is it", not "how long is it" — <i>when</i>.</p>
        <table>
          <thead><tr><th>Surface</th><th>Enters context</th><th>Costs tokens in a session that never touches it</th></tr></thead>
          <tbody>
            <tr><td><code>CLAUDE.md</code> in the cwd and every ancestor directory</td><td>At launch, <b>in full</b></td><td>Yes — every session, always</td></tr>
            <tr><td><code>CLAUDE.md</code> in a <i>subdirectory</i> below the cwd</td><td>When Claude reads a file in that subtree</td><td>No</td></tr>
            <tr><td><code>.claude/rules/x.md</code> <b>without</b> <code>paths:</code></td><td>At launch, same priority as <code>.claude/CLAUDE.md</code></td><td>Yes</td></tr>
            <tr><td><code>.claude/rules/x.md</code> <b>with</b> <code>paths:</code></td><td>When Claude reads a file matching the glob</td><td>No</td></tr>
            <tr><td>Skill (<code>.claude/skills/name/SKILL.md</code>)</td><td>Body loads on invocation or when the model judges the description relevant</td><td>Only the description line</td></tr>
          </tbody>
        </table>
        <p>The consequence people get wrong: <b>splitting a file does not by itself save context.</b> Moving 400 lines out of <code>CLAUDE.md</code> into three unscoped rule files loads exactly the same 400 lines at launch. The saving comes from changing <i>when</i> it loads — <code>paths:</code> scoping or a skill — not from changing which file it sits in.</p>
        <p>One more framing that explains why none of this is enforcement: <b>CLAUDE.md content is delivered as a user message after the system prompt</b>, not as part of the system prompt. Claude reads it and tries to follow it; there is no compliance guarantee. That is why the answer to "this rule must always hold" is never a memory file — see <a class="pill" href="#/note/hook-vs-prompt">Deterministic Enforcement</a>.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/memory#how-claude-md-files-load" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "How CLAUDE.md files load" (relevant section) <span aria-hidden="true">↗</span></a></p>` },

        <p>Task Statement 3.1 names this skill directly: split large <code>CLAUDE.md</code> files into focused topic files in <code>.claude/rules/</code> — <code>testing.md</code>, <code>api-conventions.md</code>, <code>deployment.md</code>. Here is the actual move.</p>
        <p><b>Before</b> — one file every session pays for in full:</p>
        <pre><code>your-project/
├── CLAUDE.md          # 480 lines: build, style, testing, API, deploy, terraform
└── src/</code></pre>
        <p><b>After</b> — the always-on core stays, the conditional parts get scoped:</p>
        <pre><code>your-project/
├── CLAUDE.md                     # ~40 lines: build commands, architecture, always-do rules
└── .claude/
    └── rules/
        ├── testing.md            # paths: test files anywhere in the tree
        ├── api-conventions.md    # paths: src/api/**
        ├── deployment.md         # no paths: -> still loads every session, deliberately
        └── frontend/
            └── styling.md        # subdirectories are walked recursively</code></pre>
        <p><b>A real rule file</b>, <code>.claude/rules/testing.md</code> — YAML frontmatter first, then ordinary markdown:</p>
        <pre><code>---
paths:
  - "**/*.test.tsx"
  - "tests/**/*.ts"
---

# Testing conventions

- Use the fixtures in tests/fixtures/, never inline literals.
- Assert on observable behavior, not on implementation details.
- Every bug fix ships with a regression test named after the issue id.</code></pre>
        <p>The mechanics worth memorizing:</p>
        <ul>
          <li>Every <code>.md</code> under <code>.claude/rules/</code> is discovered <b>recursively</b>, so <code>frontend/</code> and <code>backend/</code> subdirectories are a legitimate organization, not a trick.</li>
          <li>A rule <b>without</b> <code>paths:</code> loads at launch at the <b>same priority as <code>.claude/CLAUDE.md</code></b>. Use that on purpose for things every session needs; do not use it and then expect a token saving.</li>
          <li>The docs' size target is <b>under 200 lines per <code>CLAUDE.md</code></b>: longer files consume more context <i>and reduce adherence</i>. Both halves matter — a bloated file is not just expensive, it is less obeyed.</li>
          <li><code>.claude/rules/</code> supports <b>symlinks</b>, so a shared company standards directory can be linked into many repos and stay one source of truth.</li>

      { id: "diagnose", h: "Diagnosing inconsistent behavior — /memory, /context, and loading scope", html: `
        <p>The symptom the exam uses: <i>"Claude follows the project convention in some sessions and ignores it in others."</i> The reflex is not to rewrite the instruction. It is to find out <b>whether the instruction was in the session at all</b>.</p>
        <p>The diagnostic ladder, in order:</p>
        <ul>
          <li><b><code>/memory</code></b> — lists your <code>CLAUDE.md</code>, <code>CLAUDE.local.md</code> and other memory file <i>locations</i> across user and project scope (including entries for files that do not exist yet), lets you toggle auto memory, and opens any of them in your editor.</li>
          <li><b><code>/context</code></b> — the current documentation is explicit that this is the command that answers "did it load": check the list under <b>Memory files</b>. If a file is missing there, Claude cannot see it.</li>
          <li><b>Is it in a scope that loads for this working directory?</b> Claude walks <i>up</i> from the cwd. A rule sitting in a sibling package is never read.</li>
          <li><b>Is it specific enough?</b> "Use 2-space indentation" beats "format code properly".</li>
          <li><b>Does another file contradict it?</b> When two memory files disagree, Claude may pick one arbitrarily — that alone produces "inconsistent across sessions".</li>
          <li><b><code>InstructionsLoaded</code> hook</b> — for the hard cases. It logs exactly which instruction files load, when, and why. This is the tool for path-scoped rules and lazily loaded subdirectory <code>CLAUDE.md</code> files, where "did it load" is genuinely non-obvious.</li>
        </ul>
        <p><b>The exam expects <code>/memory</code>; the docs now split the job.</b> Task Statement 3.1 lists the skill as "using the <code>/memory</code> command to verify which memory files are loaded and diagnose inconsistent behavior across sessions". Current documentation (checked 16 Aug 2026) assigns <code>/memory</code> the listing-and-editing role and says plainly: to check which files actually loaded into the current session, run <code>/context</code>. Pick <code>/memory</code> when it is the only memory-inspection option on the exam; run both in practice.</p>
        <p><b>The classic hierarchy bug</b>, also named in 3.1: a convention lives in one engineer's <code>~/.claude/CLAUDE.md</code>. User-level instructions apply only to that user and are <b>never shared through version control</b>, so a new teammate clones the repo and receives none of them. The fix is a <i>move</i> to <code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code>, not a rewrite.</p>
        <p><b>And the mid-session disappearance:</b> after <code>/compact</code>, the project-root <code>CLAUDE.md</code> is re-read from disk and re-injected. Nested subdirectory <code>CLAUDE.md</code> files and rules with <code>paths:</code> frontmatter are <b>not</b> re-injected — they reload the next time Claude reads a matching file. An instruction that "worked and then stopped" is usually this, not model drift.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/memory#troubleshoot-memory-issues" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Troubleshoot memory issues" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "when", h: "Skill or CLAUDE.md — the threshold table", html: `
        <p>Task Statement 3.2 ends on this choice: skills are <b>on-demand invocation for task-specific workflows</b>, <code>CLAUDE.md</code> is <b>always-loaded universal standards</b>. The discriminator is <b>invocation</b>, never importance.</p>
        <table>

            <tr><td><code>CLAUDE.md</code></td><td>Every session needs this fact, and it is short</td><td>Build and test commands, architecture summary, "always do X" repo standards</td></tr>
            <tr><td><code>.claude/rules/</code> <b>with</b> <code>paths:</code></td><td>It only matters when Claude touches <b>part of the codebase</b>, and that part is identifiable by a glob</td><td>Terraform conventions for <code>terraform/**/*</code>, test conventions for <code>**/*.test.tsx</code></td></tr>
            <tr><td><code>.claude/rules/</code> <b>without</b> <code>paths:</code></td><td>Always needed, but big enough that it deserves its own maintained file (often per team)</td><td>Security requirements, code-style guide</td></tr>
            <tr><td><b>Skill</b></td><td>It is a <b>multi-step procedure</b> that should trigger from the nature of the task</td><td>Release checklist, migration procedure, codebase audit</td></tr>
            <tr><td><b>Slash command</b> (<code>.claude/commands/</code>) or a skill with <code>disable-model-invocation</code></td><td>Invocation must stay a <b>deliberate human act</b></td><td><code>/release-notes</code>, <code>/review</code></td></tr>
            <tr><td><b>Hook</b></td><td>It must run <b>whether or not the model decides to</b></td><td>Mandatory formatter, blocked paths, destructive-command approval</td></tr>
          </tbody>
        </table>
        <p>The documentation states the skills-vs-rules line in one sentence: rules load into context every session or when matching files are opened, so for <b>task-specific instructions that do not need to be in context all the time, use skills</b> — they load only when you invoke them or when Claude determines they are relevant to your prompt.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/memory#organize-rules-with-claude/rules/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Organize rules with .claude/rules/" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p><b>The trap inside the trap:</b> <i>task-scoped</i> and <i>path-scoped</i> are not interchangeable. A code-review checklist is task-scoped — it belongs in a skill, slash command, or subagent. Putting it in <code>.claude/rules/</code> with a <code>paths:</code> glob that approximates "files under review" makes it fire every time Claude touches those files <b>outside</b> a review too. Path scoping triggers on "Claude read a matching file", never on "the user is doing X".</p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §"Prefer scoped memory" (repo root, lines 1405-1420). The current documentation makes the skills-vs-rules distinction but does not spell out the task-vs-path failure mode in these terms.</p>` },
      { id: "frontmatter", h: "Skill frontmatter — context: fork, allowed-tools, argument-hint", html: `

description: Audit dependency licenses and report conflicts
argument-hint: [package-name]
context: fork
agent: Explore
allowed-tools: Bash(npm ls *) Read Grep

Audit the dependency tree for $ARGUMENTS. Report license conflicts

        <ul>

          <li><b>Current-docs detail the guide predates:</b> a forked skill runs in the <b>background</b> by default and its result arrives when it completes; set <code>background: false</code> to wait inside the invoking turn. <code>agent:</code> picks the subagent type. A backgrounded fork gets the narrower background-subagent tool set, and its edits fall outside checkpoints, so <code>/rewind</code> will not undo them.</li>
          <li><b>The documented failure mode of <code>context: fork</code>:</b> it only makes sense for skills with <b>explicit instructions</b>. A skill that is pure guidelines ("use these API conventions") hands the subagent guidance with no task, and it returns nothing useful.</li>

          <li><b><code>allowed-tools</code> — read this one carefully.</b> The exam guide describes it as <i>restricting</i> tool access during skill execution ("limiting to file write operations to prevent destructive actions"). The current documentation says the opposite direction: <code>allowed-tools</code> <b>pre-approves</b> the listed tools for the turn that invokes the skill so Claude can use them without a permission prompt, and states explicitly that it <b>does not restrict which tools are available</b> — every other tool remains callable under your normal permission settings, and the grant clears on your next message. The field that removes tools from the pool is <b><code>disallowed-tools</code></b>. Answer the exam's framing on the exam; write <code>disallowed-tools</code> (or deny rules) in real configuration.</li>

      { id: "rules", h: "Reminders — @imports and path globs", html: `
        <p><b>The <code>@import</code> syntax (3.1)</b></p>
        <ul>
          <li><code>@path/to/file.md</code> anywhere in a <code>CLAUDE.md</code> pulls that file in. Relative and absolute paths both work; <b>relative resolves against the file containing the import</b>, not the working directory.</li>
          <li><b>Imports do not save tokens.</b> Imported files are expanded and loaded into context <b>at launch</b> alongside the <code>CLAUDE.md</code> that references them. The docs say it flatly under "My CLAUDE.md is too large": splitting into <code>@path</code> imports helps organization but does not reduce context. The mechanism that reduces context is <code>paths:</code>-scoped rules.</li>
          <li><b>Hop-limit divergence.</b> The exam guide says imports nest "up to five hops deep"; the current documentation says imported files can recursively import others "with a maximum depth of <b>four</b> hops" (checked 16 Aug 2026). Know the docs number; recognize the guide's.</li>
          <li>Import parsing <b>skips code spans and fenced blocks</b> — wrap a path in backticks to mention it without importing it.</li>

          <li>The <code>AGENTS.md</code> case: Claude Code reads <code>CLAUDE.md</code>, not <code>AGENTS.md</code>. Create a <code>CLAUDE.md</code> containing <code>@AGENTS.md</code> (or symlink) so both toolchains read one file.</li>
          <li><code>claudeMdExcludes</code> skips irrelevant ancestor <code>CLAUDE.md</code> files in a monorepo. Managed-policy <code>CLAUDE.md</code> can never be excluded.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/memory#my-claude-md-is-too-large" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "My CLAUDE.md is too large" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p><b>Path globs in <code>.claude/rules/</code> (3.3)</b></p>

            <tr><td><code>Grep</code></td><td><b>Content</b> — what is <i>inside</i> files</td><td>Finding callers of a function, an error message string, an import statement, a config key</td></tr>
            <tr><td><code>Glob</code></td><td><b>Paths</b> — files by name pattern</td><td><code>**/*.test.tsx</code>, <code>src/**/*.ts</code>, <code>*.{json,yaml}</code></td></tr>
            <tr><td><code>Read</code></td><td>The <b>whole</b> file (or a page of it), with line numbers</td><td>You already know which file, and you need its actual content</td></tr>
            <tr><td><code>Edit</code></td><td>A <b>targeted</b> change anchored to unique text</td><td>The change is local and you can quote a string that appears exactly once</td></tr>
            <tr><td><code>Write</code></td><td>Create or <b>fully overwrite</b> a file</td><td>New file, or a rewrite where a unique anchor does not exist</td></tr>
          </tbody>
        </table>
        <p>Mechanics that decide the right answer more often than the descriptions do:</p>
        <ul>
          <li><b>Grep is ripgrep, not POSIX grep.</b> Regex metacharacters need escaping — finding <code>interface{}</code> in Go takes the pattern <code>interface\\{\\}</code>. Output modes: <code>files_with_matches</code> (default, paths only), <code>content</code> (matching lines with file and line number), <code>count</code>. Scope with <code>glob</code> or <code>type</code>.</li>
          <li><b>They disagree about <code>.gitignore</code>.</b> Grep <b>respects</b> it and skips ignored files; Glob does <b>not</b>, so it finds gitignored files alongside tracked ones. To grep an ignored file, pass its path directly.</li>
          <li><b>Glob results are capped at 100 files</b>, sorted by modification time, with a truncation flag when the cap is hit. A broad glob that returns exactly 100 hits is a signal to narrow, not a complete inventory.</li>
          <li><b>Read paginates.</b> A whole-file read over the token limit returns the first page plus a <code>PARTIAL view</code> notice explaining how to continue with <code>offset</code> and <code>limit</code>. Read does not list directories — that is a shell command.</li>
          <li><b>Write does not append or merge.</b> It replaces the file wholesale. For a partial change to an existing file, the tool is Edit.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/tools-reference#grep-tool-behavior" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Tools reference, "Grep tool behavior" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "editfail", h: "Why Edit fails, and why the fallback is Read + Write rather than another Edit", html: `
        <p>Edit performs <b>exact string replacement</b>. No regex, no fuzzy matching. Three checks must pass:</p>
        <ul>
          <li><b>Read-before-edit</b> — the file must have been read in the current conversation (a <code>PARTIAL view</code> read does not count). Newer models may skip this when reading would not need a permission prompt; older ones never can.</li>
          <li><b>Match</b> — <code>old_string</code> must appear <b>exactly</b> as written. A single character of whitespace or indentation difference misses.</li>
          <li><b>Uniqueness</b> — <code>old_string</code> must appear <b>exactly once</b>. More than one occurrence and the edit is refused.</li>
        </ul>
        <p><b>The failure the exam cares about is the third one</b>, and it explains the fallback. When the anchor is not unique, the two in-tool repairs are: supply a longer <code>old_string</code> carrying enough surrounding context to pin one occurrence, or set <code>replace_all: true</code> to change every occurrence. When neither is available — a repetitive file where no surrounding context disambiguates, or a change that must land in one of several identical blocks — <b>Read the full file and Write it back with the modification</b>.</p>
        <p>Why that beats retrying Edit: a retry is a <b>guess about the file's exact bytes</b>, and each failed guess costs a round trip while telling you nothing new. Read replaces the guess with the file's actual content, and Write then rewrites from something known rather than something assumed. Retrying Edit with a slightly different anchor is the reflex the task statement is written against.</p>
        <p>Two guards worth knowing: viewing a file with <code>cat</code>, <code>head</code>, <code>tail</code>, <code>sed -n</code>, <code>grep</code> or <code>rg</code> on a single file with no pipes also satisfies read-before-edit; and Write to an <i>existing</i> file inherits the same read requirement, so the Read in "Read + Write" is doing double duty — it supplies the content <b>and</b> unlocks the overwrite.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/tools-reference#edit-tool-behavior" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Tools reference, "Edit tool behavior" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "incremental", h: "Incremental understanding — Grep for entry points, then Read to follow imports", html: `
        <ul>
          <li>The shape the task statement names: <b>Grep to find entry points, then Read to follow imports and trace flows</b> — not Read every file upfront. Search narrows the candidate set before any file enters context; reading first inverts that and pays for everything.</li>
          <li>The documented workflow is three prompts, in this order: <i>find the files that handle X</i> → <i>how do these files work together</i> → <i>trace the flow end to end</i>. Locate, then relate, then trace. Each step's output scopes the next step's reading.</li>
          <li><b>The failure mode has a name in the docs:</b> "the infinite exploration" — an unscoped investigation where Claude reads hundreds of files and fills the context. The stated fixes are to <b>scope the investigation narrowly</b> or to <b>hand it to a subagent</b> so the exploration does not consume the main context. That is the same argument as the Explore subagent in Task Statement 3.4 — see <a class="pill" href="#/note/plan-mode">Plan Mode vs Direct Execution vs Explore</a>.</li>
          <li>Practical ordering rule: <b>Glob answers "does this kind of file exist and where", Grep answers "which of them mention this", Read answers "what does this one actually do".</b> Skipping straight to Read means you are answering the third question without having asked the first two.</li>
          <li>Where a language server is available, the <b>LSP tool</b> does this precisely rather than textually: jump to definition, find all references, list symbols, trace call hierarchies. It is inactive until a code-intelligence plugin for the language is installed, which is why text search remains the portable default.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/common-workflows#find-relevant-code" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Common workflows, "Find relevant code" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "wrapper", h: "Tracing usage through wrapper modules — the two-pass shape", html: `
        <p>The task statement's wording is precise and the <b>two passes are the whole point</b>: first identify all exported names, <i>then</i> search for each name across the codebase.</p>
        <ul>
          <li><b>Pass 1 — enumerate the surface.</b> Read the wrapper module (or Grep its <code>export</code> lines) to produce the list of names it actually re-exports. This is a small, bounded read of one or two files.</li>
          <li><b>Pass 2 — search each name.</b> One Grep per exported name across the codebase, scoped with <code>glob</code> or <code>type</code>. The output is call sites, not files-that-might-matter.</li>
          <li><b>Why one pass fails:</b> grepping the wrapper's <i>module path</i> finds importers of the module, not users of any particular function; grepping the underlying implementation's name misses everyone who reached it through the re-export. Neither single search covers the set. The wrapper is precisely the thing that decouples the name you know from the name callers type.</li>
          <li>The same shape recurs for barrel files, facade modules, and <code>index.ts</code> re-exports. Whenever a name can arrive under an alias, enumerate the aliases first and search second.</li>
          <li>Cheap correctness check on pass 2: use Grep's <code>count</code> mode first to see how large each name's blast radius is, then read only the files where the count is non-trivial.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/tools-reference#glob-tool-behavior" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Tools reference, "Glob tool behavior" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>Split the question in two words: <b>content or path?</b> "Find all callers of <code>processPayment</code>" is content → Grep. "Find every test file" is path → Glob. An option offering Glob for a content search is the standard distractor, and vice versa.</li>
          <li><b>"Edit keeps failing on this file"</b> → the anchor is <b>not unique</b>. Correct answers: longer anchor, <code>replace_all</code>, or <b>Read the file and Write it back</b>. Wrong answer: "retry Edit with a different string" — a second guess about bytes you have not looked at.</li>
          <li><b>"Understand a large unfamiliar codebase"</b> → search first, read selectively. Any option that begins "read all files in <code>src/</code>" is wrong <b>on context cost</b>, even when it would technically work.</li>
          <li><b>"Trace usage through a wrapper / barrel / facade"</b> → the answer has <b>two steps</b>. A single-step option, however well phrased, is incomplete by construction.</li>
          <li>Watch the <code>.gitignore</code> asymmetry: if the scenario turns on generated or ignored files, <b>Grep skips them and Glob does not</b>. That detail alone decides some questions.</li>
          <li>Domain 2 habit that carries over from tool design: <b>return the smallest useful result</b>. Grep's <code>files_with_matches</code> before <code>content</code>, <code>count</code> before reading — the same "do the narrowing before the payload" instinct as <a class="pill" href="#/note/mcp-primitives">MCP Primitives</a>.</li>
        </ul>` },
    ],
  },
  {
    id: "iterative-refinement", title: "Iterative Refinement — One Message or Many", topic: "cc", domain: 3, tasks: ["3.5"], concept: "iteration", icon: "⌘",
    summary: "When several things are wrong at once, batching the feedback and sequencing it are different tools: interacting fixes go in one detailed message, independent ones go one at a time. Backed by the Claude Code best-practices and common-workflows documentation plus the exam guide's iteration section (verified 16 Aug 2026). Exam objective: Task Statement 3.5.",
    source: ["Claude Code Docs — Best practices, \"Give Claude a way to verify its work\"", "https://code.claude.com/docs/en/best-practices#give-claude-a-way-to-verify-its-work"],
    sections: [
      { id: "eli5", h: "In plain terms — what \"interacting\" means", html: `
        <p>You have five things to fix. The only question that decides how to deliver them is: <b>does fixing one change the right answer for another?</b></p>
        <ul>
          <li><b>Independent.</b> A typo in a log message, a missing null check in a different module, and a wrong default in a config file. Fixing any of them leaves the correct fix for the others exactly as it was. These can be handed over one at a time with no loss.</li>
          <li><b>Interacting.</b> "The cache never invalidates", "two requests for the same key both hit the database", and "the TTL is wrong". Every one of those is a statement about the same locking-and-expiry design. Fix the first alone and the model picks a design; hand it the second afterwards and it now has to <b>undo</b> part of that design. Each sequential fix is made with a picture of the problem you already know is incomplete.</li>
        </ul>
        <p>That is the whole mechanism. <b>Sequential iteration hides the constraint set from the model.</b> When the constraints interact, the fix for issue 1 is chosen against a false model of what issue 2 requires, and you pay for it in rework — often as a regression in the thing that was already fixed.</p>
        <p>The mirror-image cost is real too. Batching <b>independent</b> issues means one large diff you have to review as a unit, no clean signal about which change caused which effect, and a rollback that takes the good fixes with the bad. Independent work wants small verifiable steps precisely <i>because</i> nothing is lost by separating them.</p>
        <p>A practical tell before you write anything: <b>try to state the fixes as separate sentences with no shared noun.</b> If you cannot — if "the cache", "the lock", "the TTL" keep reappearing — they interact.</p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.14 — Task Statement 3.5, "Knowledge of" bullet 4 and "Skills in" bullet 5, which state the single-message-versus-sequential distinction in these terms. The current product documentation covers iteration and course-correction but does not name this distinction; the reasoning above is derived from the exam's phrasing plus the guide's iteration section.</p>` },
      { id: "how", h: "The two modes, worked", html: `
        <p><b>Mode A — interacting issues, one detailed message.</b> Everything the model needs to choose a single coherent design goes in together, each item carrying its own evidence:</p>
        <pre><code>Three problems in the cache layer, and they interact — please
solve them as one design, not three patches:

1. Entries are never invalidated on write. Repro: PUT /orders/42
   then GET /orders/42 returns the pre-write body.
2. Two concurrent misses for the same key both hit Postgres.
   Seen in the load test: 2x query count at 50 rps.
3. TTL is applied at read time, not write time, so a hot key
   never expires.

Constraints: single process, no Redis. Show the invalidation
and locking strategy before you write code, then run
npm test -- cache.</code></pre>
        <p>Note what makes it work: <b>all three constraints are visible at design time</b>, each item has a concrete repro rather than an adjective, and the message ends with a check the model can run itself.</p>
        <p><b>Mode B — independent issues, sequential.</b> One at a time, each verified before the next:</p>
        <pre><code>Turn 1: The retry helper logs "attemp" instead of "attempt"
        in src/http/retry.ts. Fix it.
Turn 2: parseDate returns Invalid Date for "2026-02-30".
        Expected: throw RangeError. Add the test, then fix.
Turn 3: DEFAULT_TIMEOUT in config.ts is 3000; the runbook
        says 30000. Align it and update the doc comment.</code></pre>
        <p>Here each turn produces a small reviewable diff and a clean pass/fail. Nothing about turn 2 changes what turn 1 should have done.</p>
        <p><b>What both modes share</b> is the thing the documentation is emphatic about: <b>give Claude a check it can run.</b> Without a check, "looks done" is the only signal available and you become the verification loop. The documented upgrade path is: ask for the check in the same prompt → set it as a session <code>/goal</code> condition → enforce it as a <code>Stop</code> hook that blocks the turn from ending until it passes → have a separate verification subagent try to refute the result. And ask for <b>evidence</b>, not assertion: the test output, the command and what it returned.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/best-practices#give-claude-a-way-to-verify-its-work" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Best practices, "Give Claude a way to verify its work" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "when", h: "Threshold table — batch or sequence", html: `
        <table>
          <thead><tr><th>Signal</th><th>Single detailed message</th><th>Sequential iteration</th></tr></thead>
          <tbody>
            <tr><td>Do the fixes touch the same design decision?</td><td><b>Yes</b> — one locking scheme, one schema, one state machine</td><td><b>No</b> — different modules, different concerns</td></tr>
            <tr><td>Would fixing A change the correct fix for B?</td><td><b>Yes</b></td><td><b>No</b></td></tr>
            <tr><td>Can each item be verified on its own?</td><td>Not really — the acceptance test is the combined behavior</td><td>Yes — one failing test per item</td></tr>
            <tr><td>What does splitting cost?</td><td><b>Rework and regressions</b>: fix 2 partially undoes fix 1</td><td>Nothing</td></tr>
            <tr><td>What does batching cost?</td><td>Nothing you were not already paying</td><td><b>An unreviewable diff</b> and no signal about which change did what</td></tr>
            <tr><td>Typical exam wording</td><td>"the fixes interact", "the same subsystem", "a coherent design"</td><td>"unrelated", "independent", "in different files"</td></tr>
            <tr><td>Failure if you pick wrong</td><td>Batching independent work → one big risky diff</td><td>Sequencing interacting work → churn, and the third fix breaks the first</td></tr>
          </tbody>
        </table>
        <p>Two boundary cases the table does not cover:</p>
        <ul>
          <li><b>Many defects of the same kind</b> (formatting, a repeated lint violation) is a third case: the guide's rule is <b>fix one visible class at a time and verify</b>, avoiding broad rewrites that introduce new regressions. Same-class defects are independent per instance but share a rule — fix the rule once, apply it once, verify once.</li>
          <li><b>The same defect recurring across runs of the same prompt</b> is not an iteration problem at all. Treat it as a signal that the <b>prompt or schema needs a structural change</b> — a few-shot example, a split tool, a new field — rather than another retry. Prompt-level fixes generalize; per-instance retries do not.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §11 "Iterative Refinement, Testing, and Evaluation" (repo root, lines 1497-1560) for the one-class-at-a-time rule (line 1515) and the recurring-defect rule (line 1519). The batch-versus-sequence table itself is derived from Task Statement 3.5.</p>` },
      { id: "feedback", h: "The rest of 3.5 — examples, tests, and the interview", html: `
        <p>Three neighbouring bullets in the same task statement, all variations on <i>make the feedback executable</i>:</p>
        <ul>
          <li><b>Concrete input/output examples.</b> When a prose description is interpreted inconsistently across varied inputs, <b>2-3 input/output pairs</b> communicate the transformation better than more prose. The exam's number is 2-3; the current platform prompting guidance says to <b>include 3-5 examples for best results</b> and asks that they be relevant (mirroring the real use case), diverse (covering edge cases, varied enough that Claude does not latch onto an unintended pattern), and structured (wrapped in tags so they are distinguishable from instructions). Same technique, different count — carry both.</li>
          <li><b>Test-driven iteration.</b> Write the suite first — expected behavior, edge cases, performance requirements — then iterate by <b>sharing the failures</b>. The guide's loop is five steps: define behavior with tests or examples, ask for the smallest useful implementation, run the tests, feed back the exact failures, iterate one failure class at a time. The documented version of "specific" is the difference between <i>"implement a function that validates email addresses"</i> and <i>"write validateEmail; example cases: a normal address is true, invalid is false, a missing-domain address is false; run the tests after implementing"</i>.</li>
          <li><b>What makes feedback usable:</b> concrete enough that the model can <b>locate</b> the failure. "It is not handling edge cases" gives nothing to act on. A failing input, the expected output, the actual output, the validation error, or the failing test name with its assertion message all do. For extraction or generation work, pair each failure with the source excerpt that triggered it and the rule it violated.</li>
          <li><b>The interview pattern.</b> Before implementing in an unfamiliar domain, have Claude <b>interview you</b> — the documented prompt asks it to use the <code>AskUserQuestion</code> tool and dig into technical implementation, UI/UX, edge cases, concerns and tradeoffs, then write a spec file. This is where cache invalidation strategies, failure modes, and consistency requirements surface <i>before</i> they become the interacting-issues problem in the section above. The documented follow-through: once the spec is written, <b>start a fresh session to execute it</b>, so implementation runs on clean context against a written spec.</li>
          <li><b>The stopping rule.</b> If you have corrected the same issue more than twice in one session, the context is now cluttered with failed approaches. Run <code>/clear</code> and restart with a better prompt that incorporates what you learned — the docs state flatly that a clean session with a better prompt almost always outperforms a long session with accumulated corrections.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/best-practices#let-claude-interview-you" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Best practices, "Let Claude interview you" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>The discriminating word in the stem is <b>"interact"</b> or its paraphrase — "the same subsystem", "the fixes affect each other", "a coherent design". Present → one detailed message. Absent, plus "unrelated" or "in different files" → sequential.</li>
          <li>Neither mode is the safe default. An option that says <b>"always give feedback one issue at a time"</b> is as wrong as one that says <b>"always give all feedback at once"</b>; the exam is testing the discrimination, not a habit.</li>
          <li><b>"Prose description produces inconsistent results"</b> → <b>2-3 concrete input/output examples</b>, not a longer or sterner description. Any option that rewrites the instruction more emphatically is the distractor.</li>
          <li><b>"Edge case handled wrong"</b> (nulls in a migration script is the exam's own example) → give the <b>specific failing input and expected output</b>. "Ask for better edge-case handling" is unactionable by construction.</li>
          <li><b>"Unfamiliar domain, requirements not fully known"</b> → the <b>interview pattern</b> first. Implementing then correcting is the expensive path, and it is the path that manufactures interacting issues.</li>
          <li><b>"Narrow failure"</b> → a targeted fix against the failing test. An option proposing a <b>full rewrite</b> after one failure is a named pitfall in the guide.</li>
          <li>Cross-check the altitude before choosing any of them: if the scenario is a large multi-file change with several valid approaches, the answer may not be an iteration technique at all but <a class="pill" href="#/note/plan-mode">plan mode</a>. Iterative refinement assumes you already know roughly what you are building.</li>
        </ul>` },
    ],
  },
{
    id: "extraction-schemas", title: "Extraction Schemas — Tool Use, tool_choice, and What a Schema Cannot Fix", topic: "pe", domain: 4, tasks: ["4.3"], concept: "structured", icon: "✎",
    summary: "The full round trip for schema-enforced extraction: an extraction tool whose input_schema is your output schema, tool_choice to guarantee the call, and the reading of the tool_use block. Verified against the current Claude tool-use and structured-outputs documentation (16 Aug 2026). Exam objective: Task Statement 4.3.",
    source: ["Claude Docs — Define tools, \"Forcing tool use\"", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use"],
    sections: [
      { id: "how", h: "The round trip — extraction tool in, tool_use.input out", html: `
        <p>The pattern the exam names is one sentence long: <b>define a tool whose <code>input_schema</code> is the shape you want back, force the model to call it, and read <code>tool_use.input</code> as your record.</b> The tool is never executed — the call itself is the output.</p>
        <p>The mechanism is documented behavior, not a trick: for a client tool, Claude responds with <b><code>stop_reason: "tool_use"</code></b> and one or more <code>tool_use</code> blocks. Normally your code would run the operation and send a <code>tool_result</code> back; for extraction you simply stop there and keep the arguments.</p>
        <p><b>Step 1 — the tool definition.</b> Note four deliberate choices: <code>strict: true</code>, <code>additionalProperties: false</code>, nullable unions instead of omitted fields, and enums that carry an escape hatch.</p>
        <pre><code>EXTRACT_INVOICE = {
    "name": "extract_invoice",
    "description": "Record the fields of a supplier invoice exactly as stated in the document.",
    "strict": True,
    "input_schema": {
        "type": "object",
        "additionalProperties": False,
        "properties": {
            "vendor_name": {"type": "string"},
            "invoice_date": {
                "type": ["string", "null"], "format": "date",
                "description": "YYYY-MM-DD. null when the document states no date."
            },
            "currency": {"type": "string", "enum": ["USD", "EUR", "GBP", "other"]},
            "currency_detail": {
                "type": ["string", "null"],
                "description": "The source's own wording when currency is 'other'."
            },
            "stated_total": {"type": ["number", "null"]},
            "payment_terms": {
                "type": "string",
                "enum": ["net_30", "net_60", "due_on_receipt", "unclear"]
            }
        },
        "required": [
            "vendor_name", "invoice_date", "currency", "currency_detail",
            "stated_total", "payment_terms"
        ]
    }
}</code></pre>
        <p><b>Step 2 — the request.</b> The normalization rules live in the <code>system</code> prompt, not in the schema; the next-but-one section explains why they have to.</p>
        <pre><code>resp = client.messages.create(
    model="claude-opus-5",
    max_tokens=2048,
    tools=[EXTRACT_INVOICE],
    tool_choice={"type": "tool", "name": "extract_invoice"},
    system=(
        "Extract only values stated in the source. Use null when the document does "
        "not provide the information; never infer a typical value.\n"
        "Normalize before writing the field: dates to YYYY-MM-DD; amounts to a bare "
        "decimal with a period as the decimal mark and no thousands separator and no "
        "currency symbol ('1.234,50 EUR' -&gt; 1234.50); vendor names without legal-form "
        "suffixes."
    ),
    messages=[{"role": "user", "content": document_text}],
)</code></pre>
        <p><b>Step 3 — reading the response, including the stop reasons that break the guarantee.</b> Schema conformance is guaranteed <i>in most cases</i>; the documented exceptions are a refusal and a truncation, and both must be checked before you trust the payload.</p>
        <pre><code>if resp.stop_reason == "refusal":
    # 200 OK, billed, and the refusal text takes precedence over the schema.
    raise ExtractionError("refused - output is not schema-constrained")

if resp.stop_reason == "max_tokens":
    # The tool_use block may be cut off mid-object. Do not parse it.
    raise ExtractionError("truncated - retry with a higher max_tokens")

calls = [b for b in resp.content
         if b.type == "tool_use" and b.name == "extract_invoice"]

if not calls:
    # Only reachable with tool_choice "auto": the model answered in prose.
    raise ExtractionError("no tool_use block")

record = calls[0].input          # already a dict shaped like input_schema
audit  = {"tool_use_id": calls[0].id, "stop_reason": resp.stop_reason}</code></pre>
        <p>Two response details worth memorizing. With <code>tool_choice</code> set to <code>any</code> or <code>tool</code>, <b>the API prefills the assistant message</b>, so the model emits <b>no natural-language preamble</b> before the <code>tool_use</code> block even if you ask for one — <code>resp.content[0]</code> is the tool call. With <code>auto</code>, a <code>text</code> block usually precedes it, which is exactly why you filter <code>content</code> by type instead of indexing it.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview#how-tool-use-works" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Tool use with Claude, "How tool use works" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/structured-outputs#invalid-outputs" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Structured outputs, "Invalid outputs" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "when", h: "Which output mechanism — the thresholds", html: `
        <p>There are now <b>two</b> schema-backed mechanisms plus the unreliable third option, and the exam's phrasing ("tool use and JSON schemas") predates the split. Pick on where the structured value has to appear.</p>
        <table>
          <thead><tr><th>Threshold — pick the first row that is true</th><th>Mechanism</th></tr></thead>
          <tbody>
            <tr><td>The structured value <b>is</b> a function call, an extraction stage, or an intermediate agent action</td><td>Tool use: <code>input_schema</code> + <code>strict: true</code></td></tr>
            <tr><td>The <b>document type is unknown</b> and one of several extraction schemas must run</td><td>Tool use + <code>tool_choice: {"type": "any"}</code></td></tr>
            <tr><td>One extraction must run <b>before</b> an enrichment step</td><td>Tool use + <code>tool_choice: {"type": "tool", "name": "..."}</code></td></tr>
            <tr><td>The assistant's <b>final response body itself</b> must be JSON</td><td><code>output_config.format</code> (JSON outputs)</td></tr>
            <tr><td>The agent must both call tools validly <b>and</b> return a structured final answer</td><td>Both, in the same request</td></tr>
            <tr><td>Low-risk prototype, nothing downstream depends on it</td><td>Prompt-only JSON — and only here</td></tr>
          </tbody>
        </table>
        <p>The parameter name moved: the beta <code>output_format</code> is now <b><code>output_config.format</code></b>, and the <code>structured-outputs-2025-11-13</code> beta header is no longer required. The old shapes keep working for a transition period. If a question offers "instruct the model to respond only with valid JSON" against any schema-backed option, the schema-backed option wins — the documented failure list for prompt-only JSON is parsing errors, missing required fields, inconsistent data types, and schema violations that force retries.</p>
        <p>Two budget thresholds that decide whether the schema is even affordable:</p>
        <ul>
          <li><b>Grammar compilation.</b> The first request for a given schema can carry extra latency while the grammar compiles; compiled schemas are cached for reuse. A pipeline that generates a fresh schema per document pays that cost on every call.</li>
          <li><b>Token weight.</b> Tool definitions, schemas, and tool-use blocks are input tokens. A 12-field tool definition with detailed descriptions can consume around <b>2,500 tokens</b>; add a long document and you approach the context limit, at which point accuracy degrades near the <i>end</i> of the document. The cause is total context consumption, not a model defect.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/structured-outputs#why-use-structured-outputs" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Structured outputs, "Why use structured outputs" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Token-weight figure: <code>exam-preparation-guide.md</code> §1 "Structured Outputs and Tool Use as Output Control" (repo root, line 64). The documentation states that schemas count as input tokens but does not publish the 2,500-token example.</p>` },
      { id: "choice", h: "Reminder — the four tool_choice values", html: `
        <table>
          <thead><tr><th>Value</th><th>Guarantee</th><th>Use it for</th></tr></thead>
          <tbody>
            <tr><td><code>auto</code></td><td><b>None.</b> Claude may call a tool or answer in prose. Default when <code>tools</code> are provided</td><td>General agents where the tool call is optional</td></tr>
            <tr><td><code>any</code></td><td>Claude <b>must</b> call one of the provided tools, but picks which</td><td><b>Several extraction schemas, unknown document type</b> — the exam's canonical case</td></tr>
            <tr><td><code>tool</code></td><td>Claude must call <b>that named</b> tool</td><td>A pipeline stage that must emit one schema before enrichment</td></tr>
            <tr><td><code>none</code></td><td>Claude <b>cannot</b> call tools. Default when no <code>tools</code> are provided</td><td>A pure-text step, or a step where tools are unsafe</td></tr>
          </tbody>
        </table>
        <ul>
          <li><b><code>auto</code> plus "please use the tool" in the prompt is not a guarantee.</b> It is the same probabilistic layer as any other instruction; <code>any</code> is the code-level guarantee. This is the most repeated distractor in this task statement.</li>
          <li><b><code>any</code> guarantees the call, not the payload.</b> Combine <code>tool_choice: {"type": "any"}</code> with <code>strict: true</code> on the tool definitions to guarantee both that a tool is called and that its input follows your schema.</li>
          <li><b>Ordering tricks do not work.</b> Reordering tool definitions or asserting priority in the system prompt is unreliable; if a specific tool must run first, name it with <code>tool_choice: {"type": "tool", "name": "extract_metadata"}</code>.</li>
          <li><b>Cost of switching:</b> changing <code>tool_choice</code> invalidates cached <i>message</i> blocks under prompt caching. Tool definitions and system prompts stay cached, but message content is reprocessed — so do not flip it per request out of habit.</li>
          <li><b>Compatibility trap:</b> with <i>manual</i> extended thinking (<code>thinking: {type: "enabled"}</code>), <code>any</code> and <code>tool</code> are <b>not supported</b> and return an error; only <code>auto</code> and <code>none</code> work. Adaptive thinking — including models where thinking is on by default, such as Claude Opus 5 — does support forced tool use.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Define tools, "Forcing tool use" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "normalize", h: "Reminder — the schema constrains shape, the prompt constrains value form", html: `
        <p>This is the exam's last skill bullet under 4.3, and it is not a stylistic preference — it follows from what the grammar can and cannot express.</p>
        <ul>
          <li><b>What the schema can enforce:</b> types, <code>enum</code> and <code>const</code>, <code>required</code>, <code>additionalProperties: false</code>, <code>anyOf</code>/<code>allOf</code>, <code>$ref</code>, <code>default</code>, the string <code>format</code> keywords (<code>date-time</code>, <code>date</code>, <code>time</code>, <code>duration</code>, <code>email</code>, <code>uri</code>, <code>uuid</code>, <code>ipv4</code>, <code>ipv6</code>, <code>hostname</code>), and simple <code>pattern</code> regexes.</li>
          <li><b>What it cannot enforce:</b> <b>numerical constraints</b> (<code>minimum</code>, <code>maximum</code>, <code>multipleOf</code>), <b>string length</b> (<code>minLength</code>, <code>maxLength</code>), array constraints beyond <code>minItems</code> of 0 or 1, recursive schemas, and regex with backreferences, lookahead/lookbehind, or word boundaries. Using an unsupported feature returns a <b>400</b>.</li>
          <li>So "the invoice total is a number" is a schema job. "<i>1.234,50 EUR</i> becomes <code>1234.50</code>", "an invoice dated <i>3/4/25</i> is day-first because the vendor is German", "<i>Acme GmbH &amp; Co. KG</i> is recorded as <i>Acme</i>" are all <b>prompt</b> jobs — the schema will happily accept a wrongly normalized string of the right type.</li>
          <li><b>Enum capitalization is not guaranteed either.</b> Structured outputs may return a value differing from your enum only in capitalization (typically the first letter after a space), with no error and no special <code>stop_reason</code>. Compare enum values <b>case-insensitively</b>, and never define two enum values that differ only in case.</li>
          <li>Put the normalization rules in the <code>system</code> prompt with one worked transformation each, and add a <b>2-4 example</b> few-shot block when source formatting is genuinely varied — examples teach a target format more reliably than narrative rules do.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/structured-outputs#json-schema-limitations" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Structured outputs, "JSON Schema limitations" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "limits", h: "Syntax solved, semantics not — and the fields that stop fabrication", html: `
        <p>The single most examinable sentence in 4.3: <b>strict JSON schemas via tool use eliminate syntax errors but do not prevent semantic errors.</b> The constrained decoder guarantees shape; it cannot know whether the source supports the value.</p>
        <table>
          <thead><tr><th>Error class</th><th>Eliminated by the schema?</th><th>Example</th></tr></thead>
          <tbody>
            <tr><td>Invalid JSON syntax</td><td><b>Yes</b></td><td>Trailing comma, unterminated string</td></tr>
            <tr><td>Wrong type / missing required field</td><td><b>Yes</b></td><td><code>"2"</code> where an integer is declared</td></tr>
            <tr><td>Invalid tool name</td><td><b>Yes</b> (with <code>strict</code>)</td><td>A hallucinated tool</td></tr>
            <tr><td><b>Values that do not add up</b></td><td><b>No</b></td><td>Line items sum to 1280.50, <code>stated_total</code> says 1295.00</td></tr>
            <tr><td><b>Right type, wrong field</b></td><td><b>No</b></td><td>A cooking duration written into an ingredient quantity; a competitor's spec recorded as the product's</td></tr>
            <tr><td><b>A value the source never stated</b></td><td><b>No</b></td><td>An invented invoice date for an undated scan</td></tr>
          </tbody>
        </table>
        <p><b>The schema-design moves that reduce the third row</b> — the fabrication row — are the ones the task statement lists by name:</p>
        <ul>
          <li><b>Nullable or optional for anything the source may omit.</b> A required field on information the document rarely contains is <i>structural pressure to invent</i>. Give the model <code>null</code> and it will use it. Under <code>strict</code> this is usually expressed as a type union (<code>["string", "null"]</code>) with the key still in <code>required</code>, not as an absent key.</li>
          <li><b><code>null</code> and empty array are different claims.</b> An empty <code>pros</code> array asserts "the reviewer mentioned no pros"; <code>null</code> says "the document did not address pros". Pick the one that is true.</li>
          <li><b>An <code>"unclear"</code> enum value</b> for ambiguous classification. A sentiment enum of <code>positive / negative / mixed</code> forces a guess on a sarcastic review; adding <code>unclear</code> gives the model a correct option.</li>
          <li><b><code>"other"</code> plus a paired <code>*_detail</code> string</b> for open-ended category sets. A closed enum in an evolving domain produces a stream of validation failures; the escape hatch absorbs the long tail without a schema migration each time a new category appears.</li>
          <li>A frequently offered wrong fix is <b>a second "verification" LLM call</b> to check the extracted values against the source. It adds cost and latency, can rationalize the original answer, and does not touch the root cause — the model invented a value because the schema demanded one. Fix the schema; keep verification passes for sampling-based audit of already-good extractions.</li>
        </ul>
        <p>Everything in the "No" column is caught by <b>domain validation in your own code</b>: totals reconcile, dates fall in range, IDs match known records, citations exist in the source. That is Task Statement 4.4's territory — see <a class="pill" href="#/note/extraction-validation">Extraction Feedback Loops</a>.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use#why-strict-tool-use-matters-for-agents" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Strict tool use, "Why strict tool use matters for agents" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Absence-semantics table and the verification-call critique: <code>exam-preparation-guide.md</code> §4 "Schema Design" and "Reducing Fabrication" (repo root, lines 415-464). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.17-18, Task Statement 4.3.</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>"Guaranteed schema-compliant output" → <b>tool use with a JSON schema</b>. Any option phrased as "instruct the model to return only valid JSON", "wrap the answer in code fences", or "prefill the response with an opening brace" is the wrong shape — prefill in particular is legacy and returns a validation error on current models.</li>
          <li><b>Unknown document type + several extraction tools</b> → <code>tool_choice: "any"</code>. If an option says <code>auto</code> "with a strong instruction to use a tool", it is the distractor.</li>
          <li><b>"Must run before the enrichment step"</b> → the named form, <code>{"type": "tool", "name": "..."}</code>. Not reordering the tools array, not system-prompt priority.</li>
          <li>If the failure described is <b>line items that do not sum to the total</b> or <b>values landing in the wrong field</b>, no schema option is the answer — the schema already succeeded. Look for <b>domain validation</b> or a reconciliation field.</li>
          <li>If the failure is <b>empty or fabricated values on fields the source omits</b>, the fix is <b>nullable/optional fields</b> (plus few-shot examples for varied layouts), not a stricter schema and not a second verification call.</li>
          <li>If the failure is <b>a new category the enum does not cover</b>, the fix is <code>"other"</code> + <code>*_detail</code>, not "expand the enum" — the scenario always implies more categories are coming.</li>
          <li>Watch for the compatibility traps rather than the happy path: forced tool use is incompatible with <b>manual</b> extended thinking, and a <code>tool_choice</code> change invalidates cached message blocks.</li>
        </ul>` },
    ],
  },
  {
    id: "extraction-validation", title: "Extraction Feedback Loops — detected_pattern, Self-Correction, and Calibrated Confidence", topic: "pe", domain: 4, tasks: ["4.1", "4.4", "4.6"], concept: "feedback", icon: "✎",
    summary: "How a pipeline learns from its own failures: enum-typed detected_pattern fields that make dismissals analyzable, reconciliation fields that catch semantic errors, retry-with-error-feedback and its hard limit, and confidence that is only usable once calibrated. Verified against the current Claude evaluation and structured-outputs documentation (16 Aug 2026). Exam objectives: Task Statements 4.1, 4.4 and 4.6.",
    source: ["Claude Docs — Define success criteria and build evaluations, \"Eval design principles\"", "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests#eval-design-principles"],
    sections: [
      { id: "how", h: "Making dismissals analyzable — the detected_pattern field", html: `
        <p>Start from the number that tells you nothing: <b>"35% of our review findings get dismissed."</b> You cannot act on that. You need to know <i>which kind of code construct</i> is generating the dismissals, because the prompt criterion you would rewrite is attached to the construct, not to the finding.</p>
        <p>The fix is a schema field, added at generation time: <b><code>detected_pattern</code> — a closed enum naming the construct that triggered the finding.</b> It converts an unanalyzable pile of findings into a table you can group by.</p>
        <p><b>Step 1 — the finding schema.</b> Note that <code>detected_pattern</code> is an <code>enum</code>, not a free string, and that it has its own <code>unclear</code> escape value.</p>
        <pre><code>REPORT_FINDINGS = {
    "name": "report_findings",
    "strict": True,
    "input_schema": {
        "type": "object",
        "additionalProperties": False,
        "properties": {
            "findings": {
                "type": "array",
                "items": {
                    "type": "object",
                    "additionalProperties": False,
                    "properties": {
                        "file": {"type": "string"},
                        "line": {"type": "integer"},
                        "category": {
                            "type": "string",
                            "enum": ["bug", "security", "data_loss",
                                     "api_break", "missing_test", "other"]
                        },
                        "category_detail": {"type": ["string", "null"]},
                        "severity": {"type": "string",
                                     "enum": ["blocker", "major", "minor"]},
                        "detected_pattern": {
                            "type": "string",
                            "description": "The code construct that triggered this finding.",
                            "enum": ["nullable_deref", "unawaited_promise",
                                     "broad_except", "unvalidated_input",
                                     "hardcoded_secret", "n_plus_one_query",
                                     "missing_null_check_on_optional_chain",
                                     "unclear"]
                        },
                        "rule_id": {"type": "string"},
                        "evidence": {
                            "type": "string",
                            "description": "Verbatim snippet the finding is about."
                        },
                        "confidence": {
                            "type": "number",
                            "description": "0.0 to 1.0. Uncalibrated self-report."
                        }
                    },
                    "required": ["file", "line", "category", "category_detail",
                                 "severity", "detected_pattern", "rule_id",
                                 "evidence", "confidence"]
                }
            }
        },
        "required": ["findings"]
    }
}</code></pre>
        <p><b>Step 2 — the analysis the field enables.</b> Every finding is stored with the developer's later disposition; then one query names the false-positive generator.</p>
        <pre><code>SELECT detected_pattern,
       COUNT(*)                                                  AS reported,
       SUM(CASE WHEN status = 'dismissed' THEN 1 ELSE 0 END)     AS dismissed,
       ROUND(1.0 * SUM(CASE WHEN status = 'dismissed' THEN 1 ELSE 0 END)
             / COUNT(*), 3)                                      AS dismiss_rate
FROM   findings
WHERE  reported_at &gt;= DATE('now', '-30 day')
GROUP  BY detected_pattern
HAVING reported &gt;= 20               -- ignore patterns with no statistical mass
ORDER  BY dismiss_rate DESC;</code></pre>
        <pre><code>detected_pattern                     reported  dismissed  dismiss_rate
broad_except                              412        379         0.920
missing_null_check_on_optional_chain      288        241         0.837
n_plus_one_query                          96          31         0.323
hardcoded_secret                          54           2         0.037</code></pre>
        <p>The top two rows are the prompt edit. The bottom row is the reason the tool is worth keeping. <b>Aggregate the dismiss rate by pattern, then rewrite the criterion for the over-reporting patterns</b> — not the whole prompt.</p>
        <p><b>Why a free-text <code>reason</code> field cannot do this job.</b> It is the single most common wrong answer here, and it fails for four separate reasons:</p>
        <ul>
          <li><b>It records the wrong actor's view.</b> <code>reason</code> is what the <i>developer</i> typed when dismissing; <code>detected_pattern</code> is what the <i>model</i> saw when reporting. Only the second one maps to a prompt criterion you can change.</li>
          <li><b>It is not groupable.</b> "already handled upstream", "handled upstream", "this is fine, guarded above" are three strings and one pattern. <code>GROUP BY reason</code> produces a histogram with a count of 1 in every bucket. A closed enum produces buckets.</li>
          <li><b>It is optional in practice.</b> Dismissal is a one-click action; free-text explanation is the field everyone skips, so it is missing exactly on the high-volume patterns you most need to see.</li>
          <li><b>It arrives too late.</b> <code>detected_pattern</code> is emitted with the finding, so it exists on <i>every</i> finding — including the accepted ones, which is what gives you a <i>rate</i> rather than a raw dismissal count.</li>
        </ul>
        <p>If you need finer resolution than the enum offers, add <code>rule_id</code> (a stable identifier for the exact criterion in the prompt) and <code>evidence</code> (the verbatim snippet, so a human can audit whether the model even read the construct correctly). The three fields answer three different questions: <i>what construct</i>, <i>which instruction</i>, <i>what text</i>.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/test-and-evaluate/develop-tests#eval-design-principles" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Define success criteria and build evaluations, "Eval design principles" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">The <code>detected_pattern</code> / <code>rule_id</code> / <code>evidence</code> triple and the "without that field you can only see 35% are dismissed" argument: <code>exam-preparation-guide.md</code> §4 "Feedback Loops" (repo root, lines 581-594) and §11 "Code Review Agents" (lines 1533-1540). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.18, Task Statement 4.4.</p>` },
      { id: "selfcheck", h: "Reminder — reconciliation fields the model fills but does not judge", html: `
        <p>Semantic errors survive a strict schema (see <a class="pill" href="#/note/extraction-schemas">Extraction Schemas</a>). The cheap catch is to <b>extract both the computed value and the document's own claim as separate fields, then compare them in code.</b></p>
        <pre><code>{
  "line_items": [
    {"description": "Consulting, March", "amount": 900.00},
    {"description": "Travel",            "amount": 380.50}
  ],
  "calculated_total": 1280.50,
  "stated_total":     1295.00,
  "totals_match":     false,
  "conflict_detected": true,
  "conflict_fields":  ["stated_total"],
  "conflict_note":    "Invoice header says 1295.00; line items sum to 1280.50."
}</code></pre>
        <ul>
          <li><b>Never ask the model to reconcile.</b> Asking "what is the real total?" invites it to silently overwrite one of the two numbers. Extract both, flag automatically, route the mismatch to a human. This catches OCR damage and extraction mistakes with the same field.</li>
          <li><b><code>conflict_detected</code> is for the source contradicting itself</b> — two dates for the same event, a policy section that contradicts its own summary, a table disagreeing with the prose. Without the boolean the model must pick one value, and the contradiction disappears from your data forever.</li>
          <li>Pair the boolean with <b><code>conflict_fields</code></b> so downstream routing knows <i>which</i> value is untrustworthy, rather than quarantining the whole record.</li>
          <li>Same family of fields: <code>requires_review</code> plus a <code>review_reasons</code> array (<code>total_mismatch</code>, <code>low_ocr_quality</code>, <code>conflicting_dates</code>). A reason code routes; a bare confidence number only sorts.</li>
          <li><b>Range checks stay in your code.</b> <code>minimum</code> and <code>maximum</code> are not supported by structured-output schemas, so "confidence is between 0 and 1" and "total is non-negative" are application-side assertions, not schema guarantees.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/structured-outputs#json-schema-limitations" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Structured outputs, "JSON Schema limitations" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Reconciliation-field pattern: <code>exam-preparation-guide.md</code> §4 "Semantic Validation" (repo root, lines 490-529). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.18, Task Statement 4.4.</p>` },
      { id: "retry", h: "Retry with error feedback — and the one case where retry is useless", html: `
        <p>When domain validation fails, <b>do not resend the same request.</b> Send a correction request carrying three things: the original source document, the failed extraction, and the <b>exact validation errors</b>.</p>
        <pre><code>The extraction below failed validation.

&lt;source_document&gt;...unchanged original...&lt;/source_document&gt;
&lt;previous_extraction&gt;{"stated_total": 1295.0, "vendor_id": "AC-9"}&lt;/previous_extraction&gt;

Validation errors:
- calculated_total (1280.50) does not equal stated_total (1295.00)
- vendor_id "AC-9" does not match the expected pattern ^V[0-9]{6}$

Return a corrected call to extract_invoice. Do not change fields unless
needed to fix the errors listed above.</code></pre>
        <p>Two distractors sit next to this. <b>Lowering <code>temperature</code> to 0</b> removes variability without addressing the mismatch — a deterministic wrong answer is still wrong. <b>"Ask it to try again"</b> resends the prompt that already failed.</p>
        <table>
          <thead><tr><th>Failure</th><th>Will retry-with-feedback fix it?</th></tr></thead>
          <tbody>
            <tr><td>Locale number: <code>"1,234"</code> must become <code>1234</code></td><td><b>Yes</b> — trivially</td></tr>
            <tr><td>ISO datetime supplied where the schema wants the date part only</td><td><b>Yes</b></td></tr>
            <tr><td>Source nests the data; the schema wants a flat array of strings</td><td><b>Yes</b> — a structural mismatch the model can re-shape</td></tr>
            <tr><td>Values placed in the wrong field</td><td><b>Usually</b> — naming the field in the error is enough</td></tr>
            <tr><td><b>The information is not in the document at all</b></td><td><b>No.</b> More retries only produce better-formatted hallucinations</td></tr>
          </tbody>
        </table>
        <p><b>The limit is the examinable part.</b> Retry fixes <i>format and structure</i>; it cannot fix <i>absence</i>. If the required value lives in an external document that was never supplied, every additional attempt increases the chance of a fabricated answer rather than a correct one. The correct responses are to <b>retrieve the missing source</b> or <b>route to human review</b> — and, upstream, to make the field nullable so the first call can say so honestly.</p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §4 "Semantic Validation" including "When Retries Don't Help" (repo root, lines 501-537). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.18, Task Statement 4.4, Knowledge bullets 1-2. No current documentation page states the retry-limit rule in these terms.</p>` },
      { id: "trust", h: "Reminder — false positives are a trust problem, not just a precision problem", html: `
        <ul>
          <li><b>The contagion claim (4.1):</b> a high false-positive <i>category</i> undermines confidence in the <i>accurate</i> categories. Developers do not maintain a per-category trust model; once a tool cries wolf on style nits, its genuine security findings get skimmed too.</li>
          <li><b>Therefore the recommended move is temporal, not permanent:</b> <b>temporarily disable the high false-positive categories</b> to restore trust, keep the trusted categories running, and improve the prompts for the disabled ones offline. Re-enable when the dismiss rate measured on a sample comes down.</li>
          <li>The wrong instinct is to <b>keep everything on and tune globally</b> — the noisy category keeps burning trust while you iterate — or to <b>delete the category permanently</b>, which throws away the true positives it also produced.</li>
          <li><b>Vague global dials do not raise precision.</b> "Be conservative", "only report high-confidence findings", "reduce false positives" are not criteria. Specific categorical criteria are: <i>flag a comment only when the claimed behavior contradicts the actual code behavior</i>, report bugs / security / data loss / incompatible API changes, skip minor style and locally accepted conventions.</li>
          <li><b>Severity needs concrete code examples per level</b>, not adjectives, if classification is to be consistent across runs.</li>
          <li><b>Few-shot beats prose for this specific job:</b> show an acceptable pattern next to a genuinely problematic one. Examples generalize to novel constructs; an enumerated blocklist only matches what you already listed.</li>
          <li>The measurement that closes the loop is the <code>detected_pattern</code> table above — disable the categories the data names, not the ones that were loudest in the last complaint.</li>
        </ul>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.16, Task Statement 4.1 — Knowledge bullets 1-3 and Skills bullets 1-3. This is the exam's own framing; the product documentation does not discuss developer trust in these terms. Corroborating guidance on criteria and few-shot: <code>exam-preparation-guide.md</code> §11 "Code Review Agents" (lines 1533-1540) and §6 "Few-Shot Examples" (lines 829-842).</p>` },
      { id: "eli5", h: "Explain simpler — a verification pass that says how sure it is", html: `
        <p>Imagine a helper who reads a hundred scanned invoices and types the totals into a spreadsheet. Next to every number, you also ask the helper to write down a second number: <b>how sure they were</b>. At the end of the day you check twenty of the entries yourself. You discover that when the helper wrote "very sure", they were right almost every time — and when they wrote "not very sure", they were wrong about a third of the time. From then on you only re-check the "not very sure" rows. You have not made the helper better. You have made <b>your own limited checking time land where the mistakes are</b>.</p>
        <p>That is the whole idea. The model does a second pass over what it produced and attaches a confidence number to each item. The number is worthless on its own — a model writing <i>0.92</i> does not mean it is right 92% of the time. It becomes useful only after you compare a batch of those numbers against answers you already know to be correct (a <b>labeled validation set</b>) and learn what each band actually predicts. Then you pick the cut-off: below it, a human looks; above it, it goes straight through.</p>
        <p>Three things follow, and they are the whole design:</p>
        <ul>
          <li><b>Attach the number to the field, not to the document.</b> One score for a whole invoice tells you nothing about which of its twelve fields to re-read.</li>
          <li><b>Add reason codes next to the number.</b> "0.61" only sorts a queue; "0.61, because the scan was poor and two dates conflict" tells the reviewer what to look at first.</li>
          <li><b>Check the number's honesty by segment, forever.</b> A pipeline that is 97% accurate overall can be 80% accurate on one document type. Keep taking a small stratified random sample of the <i>high</i>-confidence outputs after you automate, or a systematic error that looks plausible to everyone will never surface.</li>
        </ul>
        <p><b>Where this earns its keep:</b></p>
        <ul>
          <li><b>Invoice and claims intake.</b> Fields flagged <code>requires_review</code> with <code>review_reasons</code> of <code>total_mismatch</code> or <code>low_ocr_quality</code> go to the two-person review team; the rest post automatically. Reviewer capacity is the scarce resource being allocated.</li>
          <li><b>Code review findings.</b> The reviewing instance reports confidence per finding; low-confidence findings are posted as questions rather than blocking comments, so a shaky finding costs a developer ten seconds instead of a build.</li>
          <li><b>Research and multi-document synthesis.</b> Low-confidence claims get sent back for a source quote before they are allowed into the summary — the model must produce the supporting quote or retract the claim.</li>
        </ul>
        <p>One structural note that belongs to 4.6 rather than to confidence: the pass that assigns the confidence should be an <b>independent instance</b> where possible. A model that just generated an answer carries its own reasoning context and is <i>less likely to question its own decisions in the same session</i> — which is why "add a self-review instruction" and "turn on extended thinking" are the weak options and "a second instance without the generator's context" is the strong one.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations#advanced-techniques" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Reduce hallucinations, "Advanced techniques" (relevant section) <span aria-hidden="true">↗</span></a></p>
