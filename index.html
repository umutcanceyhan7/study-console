        <p class="srcline none">Self-review limitation and the confidence-routing skill bullet: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.19, Task Statement 4.6. Calibration and stratified sampling: p.22, Task Statement 5.5, and <code>exam-preparation-guide.md</code> §4 "Confidence and Human Review" (lines 550-580).</p>` },
      { id: "tension", h: "Reconciling the contradiction — 5.2 calls confidence unreliable, 4.6 and 5.5 use it", html: `
        <p>Two task statements appear to say opposite things, and a question can be built on either side, so the reconciliation has to be explicit.</p>
        <table>
          <thead><tr><th></th><th>Task Statement 5.2</th><th>Task Statements 4.6 / 5.5</th></tr></thead>
          <tbody>
            <tr><td>Wording</td><td>"self-reported confidence scores are <b>unreliable proxies</b> for actual case complexity"</td><td>"<b>field-level</b> confidence scores <b>calibrated using labeled validation sets</b> for routing review attention"</td></tr>
            <tr><td>What is being judged</td><td>The agent's own competence at a task it has <b>not finished</b></td><td>A <b>finished artifact</b> the model just produced, field by field</td></tr>
            <tr><td>When</td><td>Mid-conversation, live</td><td>After the fact, in a verification pass</td></tr>
            <tr><td>Calibrated?</td><td><b>No</b> — used raw as a trigger</td><td><b>Yes</b> — thresholds fitted to labeled data</td></tr>
            <tr><td>Consequence of being wrong</td><td>A customer who needed a human does not get one</td><td>An item lands in the wrong review queue</td></tr>
            <tr><td>Verdict</td><td>Do not escalate on it</td><td>Do route on it</td></tr>
          </tbody>
        </table>
        <p>The reconciling principle: <b>a model can score a thing it has produced far better than it can score its own state while producing it.</b> Per-field confidence about a completed extraction is a property of an artifact you can hold up against ground truth; an agent's mid-conversation "I am 70% sure I can handle this" is a self-assessment with nothing to check it against, which is exactly why 5.2 pairs it with sentiment analysis as the other unreliable proxy. Escalation is therefore driven by <b>categorical triggers</b> — the customer asked for a human, the policy is silent or ambiguous, no meaningful progress is being made — not by a number the agent invented about itself.</p>
        <p>The second half of the reconciliation is the word <b>calibrated</b>. An uncalibrated confidence field used as a control gate is a bug in both worlds; the same field, after you measure what each band actually predicts on a labeled set, becomes a legitimate prioritization signal. And even then it prioritizes scarce reviewer capacity — it never authorizes skipping review of a high-impact field.</p>
        <p><a class="pill" href="#/note/escalation-ambiguity">Escalation &amp; Ambiguity (5.2)</a> <a class="pill" href="#/note/confidence-review">Confidence Calibration &amp; Human Review (5.5)</a></p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.20, Task Statement 5.2 Knowledge bullet 3, against p.19 Task Statement 4.6 Skills bullet 3 and p.22 Task Statement 5.5 Knowledge bullet 3. The two are not reconciled anywhere in the guide or in the product documentation; the distinction drawn here is derived from their differing scope, and the "useful only after calibration" rule comes from <code>exam-preparation-guide.md</code> §4 "Confidence and Human Review" (line 552).</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>"Developers dismiss a lot of findings — how do we find out why?" → add a <b>closed-enum <code>detected_pattern</code></b> field (optionally <code>rule_id</code>, <code>evidence</code>) and aggregate dismissals by it. The distractors are a <b>free-text reason box</b>, a <b>dismissal survey</b>, and "review a sample of dismissed findings manually" — the last one is what you do <i>after</i> the field exists, not instead of it.</li>
          <li>"The extraction was valid JSON but the numbers do not add up" → a <b>reconciliation field pair</b> (<code>calculated_total</code> vs <code>stated_total</code>, <code>totals_match</code>), not a stricter schema and not "ask the model to double-check the arithmetic".</li>
          <li>"The source contradicts itself" → a <b><code>conflict_detected</code> boolean</b> plus the conflicting values preserved. Any option that has the model choose the more likely value is destroying evidence.</li>
          <li>Validation failed → <b>resend with the source, the failed extraction, and the exact errors</b>. <code>temperature: 0</code>, "try again", and "increase max_tokens" are the standard wrong three.</li>
          <li>If the scenario says the value <b>lives in a document that was not provided</b>, every retry option is wrong. Retrieve the source or route to a human.</li>
          <li>"One category produces most of the noise" → <b>temporarily disable that category</b> while its prompt is fixed. "Add a be-conservative instruction" and "raise the confidence threshold globally" are the confidence-filtering distractors 4.1 explicitly rejects.</li>
          <li>Confidence questions turn on one word: <b>calibrated</b>. Uncalibrated confidence deciding escalation → wrong. Calibrated per-field confidence routing review capacity → right. And <b>aggregate accuracy</b> presented as proof that automation is safe is always the trap — demand the by-document-type and by-field breakdown.</li>
          <li>"Have the model review its own output" is weak by construction; the strong option is a <b>second independent instance without the generator's reasoning context</b>.</li>
        </ul>` },
    ],
  },
  {
    id: "batch-strategy", title: "Batch Processing — Failure Partitioning, SLA Arithmetic, and When Not to Batch", topic: "pe", domain: 4, tasks: ["4.5"], concept: "batching", icon: "✎",
    summary: "The Message Batches API as an architecture decision: partitioning results by custom_id and resubmitting only what failed, deriving submission frequency from an SLA, and the cases where 50% cheaper is the wrong trade. Every number re-verified against the current batch-processing documentation (16 Aug 2026), including one place where the exam guide has fallen behind. Exam objective: Task Statement 4.5.",
    source: ["Claude Docs — Batch processing, \"Batch limitations\"", "https://platform.claude.com/docs/en/build-with-claude/batch-processing#batch-limitations"],
    sections: [
      { id: "how", h: "Partitioning results and resubmitting only the failures", html: `
        <p>A batch does not succeed or fail as a unit. <b>Each request in a batch is processed independently, and the failure of one does not affect the others</b> — so recovery is a partitioning problem, and <code>custom_id</code> is the only key you have. Results <b>can come back in any order</b>, so joining by position is a bug waiting for its first production batch.</p>
        <p>There are exactly <b>four result types</b>, and each implies a different action:</p>
        <table>
          <thead><tr><th><code>result.type</code></th><th>Meaning</th><th>Billed?</th><th>Action</th></tr></thead>
          <tbody>
            <tr><td><code>succeeded</code></td><td>A message was produced</td><td>Yes</td><td>Still check <code>stop_reason</code> before trusting it</td></tr>
            <tr><td><code>errored</code></td><td>Invalid request, or an internal server error</td><td><b>No</b></td><td><code>invalid_request_error</code> → fix the body first; anything else → resubmit as is</td></tr>
            <tr><td><code>canceled</code></td><td>Cancelled before this request was sent to the model</td><td><b>No</b></td><td>Resubmit unchanged</td></tr>
            <tr><td><code>expired</code></td><td>The batch hit its <b>24-hour expiration</b> before this request was sent</td><td><b>No</b></td><td>Resubmit — but see the SLA section, this is the dangerous one</td></tr>
          </tbody>
        </table>
        <p>The walk streams results rather than downloading them, because a 100,000-request batch's results file is large:</p>
        <pre><code>succeeded, resubmit, dead = {}, [], []

for r in client.messages.batches.results(batch_id):
    cid, res = r.custom_id, r.result

    if res.type == "succeeded":
        msg = res.message
        if msg.stop_reason == "max_tokens":
            # Output truncated: same input, more room.
            resubmit.append(request_for(cid, originals[cid], max_tokens=8192))
        else:
            succeeded[cid] = msg

    elif res.type in ("expired", "canceled"):
        # Never reached the model, never billed. Resubmit unchanged.
        resubmit.append(request_for(cid, originals[cid]))

    elif res.type == "errored":
        err = res.error.error
        if err.type != "invalid_request_error":
            resubmit.append(request_for(cid, originals[cid]))   # server-side, retry as is
        elif is_context_limit(err):
            # The document did not fit. Chunk it and fan out, one request per chunk.
            for i, chunk in enumerate(chunk_document(originals[cid])):
                resubmit.append(request_for(f"{cid}-chunk-{i}", chunk))
        else:
            dead.append((cid, err.type))     # a bug in our request body; fix the code

if resubmit:
    retry_batch = client.messages.batches.create(requests=resubmit)</code></pre>
        <p><b>The chunking branch is the part the exam asks about.</b> Documents that exceeded the context limit are not retried — <i>resubmitting the same oversized document produces the same error</i>. They are <b>modified before resubmission</b>: split into chunks, one request per chunk, each with a derived <code>custom_id</code> so the pieces can be reassembled. Keep the derivation mechanical (<code>INV-2041</code> becomes <code>INV-2041-chunk-0</code>) and legal: <code>custom_id</code> must be <b>1-64 characters matching <code>^[a-zA-Z0-9_-]{1,64}$</code></b> and <b>unique within the batch</b>, so a naive scheme that appends a long hash or a slash will start failing validation on your recovery batch.</p>
        <p>Three details that make the difference between a recovery script and a data-loss incident:</p>
        <ul>
          <li><b>Keep the originals keyed by <code>custom_id</code>.</b> The results file gives you the result, not the request that produced it. If you cannot reconstruct the request body from the <code>custom_id</code>, you cannot resubmit anything.</li>
          <li><b><code>succeeded</code> is not the same as usable.</b> A truncated response is a successful, billed request with <code>stop_reason: "max_tokens"</code>. Partition on the result type <i>and</i> the stop reason.</li>
          <li><b>Do not blind-retry <code>invalid_request_error</code>.</b> The documentation's own guidance is that the request body must be fixed before re-sending; retrying a malformed body just burns another 24-hour window. The context-limit case is a subtype of this — the classification of "is this a context-limit error" is yours to make from the error, which is why a token pre-check before submission is cheaper than discovering it a day later.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/batch-processing#retrieving-batch-results" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Batch processing, "Retrieving batch results" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "eli5", h: "Explain simpler — turning an SLA promise into a submission schedule", html: `
        <p>You have promised customers that <b>any document they send is answered within 30 hours</b>. You want to use the batch API because it costs half as much. The question is only: <b>how often do I press submit?</b></p>
        <p>A document's total wait is <b>two waits stacked on top of each other</b>:</p>
        <ol>
          <li><b>Waiting for the bus.</b> Documents arrive continuously; batches leave on a schedule. A document that arrives one minute after a batch departs waits almost a full interval for the next one.</li>
          <li><b>Riding the bus.</b> Once submitted, processing takes as long as it takes — and the documented worst case is <b>24 hours</b>, because that is when a batch expires.</li>
        </ol>
        <p>So the arithmetic is just addition, and you must use the <b>worst case</b> of each, not the average:</p>
        <table>
          <thead><tr><th>Submit every…</th><th>Worst wait for the bus</th><th>+ worst processing</th><th>= worst total</th><th>Against a 30h promise</th></tr></thead>
          <tbody>
            <tr><td>24 hours (nightly)</td><td>24h</td><td>24h</td><td><b>48h</b></td><td>Fails, badly</td></tr>
            <tr><td>8 hours</td><td>8h</td><td>24h</td><td><b>32h</b></td><td>Fails</td></tr>
            <tr><td>6 hours</td><td>6h</td><td>24h</td><td><b>30h</b></td><td>Exactly at the line — no slack at all</td></tr>
            <tr><td><b>4 hours</b></td><td>4h</td><td>24h</td><td><b>28h</b></td><td><b>Works, with 2h of slack</b></td></tr>
          </tbody>
        </table>
        <p><b>Where the remaining two hours go.</b> They are not spare; they are the budget for everything that is not model time: streaming and storing a large results file, running your validation and reconciliation checks, writing to the downstream system, and the human-scale gaps — a submission cron that fires late, a deploy freeze, a Sunday. Design the interval so the slack is real, and do not spend it in advance.</p>
        <p><b>The thing the arithmetic does not cover, and this is the real lesson.</b> A request that comes back <code>expired</code> never reached the model. Resubmitting it starts a <i>new</i> 24-hour clock: 4 + 24 + 24 = <b>52 hours</b>, and the promise is broken for that document. The 2-hour slack cannot absorb a second batch window — nothing can. So an SLA-bound batch pipeline needs a <b>separate escape hatch</b>: when a request expires or fails, and the deadline is close, send it to the <b>synchronous Messages API</b> instead of into the next batch. You pay full price for a handful of documents to protect the promise on all of them.</p>
        <p>The same reasoning applied to three other shapes of promise:</p>
        <ul>
          <li><b>Nightly test generation for a morning standup.</b> Submit at 20:00, results needed by 09:00 — 13 hours. That is <i>inside</i> the 24-hour worst case, so the schedule only works if you accept an occasional miss, or you route the stragglers synchronously at 07:00.</li>
          <li><b>Weekly compliance audit, report due Monday 09:00.</b> Submit Friday evening: roughly 60 hours of headroom against a 24-hour worst case, plus room for one full resubmission round. This is the shape batch processing is actually built for.</li>
          <li><b>Mixed-urgency intake.</b> Do not batch everything and then try to expedite the urgent items inside the batch — batch latency is precisely why the urgent ones cannot be there. <b>Route per document</b>: standard documents to the batch API for the discount, urgent ones to the synchronous API.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/batch-processing#batch-limitations" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Batch processing, "Batch limitations" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">The 4-hour-window / 30-hour-SLA worked example is the exam's own: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.19, Task Statement 4.5, Skills bullet 2. Per-document routing for mixed urgency: <code>exam-preparation-guide.md</code> §4 "Batch Extraction" (lines 595-604).</p>` },
      { id: "sample", h: "Reminder — refine the prompt on a sample before the volume run", html: `
        <ul>
          <li><b>Why it matters more here than in synchronous work:</b> a bad prompt in a synchronous pipeline costs you one retry, seconds later. A bad prompt in a 50,000-document batch costs you a <b>full processing window</b> before you even learn it was bad, plus a second window for the resubmission. Iteration latency, not token price, is the dominant cost.</li>
          <li><b>The documented minimum:</b> dry run a single request shape against the <b>synchronous Messages API</b> first, to catch validation errors before they multiply by 50,000.</li>
          <li><b>The exam's version:</b> refine the prompt on a <b>sample set</b> to maximize first-pass success and reduce iterative resubmission cost. Sample across document <i>types</i>, not the first N rows — first-pass failures cluster by layout.</li>
          <li><b>Other cheap pre-flight checks</b> that pay for themselves at volume: token-count each document against the context limit (context-limit failures are the ones that need chunking, and they are detectable before submission), assert <code>custom_id</code> uniqueness and the <code>^[a-zA-Z0-9_-]{1,64}$</code> pattern, and confirm total batch size is under <b>100,000 requests / 256 MB</b> — over that you get a <code>413 request_too_large</code>.</li>
          <li><b>The counter-pressure, and it is on the exam too:</b> sampling is a pre-flight step, not the strategy. For a one-shot bulk job with a deadline, submit the whole volume, then resubmit failures in successive refined batches. Splitting the work into ten sequential small batches to "learn as you go" costs calendar time and buys little — each batch still burns up to a full window.</li>
          <li><b>Shared-context batches:</b> because batch requests can take longer than five minutes, use the <b>1-hour cache duration</b> with prompt caching when many requests share a long prefix. Cache hits across a batch are best-effort, since requests are processed concurrently and in any order.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/batch-processing#best-practices-for-effective-batching" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Batch processing, "Best practices for effective batching" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Sample-first wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.19, Task Statement 4.5, Skills bullet 4. The counter-pressure against many sequential small batches: <code>exam-preparation-guide.md</code> §4 "Batch Extraction" (lines 601-604).</p>` },
      { id: "fit", h: "The trade, the limits, and where the exam guide has fallen behind", html: `
        <p><b>What you get.</b> All batch usage is charged at <b>50% of standard API prices</b> — input tokens, output tokens, and special tokens alike. Throughput increases. That is the entire upside, and it is a real one.</p>
        <p><b>What you give up.</b> Not "some latency" — a <i>guarantee</i>. The documented shape of the promise is worth reading precisely, because exam options are built on the gap between the typical and the worst case:</p>
        <ul>
          <li>Most batches complete in <b>less than one hour</b>. That is an observation, not a commitment.</li>
          <li>Results become accessible when all messages have completed <b>or after 24 hours, whichever comes first</b>. Batches that have not finished by then <b>expire</b>.</li>
          <li>Processing <b>may be slowed based on current demand and your request volume</b>, in which case you may see more requests expiring at 24 hours. There is no latency SLA to appeal to.</li>
          <li>A batch is capped at <b>100,000 requests or 256 MB</b>, whichever comes first. Results are retrievable for <b>29 days</b> from creation — measured from <code>created_at</code>, not from when processing ended.</li>
          <li>Batches are <b>immutable once submitted</b>: to change anything, cancel and submit a new one. They are scoped to a Workspace, and can slightly overshoot a configured spend limit because of concurrent processing.</li>
          <li><code>stream: true</code> is rejected, along with <code>speed</code> (Fast mode), <code>store</code> / <code>previous_thread_event_id</code> (Threads), <code>cache_hint</code> / <code>context_hint</code>, and <code>max_tokens: 0</code>.</li>
        </ul>
        <p><b>Therefore:</b> batch is right for <b>non-blocking, latency-tolerant</b> work — overnight reports, weekly audits, nightly test generation, large-scale evaluations, bulk content moderation. It is <b>wrong for a blocking pre-merge check</b>, and the reason is structural rather than a matter of degree: a CI gate that might return in fifty minutes or might return tomorrow is not a gate. A developer waiting on a merge is a synchronous workload no matter how cost-sensitive the org is.</p>
        <h4 style="margin:.9em 0 .35em">Divergence: multi-turn tool calling in a batch</h4>
        <p>The exam guide states flatly that <b>the batch API does not support multi-turn tool calling within a single request</b> — it "cannot execute tools mid-request and return results". <b>Current documentation says something different, and both halves matter:</b></p>
        <table>
          <thead><tr><th></th><th>Exam guide (p.18, TS 4.5)</th><th>Current docs (checked 16 Aug 2026)</th></tr></thead>
          <tbody>
            <tr><td>Tool use in a batch</td><td>Framed as unsupported for multi-turn</td><td><b>Supported</b>, including <b>all server tools</b> — web search, web fetch, code execution, MCP connectors, advisor, tool search</td></tr>
            <tr><td>Multi-turn conversations</td><td>—</td><td><b>Explicitly listed as batchable</b></td></tr>
            <tr><td>The agentic loop</td><td>Cannot run</td><td>The batch worker <b>runs the same server-side agentic loop</b> as the synchronous Messages API — and, with no open connection to maintain, runs <b>more iterations per turn</b> before returning <code>stop_reason: "pause_turn"</code></td></tr>
            <tr><td>Unfinished turns</td><td>—</td><td>A <code>pause_turn</code> result means the turn did not finish; you continue it by submitting the paused assistant content in a follow-up request</td></tr>

        </table>
        <p><b>What survives of the guide's claim</b> is the part about <i>your</i> tools. A batch request is one Messages request with no channel back to your code, so a <b>client tool</b> still ends the turn with <code>stop_reason: "tool_use"</code> and your <code>tool_result</code> can only be delivered in a follow-up request — a second batch or a synchronous call. The documentation states the client-tool round trip and states that the server-side loop runs in batch; the consequence for client tools is the join of those two facts rather than a sentence anyone has written down. Read the guide's rule as <b>"no client-tool round trip inside one batch request"</b>, which is still true, and treat "no tool use in batch" as out of date.</p>
        <p>Practically, this changes an answer: a batched research or extraction job that needs <b>web search or code execution</b> is now viable in a single batch request, whereas a job that needs <b>your own database lookup</b> mid-turn still is not, and must either move the lookup into a pre-batch enrichment step or run synchronously.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/batch-processing#server-tools-and-the-agentic-loop" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Batch processing, "Server tools and the agentic loop" (relevant section) <span aria-hidden="true">↗</span></a></p>

      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>The three numbers are <b>50% cost, up to 24 hours, no latency guarantee</b>. An option offering "50% savings <i>and</i> a guaranteed turnaround", or quoting a discount that is not 50%, is fabricated.</li>

          <li><b>Failures → resubmit only the failed <code>custom_id</code>s.</b> "Resubmit the whole batch" doubles cost and window for a 3% failure rate. And resubmission is not always identical: <b>context-limit failures must be chunked first</b>, because an unmodified retry reproduces the error.</li>
          <li>Watch for the <b>SLA arithmetic</b> question shape: worst-case wait equals the submission interval plus the 24-hour processing window. If the two sum to more than the promise, the interval is wrong. If they sum to exactly the promise, there is no slack — also wrong.</li>
          <li><b>Do the prompt work on a sample first</b>; a first-pass failure costs a whole window, not a retry.</li>
          <li>On tool use in batches, prefer the current documentation over the guide: <b>server tools and the agentic loop do run</b> in a batch; only <b>your own client tools</b> cannot complete their round trip inside one request.</li>

{
    id: "escalation-ambiguity", title: "Escalation and Ambiguity — Hand Off, or Resolve", topic: "agent", domain: 5, tasks: ["5.2"], concept: "escalation", icon: "◈",
    summary: "Escalate on triggers, not on feelings: explicit human requests, policy gaps, no meaningful progress. Sentiment and self-rated confidence are not proxies for complexity. Covers every Knowledge and Skills bullet of Task Statement 5.2; verified against the official prompting documentation and the exam guide PDF (16 Aug 2026).",
    source: ["Claude Docs — Prompting best practices, \"Use examples effectively\"", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively"],
    sections: [
      { id: "criteria", h: "Write the criteria into the system prompt, then show them working", html: `
        <p>The exam's own worked item on this objective (PDF p.28, sample question 3) has a 55% first-contact resolution agent that <b>escalates straightforward cases and autonomously attempts the ones needing policy exceptions</b>. The correct fix is not infrastructure — it is <b>explicit escalation criteria plus few-shot examples demonstrating when to escalate versus resolve autonomously</b>. The root cause is an unclear decision boundary, and a boundary is exactly what examples teach.</p>
        <p>The official guidance on examples: make them <b>relevant</b> (mirror the actual use case), <b>diverse</b> (cover edge cases so Claude does not pick up an unintended pattern), and <b>structured</b> — wrap each in <code>&lt;example&gt;</code> tags inside an <code>&lt;examples&gt;</code> block so the model can tell examples from instructions. Three to five is the recommended range.</p>
        <pre><code>&lt;escalation_policy&gt;
Escalate to a human specialist when ANY of these hold:
  1. The customer asks for a human. Honor it on that turn, before any investigation.
  2. The request needs a policy exception, OR policy is silent on it.
  3. You cannot make meaningful progress — the tool that would resolve it keeps
     failing on the same input, or the account is in a state you cannot act on.
  4. Tool results show an uncertain or unsafe state that needs human judgement.

Resolve autonomously when the case matches a documented policy path AND every
fact you need is confirmed by a tool result.

Do NOT escalate because the customer sounds angry.
Do NOT escalate because you feel unsure.
Do NOT escalate because the case has many steps. Length is not a trigger.

When you escalate, emit the structured handoff object. Never paste the transcript.
&lt;/escalation_policy&gt;

&lt;examples&gt;
  &lt;example&gt;
    &lt;situation&gt;Order 88412 arrived damaged. Customer uploaded photos. The
    damage-replacement policy covers it and the item is in stock.&lt;/situation&gt;
    &lt;reasoning&gt;Documented policy path, all facts tool-confirmed, no exception
    required. None of the four triggers fire.&lt;/reasoning&gt;
    &lt;action&gt;RESOLVE. Issue the replacement, confirm the ship date, then mention a
    specialist is available if they want one — as an option, not a default.&lt;/action&gt;
  &lt;/example&gt;

  &lt;example&gt;
    &lt;situation&gt;Customer asks us to match a competitor's advertised price. Our
    price-adjustment policy covers our own site only and says nothing about
    other retailers.&lt;/situation&gt;
    &lt;reasoning&gt;Trigger 2. Policy is SILENT on this request, not permissive.
    Silence is a gap, and gaps are escalations even when the case looks easy.&lt;/reasoning&gt;
    &lt;action&gt;ESCALATE. Hand off with the requested match, the competitor listing,
    and the policy section that does not cover it.&lt;/action&gt;
  &lt;/example&gt;

  &lt;example&gt;
    &lt;situation&gt;Customer opens with "this is the third time — put me through to a
    person." The refund is standard and would take one tool call.&lt;/situation&gt;
    &lt;reasoning&gt;Trigger 1 fired on the first turn. Do not run lookups first.
    The resolution is already available, so offer it in the same breath —
    once.&lt;/reasoning&gt;
    &lt;action&gt;Acknowledge, then: "I can complete this refund right now, or connect
    you to a specialist — your call." If they repeat the request, transfer
    immediately without asking again.&lt;/action&gt;
  &lt;/example&gt;
&lt;/examples&gt;</code></pre>
        <p>The handoff itself is <b>structured, not a transcript dump</b>. The study guide's shape:</p>
        <pre><code>{
  "customer_id": "cust_193",
  "issue_type": "billing_adjustment",
  "root_cause": "subscription tier mismatch",
  "relevant_records": ["invoice_8841", "case_2209"],
  "amount": 72.15,
  "actions_taken": ["verified account", "checked invoice"],
  "recommended_next_action": "manager approval for adjustment"
}</code></pre>
        <p>Two things the guide is explicit about: do <b>not</b> pass only the customer's first complaint, and do <b>not</b> dump the full transcript unless the receiving system can use it. "Escalating with no useful handoff" is listed as a named pitfall — the human agent needs context <i>and</i> a recommendation.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Prompting best practices, "Use examples effectively" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §9 "Escalation" (repo root, lines 1147-1174, handoff JSON at 1157-1167) and §9 "Common Pitfalls" (lines 1219-1227). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.20-21, Task Statement 5.2, Skills bullet 1; worked item on p.28.</p>` },
      { id: "identifiers", h: "Multiple matches: ask for another identifier, never pick by heuristic", html: `
        <p>Task Statement 5.2 names this as its own Knowledge bullet: <b>multiple customer matches require clarification — requesting additional identifiers — rather than heuristic selection</b>. "Heuristic" here means exactly what it sounds like: most recent order, highest lifetime value, closest name match, first row returned. All of them are guesses dressed as logic, and the agent has no way to know it guessed wrong.</p>
        <p>Design the tool so ambiguity is <b>visible in the result</b>, not silently collapsed:</p>
        <pre><code>{
  "tool": "find_customer",
  "query": { "last_name": "Chen" },
  "match_count": 3,
  "matches": [
    { "customer_id": "cust_4471", "name": "J. Chen",
      "city": "Austin, TX",    "created": "2023-02-14", "last_order": "2026-07-30" },
    { "customer_id": "cust_9902", "name": "Julia Chen",
      "city": "Portland, OR",  "created": "2025-11-02", "last_order": "2026-08-11" },
    { "customer_id": "cust_1180", "name": "Jun Chen",
      "city": "Austin, TX",    "created": "2019-06-21", "last_order": "2026-08-14" }
  ]
}</code></pre>
        <p><b>Wrong agent turn</b> — "I found your account (the Portland one, most recently created) and I've started the return…" The heuristic is invisible to the customer, and it just acted on a stranger's account.</p>
        <p><b>Correct agent turn:</b></p>
        <pre><code>I found three accounts under Chen. So I act on the right one, which of these
is yours?

  1. J. Chen — Austin, TX — last order 30 Jul 2026
  2. Julia Chen — Portland, OR — last order 11 Aug 2026
  3. Jun Chen — Austin, TX — last order 14 Aug 2026

(Or give me the order number or the email on the account and I'll match it
directly.)</code></pre>
        <ul>
          <li>The candidates are shown with <b>differentiating fields</b> — city, creation date, last activity — so the customer can actually tell them apart. A bare list of three names is not disambiguation.</li>
          <li>The offer of an <b>additional identifier</b> (order number, email, last four digits) is the "requesting additional identifiers" the objective asks for. It is one question, not an intake form.</li>
          <li>This is the <b>lookup-then-act</b> pattern: a search tool returns IDs plus distinguishing metadata, and the mutating tool accepts only an unambiguous ID. The model never reconstructs identity from a name.</li>
          <li>Ask <b>one focused clarifying question</b>, not three. The guide is blunt about it: multiple simultaneous questions feel like an interrogation and users typically answer only the first. Pick the disambiguation that most changes your next action.</li>
          <li>The stakes scale with the action. Disambiguation resolves <i>which entity</i> the user means; preview-then-execute confirms <i>what will happen</i> to it. Both are needed before anything destructive.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §3 "Parameter Design" (repo root, lines 176-181), §3 "Safety and Confirmation" (line 296), §7 "Clarifying Questions and Assumptions" (line 883). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.20-21, Task Statement 5.2, Knowledge bullet 4 and Skills bullet 5. No current documentation page states the multiple-match rule; it rests on the guide and the PDF.</p>` },
      { id: "when", h: "The threshold table — demand versus offer", html: `
        <p>The sharpest distinction in 5.2 is between <b>escalating immediately when a customer explicitly demands it</b> and <b>offering to resolve when the issue is straightforward</b>. Both are Skills bullets in the same task statement, and they are not in conflict — the second is what you say <i>while</i> honoring the first.</p>
        <table>
          <thead><tr><th>What is in the transcript</th><th>Correct move</th><th>Why</th></tr></thead>
          <tbody>
            <tr><td>"Let me talk to a person." (explicit request, first turn)</td><td><b>Honor it on that turn.</b> Do not run lookups first. If a resolution is already in hand, state it in the same message as an option.</td><td>The Skills bullet is literal: honor explicit requests for human agents <b>immediately, without first attempting investigation</b>.</td></tr>
            <tr><td>Customer repeats the request after your offer</td><td><b>Transfer. No second offer.</b></td><td>Escalate "only if the customer reiterates their preference" — the reiteration is the stop signal.</td></tr>
            <tr><td>Frustrated, but has <i>not</i> asked for a human</td><td><b>Acknowledge, then resolve.</b> Move efficiently; mention the transfer option once.</td><td>Frustration is a communication signal, not an escalation trigger. Do not silently perform account actions after a frustrated user asks for a person.</td></tr>
            <tr><td>Policy covers it and every fact is tool-confirmed</td><td><b>Resolve autonomously.</b></td><td>This is the 55%-FCR failure in reverse: escalating documented cases is what wrecks first-contact resolution.</td></tr>
            <tr><td>Policy is silent or ambiguous on the specific request</td><td><b>Escalate</b>, even though the case looks trivial.</td><td>The trigger is a <b>policy gap</b>, not difficulty. Competitor price matching under an own-site-only policy is the exam's canonical example.</td></tr>
            <tr><td>Needs an exception, regulated approval, or a high-value transaction</td><td><b>Escalate.</b> And the threshold itself lives in code, not in the prompt.</td><td>Hard rules must be enforced programmatically — inside the tool, reading a server-controlled threshold.</td></tr>
            <tr><td>The same tool keeps failing on the same input</td><td><b>Escalate</b> (or switch strategy). Do not burn more retries.</td><td>"Inability to make meaningful progress" is a named trigger. Repeated identical failure is the signal.</td></tr>
            <tr><td>Long, multi-step, but fully documented</td><td><b>Resolve.</b></td><td>Complexity alone is not a trigger — the PDF says the triggers are requests, policy gaps, and lack of progress, <b>not just complex cases</b>.</td></tr>
            <tr><td>Three tools failed, but on unrelated things</td><td><b>Judge the category and impact</b>, not the count.</td><td>The guide warns explicitly against counters like "escalate after three failed tools."</td></tr>
            <tr><td>Partial completion — one step done, one blocked</td><td><b>Degrade gracefully</b> before escalating: what is verified, what is not, what happens next.</td><td>Never claim a side effect that has not completed; users tolerate visible incompleteness, not silent rollback.</td></tr>
          </tbody>
        </table>
        <p>The phrasing the guide gives for the offer, when the customer has asked for a human and the fix is one call away:</p>
        <pre><code>I can resolve this now, and I can also transfer you if you prefer. The eligible
action is ready; would you like me to complete it or connect you to a specialist?</code></pre>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §9 "Escalation" (lines 1147-1174), "Frustrated Users" (lines 1175-1184, quoted text at 1181), "Compliance and Authorization" (lines 1185-1205), "Graceful Degradation" (lines 1206-1218). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.20-21, Task Statement 5.2.</p>` },
      { id: "unreliable", h: "Why sentiment and self-rated confidence are the wrong dials", html: `
        <p>The PDF puts both wrong answers in one item (p.28, sample question 3), and the rationale is the part worth memorizing.</p>
        <ul>
          <li><b>Self-reported confidence (option B) fails because it reads the broken signal.</b> The exam's rationale is one clause long: LLM self-reported confidence is poorly calibrated — <b>the agent is already incorrectly confident on the hard cases</b>. That is not a side note, it is the whole argument. The agent's symptom <i>is</i> that it confidently attempts policy-exception cases. Asking that same agent, in that same turn, to rate its own competence 1-10 and gating on the number just reuses the faulty judgement as its own supervisor. A miscalibrated instrument does not become a thermometer because you print a scale on it.</li>
          <li><b>Sentiment analysis (option D) fails because it measures the wrong variable.</b> The rationale: sentiment does not correlate with case complexity, which is the actual issue. An enraged customer with a one-click in-policy refund gets escalated; a polite customer requesting a regulated exception sails through. Both routings are wrong, and the frustrated-user rule already covers tone — acknowledge it, then resolve.</li>
          <li><b>A trained classifier (option C) fails on proportionality</b>, not on principle: it needs labeled data and ML infrastructure before prompt optimization has been tried. Compare the <a class="pill" href="#/note/simplest-first">Simplest Solution First</a> reflex — the cheapest change that addresses the root cause wins the "first step" question.</li>
          <li>What is left is the decision boundary itself, which is a <b>prompt</b> problem: explicit criteria plus contrasting examples. The guide backs the mechanism generally — when a system prompt has grown into long rule lists and behavior drifts, replacing chunks of rules with two or three contrasting examples typically restores adherence.</li>
        </ul>
        <p><b>Reconciling this with 4.6 and 5.5, which do use confidence.</b> Task Statement 4.6 asks for verification passes where the model <b>self-reports confidence alongside each finding to enable calibrated review routing</b>, and 5.5 is built entirely on field-level confidence scores. Read together with 5.2's "self-reported confidence scores are unreliable proxies", that looks like a contradiction. It is not — three things differ:</p>
        <table>
          <thead><tr><th></th><th>5.2 — the unreliable version</th><th>4.6 / 5.5 — the usable version</th></tr></thead>
          <tbody>
            <tr><td>What is being scored</td><td>The agent's <b>own competence</b> on a live conversation whose difficulty it has not yet discovered</td><td>A <b>produced artifact</b> — a specific extracted field, a specific review finding — that already exists and can be checked</td></tr>
            <tr><td>Granularity</td><td>One number for the whole turn</td><td><b>Per field, per finding</b>, attached to the item it describes</td></tr>
            <tr><td>Calibration</td><td>None. The threshold is picked by intuition</td><td>Measured against a <b>labeled validation set</b>, bucketed by confidence band, document type, and field</td></tr>
            <tr><td>Who computes the routing</td><td>The model gates itself</td><td>A <b>derived</b> <code>requires_review</code> flag, computed outside the model from the calibrated threshold</td></tr>
          </tbody>
        </table>
        <p>So the rule is not "confidence is useless." It is: <b>a number is only a routing signal after you have measured what it means.</b> An uncalibrated self-rating mid-conversation is a vibe; a calibrated per-field score is a measurement. See <a class="pill" href="#/note/confidence-review">Confidence Calibration and Human Review</a> for the calibration procedure and <a class="pill" href="#/note/extraction-validation">Extraction Validation</a> for the artifact side.</p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.28, sample question 3 and its rationale paragraph; Task Statement 5.2 Knowledge bullet 3 (pp.20-21); Task Statement 4.6 Skills bullet 3 (p.19); Task Statement 5.5 (pp.22-23). Supporting: <code>exam-preparation-guide.md</code> §7 "Few-Shot Examples" (lines 829-842).</p>` },
      { id: "eli5", h: "In plain terms", html: `
        <p><b>Escalation is a checklist, not a feeling.</b> Four things put a case in front of a human: the customer asked for one, the rulebook does not cover this, the rulebook says no and they want an exception, or you are stuck and repeating yourself. Nothing else. Not "this is hard." Not "they're shouting." Not "I'm not sure." Those are moods; the four are facts you can point at.</p>
        <p><b>The frustration rule.</b> When someone is angry and you can actually fix their problem, do not treat the anger as a transfer request. Say you get it, say what you can do right now, and let them choose. Say it <b>once</b>. If they ask again for a person, you are done negotiating — transfer. The mistake in both directions: bouncing every upset customer to a queue (they wanted the fix, not the queue), or talking a customer out of the human they asked for twice.</p>
        <p><b>"Not just complex cases"</b> is the phrase the exam leans on. A case being complicated is not a reason to escalate; a case falling <i>outside the rules</i> is. Those feel similar and are completely different. A twelve-step return that the policy fully describes is yours to finish. A one-line request the policy never mentions is not.</p>
        <ul>
          <li><b>Competitor price match.</b> The customer wants a $12 adjustment because another retailer is cheaper. Trivially easy. Our policy only covers price drops on our own site. Policy is silent → <b>escalate</b>, even though you could compute the number in your head.</li>
          <li><b>Angry about a damaged blender.</b> Customer is furious, photos are attached, the damage-replacement policy covers it exactly, stock is available. Do not escalate on the anger. Acknowledge, ship the replacement, mention a specialist is available. <b>Resolve.</b></li>
          <li><b>"I want a human. Now."</b> — as the opening line, on a case you could close in one call. Do not go run four lookups to prove you could have handled it. Honor it that turn: acknowledge, offer the ready resolution as a choice, and transfer the moment they repeat themselves.</li>
          <li><b>The refund tool has now failed four times on the same order ID.</b> Not a retry problem. You are not making meaningful progress → <b>escalate</b>, with what you attempted and what you already verified.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §9 "Escalation" and "Frustrated Users" (repo root, lines 1147-1184). Exam wording, including "not just complex cases": <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.20-21, Task Statement 5.2, Knowledge bullet 1.</p>` },
      { id: "rules", h: "Reminders", html: `
        <ul>
          <li><b>An explicit request for a human is honored immediately — before any investigation.</b> Not after a lookup, not after "let me just check one thing." The Skills bullet says <i>without first attempting investigation</i>, and that clause is the testable part.</li>
          <li><b>You get one offer.</b> Acknowledge, present the ready resolution as a choice, and escalate the instant they reiterate. Silently doing the account action anyway, after they asked for a person, is the named anti-pattern.</li>
          <li><b>Policy silence is an escalation trigger.</b> If the policy addresses own-site price adjustments and the customer asks about a competitor's price, the policy has not said "no" — it has said nothing. Nothing is a gap, and gaps go to humans.</li>
          <li><b>Policy ambiguity counts too.</b> "Arguably covered" is not covered. Do not resolve the ambiguity in the customer's favor or the company's; hand it over with both readings named.</li>
          <li><b>Escalate on category, not on count.</b> "Three failed tool calls" is a counter, not a criterion. Repeated failure <i>on the same input</i> is meaningful; three unrelated hiccups may not be.</li>
          <li><b>Never escalate empty.</b> Structured handoff: customer, issue type, root cause, records touched, amount, actions already taken, recommended next action.</li>
          <li><b>Thresholds are code.</b> Refund caps and approval limits belong inside the tool, reading a server-controlled value — never a model-supplied <code>approved</code> flag. Prompt rules bias the agent; they do not bind it. See <a class="pill" href="#/note/hook-vs-prompt">Deterministic Enforcement</a>.</li>
          <li><b>Do not average conflicting customer preferences.</b> When someone wants both the fastest and the cheapest resolution, name the tension and ask which one governs.</li>
        </ul>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.20-21, Task Statement 5.2, Skills bullets 2 and 4. Supporting: <code>exam-preparation-guide.md</code> §9 lines 1147-1227 and §7 line 893.</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>Escalation rate too <b>high</b> on easy cases and too <b>low</b> on exception cases → the answer is <b>explicit criteria + few-shot examples in the system prompt</b>. Not a classifier, not a confidence gate, not sentiment.</li>
          <li>Any option containing <b>"sentiment"</b> or <b>"self-report a confidence score"</b> as the escalation mechanism is wrong in a 5.2 item. Sentiment measures mood, not complexity; self-rated confidence is broken precisely where you need it.</li>
          <li>"Train a classifier on historical tickets" is wrong on <b>proportionality</b> — it is infrastructure before prompt optimization was attempted. Watch for the words "first step" or "most effective way to improve" in the stem.</li>
          <li>If the stem says the customer <b>asked for a human</b>, any option that investigates, verifies, or "attempts resolution first" is wrong. The correct option honors it that turn.</li>
          <li>If the stem says the policy <b>does not address</b> the customer's request, the answer is escalate — not "apply the closest analogous rule" and not "decline politely."</li>
          <li>Tool returned <b>multiple matches</b> → ask for an additional identifier or present candidates with differentiating fields. Any option that picks by recency, spend, or fuzzy name match is wrong.</li>
          <li>Distinguish <b>complex</b> from <b>uncovered</b>. Many wrong options quietly substitute "the case is complicated" for "the policy has a gap."</li>
          <li>Escalation options that omit the <b>handoff payload</b> lose on the pitfall list even when the trigger is right.</li>
        </ul>` },
    ],
  },
  {
    id: "codebase-context", title: "Large Codebase Exploration — Scratchpads, Manifests, Delegation", topic: "ctx", domain: 5, tasks: ["5.4"], concept: "delegation", icon: "▤",
    summary: "Long explorations degrade: the model drifts from the classes it found to \"typical patterns.\" The counters are scratchpad files, phase summaries, delegated reads, /compact, and a state manifest the coordinator reloads on resume. Covers every bullet of Task Statement 5.4; verified against the official Claude Code and prompting documentation (16 Aug 2026).",
    source: ["Claude Code Docs — Subagents, \"Isolate high-volume operations\"", "https://code.claude.com/docs/en/sub-agents#isolate-high-volume-operations"],
    sections: [
      { id: "manifest", h: "The state manifest — designing recovery you can actually resume from", html: `
        <p>Task Statement 5.4 asks for <b>crash recovery using structured agent state exports (manifests) that the coordinator loads on resume and injects into agent prompts</b>. Three separable moves live in that sentence: each agent <b>exports</b> state to a known location, the coordinator <b>loads a manifest</b>, and it <b>injects</b> — not replays — the relevant slice into each agent's prompt.</p>
        <p><b>Terminology divergence worth naming:</b> the study guide covers this under "State Persistence" and never uses the word <i>crash</i> — it frames the same design as durable state for long-running workflows. The PDF is the source of the crash-recovery framing. Same mechanism, and the exam's word is "crash", so expect the stem to describe a process dying mid-exploration.</p>
        <pre><code>{
  "workflow_id": "explore_refund_flow_2026_08_16",
  "updated_at": "2026-08-16T11:42:07Z",
  "completed_phases": ["entrypoint_map", "route_trace"],
  "current_phase": "dependency_trace",

  "agents": [
    {
      "agent": "test-inventory",
      "status": "complete",
      "state_file": ".agent-state/test-inventory.json",
      "summary_file": ".agent-state/test-inventory.md",
      "key_findings": [
        "14 spec files under tests/refund/",
        "no integration coverage for partial refunds"
      ]
    },
    {
      "agent": "refund-dependency-trace",
      "status": "interrupted",
      "state_file": ".agent-state/refund-deps.json",
      "last_completed_step": "resolved imports of services/refund.ts",
      "next_step": "follow calls into billing/ledger.ts"
    }
  ],

  "documents": [
    { "path": "services/refund.ts", "status": "analyzed", "claims": ["c_12", "c_13"] },
    { "path": "billing/ledger.ts",  "status": "pending" },
    { "path": "api/webhooks.ts",    "status": "skipped", "reason": "out of scope" }
  ],

  "open_gaps": [
    "who writes refund_status outside services/",
    "webhook retry semantics on duplicate refund events"
  ]
}</code></pre>
        <p><b>The resume flow, step by step:</b></p>
        <ul>
          <li>The coordinator reads <b>the manifest only</b> — not the per-agent state files, and definitely not the transcripts. The manifest is the index; the state files are the payload.</li>
          <li>For each agent it needs to restart, it opens that agent's <code>state_file</code> and builds a prompt containing <b>the slice that agent needs</b>: its completed steps, its <code>next_step</code>, and the findings from other agents that bear on its work. The guide states the rule directly — on resume the coordinator <b>loads the manifest and injects only relevant state into each agent prompt</b>, which is more efficient than replaying every subagent transcript.</li>
          <li>The <code>documents</code> array is what prevents re-reading work already done: <code>analyzed</code> files are skipped, <code>pending</code> files are the queue, <code>skipped</code> carries its own reason so the next run does not re-litigate the decision.</li>
          <li><code>open_gaps</code> survives the crash. Without it, the resumed run reconstructs a plausible-looking plan that quietly omits the questions the previous run had not yet answered.</li>
          <li><b>Injection is mandatory because the subagent's context is empty.</b> A resumed coordinator remembering the state is worthless if that state never reaches the prompt string the subagent actually receives.</li>
        </ul>
        <p>Two supporting points from official sources. Anthropic's multi-agent research post describes the same requirement in production terms: agents run long, maintaining state across many tool calls, and <b>restarting from the beginning is expensive</b> — so they built systems that resume from where the agent was, combining the model's adaptability with deterministic safeguards like <b>retry logic and regular checkpoints</b>. And the prompting guidance is specific about the format: use <b>structured formats (JSON) for structured state</b> like task status, freeform text for progress notes, and git as a checkpoint log.</p>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/multi-agent-research-system#production-reliability-and-engineering-challenges" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Production reliability and engineering challenges" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#state-management-best-practices" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Prompting best practices, "State management best practices" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §8 "State Persistence" (repo root, lines 1096-1116; manifest JSON at 1100-1113, resume rule at line 1115). Exam wording, including "crash recovery": <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.21-22, Task Statement 5.4, Knowledge bullet 4 and Skills bullet 4.</p>` },
      { id: "eli5", h: "Scratchpads, in plain terms", html: `
        <p><b>The symptom first, because it is how you know you need one.</b> The PDF describes context degradation in extended sessions like this: the model <b>starts giving inconsistent answers and referencing "typical patterns" rather than the specific classes discovered earlier</b>. That is the tell, and it is oddly precise. Two hours in, you ask about the refund path and the agent stops saying <code>RefundProcessor.applyPartial()</code> — the thing it read and explained an hour ago — and starts saying "typically, a refund service would validate the amount and then…". It has not been told anything new. It has drifted from <i>your</i> codebase to <i>a</i> codebase. Answers also start contradicting earlier ones, because there is no longer a single stable account of what was found.</p>
        <p><b>The fix is a file.</b> As the exploration goes, the agent writes durable findings to a scratchpad — important files, data flow, open questions, confirmed assumptions, risk areas, next steps — and then <b>answers later questions by re-reading that file</b> instead of re-deriving from a context window that has started forgetting. The file does not degrade. Context does. So you move the load-bearing knowledge out of the thing that degrades and into the thing that does not.</p>
        <p>Keep it durable, not verbose. A scratchpad that is a transcript is just context in a different place. What earns a line: a path you will need again, a decision and its reason, a question you have not answered yet.</p>
        <ul>
          <li><b>The three-hour legacy monolith.</b> Hour one maps entry points, hour two traces one execution path, hour three answers questions. Without a scratchpad, hour three is answering from vibes. With one, every answer cites a file you actually opened.</li>
          <li><b>The handoff to tomorrow (or to a colleague).</b> A resumed session restores the conversation, not your understanding of it — and if the files changed since, restored tool results are stale snapshots. A scratchpad is the one artifact that survives a new session, a new machine, and a compaction. See <a class="pill" href="#/note/resume-stale">Session Resumption</a>.</li>
          <li><b>Compaction is about to fire.</b> Summarization compresses; whatever was not written down is what gets compressed away. Writing findings <i>before</i> the boundary is how you choose what survives it. The official guidance for long tasks says the same: save progress and state before the context window refreshes, and when starting a fresh window, be prescriptive — "review progress.txt, tests.json, and the git logs."</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#workflows-across-multiple-context-windows" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Prompting best practices, "Workflows across multiple context windows" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source for the degradation wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.21-22, Task Statement 5.4, Knowledge bullet 1 and Skills bullet 2. Scratchpad contents list: <code>exam-preparation-guide.md</code> §10 "Scratchpads" (repo root, lines 1314-1326) and §10 exploration workflow step 5 (line 1257).</p>` },
      { id: "delegate", h: "Delegation and /compact — two different tools for the same pressure", html: `
        <p>Both keep context small; they are not interchangeable. Delegation keeps verbose output <b>out</b> of the main context. Compaction removes what already got in.</p>
        <ul>
          <li><b>Delegation (preventive).</b> The official pattern is named "isolate high-volume operations": running tests, fetching documentation, or processing log files consumes significant context, so you delegate them and <b>the verbose output stays in the subagent's context while only the relevant summary returns</b>. For exploration this is the whole game — "find all test files", "trace the refund flow's dependencies" — the subagent eats hundreds of file reads and hands back a paragraph.</li>
          <li><b>The main agent's job during that is coordination</b>, not reading. It holds the high-level model of the system and decides what to ask next; it does not accumulate the raw material.</li>
          <li><b>The counter-pressure is real.</b> The same documentation page carries a warning: subagent results return to the main conversation, and running many subagents that each return detailed results can itself consume significant context. Delegation moves the cost; it does not delete it. Specify the return shape.</li>
          <li><b>/compact (corrective).</b> When context has already filled with verbose discovery output, <code>/compact</code> summarizes the conversation. Give it direction — <code>/compact Focus on code samples and API usage</code> tells Claude what to preserve during summarization, and standing preferences can live under a "Compact instructions" heading in CLAUDE.md. In a fresh session <code>/compact</code> prints "Not enough messages to compact."</li>
          <li>Auto-compaction fires on its own near the context limit, and <b>subagents compact too</b>, using the same logic as the main conversation. Main-conversation compaction does <b>not</b> touch subagent transcripts — those live in separate files.</li>
          <li><b>Order of operations:</b> delegate first, compact second. If you compact your way through an exploration that should have been delegated, you are repeatedly summarizing output that never needed to be in your context.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/sub-agents#isolate-high-volume-operations" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Subagents, "Isolate high-volume operations" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/costs#manage-context-proactively" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Manage costs, "Manage context proactively" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "rules", h: "Reminders — summarize before you spawn", html: `
        <ul>
          <li><b>Summarize the finished phase before spawning the next phase's subagents, and inject that summary into their initial context.</b> This is a Skills bullet in 5.4, and it only makes sense once you accept the next point.</li>
          <li><b>A subagent's context starts empty.</b> Officially: each subagent starts with a fresh, isolated context window; it does not see your conversation history, the skills you invoked, or the files Claude already read. Its initial context is its own system prompt, the <b>delegation message Claude writes</b>, the CLAUDE.md hierarchy, a git-status snapshot, and any preloaded skills.</li>
          <li>So "it already knows, we discussed it" is <b>false</b>. Phase 1's findings reach phase 2 only if they are written into phase 2's prompt string. This is why the summary step exists — it produces the thing you paste.</li>
          <li><b>The exception is a fork</b>, which inherits the parent conversation instead of starting fresh. Everything else in this list assumes non-fork subagents.</li>
          <li>Also absent from a non-fork subagent: your output style, the main conversation's auto memory, and the parent's context-window size (a subagent's window is sized by <b>its own model</b>).</li>
          <li><b>Explore and Plan skip CLAUDE.md and git status entirely.</b> If a rule matters to them — "ignore the vendor/ directory" — restate it in the delegation prompt.</li>
          <li>The summary is not a dump. It is the phase's <b>durable conclusions</b>: which files matter, what the data flow looks like, what is still open. Same content as the scratchpad, which is why the scratchpad usually <i>is</i> the summary.</li>
          <li>Prompt shape for the spawned agents follows the coordinator rules: objective, boundary, output format, effort budget — see <a class="pill" href="#/note/coordinator-prompt">Coordinator Prompts</a>.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/sub-agents#what-loads-at-startup" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Subagents, "What loads at startup" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/agent-sdk/subagents#what-subagents-inherit" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Agent SDK Docs, "What subagents inherit" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>Stem says the agent <b>"references typical patterns"</b> or gives <b>inconsistent answers</b> late in a long session → that is the named symptom of context degradation. The answer involves <b>scratchpad files</b>, not a bigger model and not "remind it to be careful."</li>
          <li>Stem says exploration output is <b>flooding the main context</b> → delegate to subagents so verbose output stays in their windows. <code>/compact</code> is the answer when the flooding <b>already happened</b>.</li>
          <li>Stem says the process <b>crashed</b> or was interrupted mid-workflow → structured state exports plus a manifest the coordinator loads on resume. "Replay all subagent transcripts" is the wrong option; the guide calls injecting only relevant state the more efficient path.</li>
          <li>Any option that assumes a subagent <b>inherits</b> the parent's findings is wrong. Context passes only through the prompt string.</li>
          <li>Between phases, the right artifact is a <b>summary injected into the next phase's initial context</b> — not "let the next agent re-explore" and not "pass the full transcript".</li>
          <li>For exploration mechanics themselves: <b>Grep</b> for text inside files, <b>Glob</b> for paths, map before reading, and do not read hundreds of files upfront.</li>
          <li>Watch the boundary with 1.7: <b>sessions persist the conversation, not the filesystem.</b> A manifest is what carries filesystem-level progress across a restart.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §10 "Built-in Tool Selection" and exploration workflow (repo root, lines 1236-1261). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.21-22, Task Statement 5.4.</p>` },
    ],
  },
  {
    id: "confidence-review", title: "Confidence Calibration and Human Review Routing", topic: "ctx", domain: 5, tasks: ["5.5"], concept: "calibration", icon: "▤",
    summary: "A raw confidence score means nothing until a labeled validation set says what it means. Field-level scores, calibrated thresholds, two independent review triggers, stratified sampling after launch, and segment analysis before automating. Covers every bullet of Task Statement 5.5; verified against the official evaluation and structured-output documentation (16 Aug 2026).",
    source: ["Claude Docs — Create strong empirical evaluations, \"Eval design principles\"", "https://platform.claude.com/docs/en/test-and-evaluate/eval-tool#eval-design-principles"],
    sections: [
      { id: "calibrate", h: "Field-level confidence, then calibration against labeled data", html: `
        <p>Two halves, and the exam tests the second one. <b>Half one: emit confidence per field, not per document.</b> A document-level score averages a vendor name the model is certain about with an OCR-mangled total it is guessing at, and produces a number that describes neither.</p>
        <pre><code>{
  "document_id": "inv_88412",
  "document_type": "vendor_invoice_scanned",
  "fields": {
    "vendor":       { "value": "Acme Corp",  "confidence": 0.94 },
    "invoice_date": { "value": "2026-07-30", "confidence": 0.91 },
    "amount_due":   {
      "value": 1280.5,
      "confidence": 0.62,
      "requires_review": true,
      "review_reasons": ["total_mismatch", "low_ocr_quality"]
    }
  },
  "requires_review": true,
  "review_reasons": ["amount_below_confidence_threshold"]
}</code></pre>
        <p>Note what <code>requires_review</code> is: a <b>derived boolean with reasons</b>, not a raw score handed to the agent to interpret. The guide is explicit that raw scores invite both over-trust and over-escalation, while calibrated thresholds produce consistent behavior. The reasons are what make a reviewer fast — "look at the total, the OCR was poor" beats "confidence 0.62".</p>
        <p><b>Half two: the calibration procedure.</b> <code>confidence: 0.92</code> does not mean 92% accuracy. It means nothing at all until you measure it.</p>
        <ul>
          <li><b>1. Build a labeled validation set that mirrors the real distribution.</b> The official eval design principles: be task-specific, mirror your real-world task distribution, and <b>do not forget edge cases</b> — irrelevant or nonexistent input data, overly long inputs, ambiguous cases where humans would struggle to agree. And <b>prioritize volume over per-item polish</b>: more items with slightly noisier automated grading beats a handful of hand-graded ones.</li>
          <li><b>2. Run the extractor over it and join output to labels field by field.</b> Field-level scores demand field-level ground truth.</li>
          <li><b>3. Bucket by confidence band and compute measured accuracy per band</b> — then repeat the breakdown per field and per document type. One curve for the whole pipeline hides exactly what you are trying to find.</li>
          <li><b>4. Read the threshold off the measured curve</b>, not off intuition. The threshold is the lowest band whose measured accuracy clears your tolerance for that field's impact.</li>
          <li><b>5. Compute <code>requires_review</code> outside the model</b> from that threshold, and return it alongside the data.</li>
          <li><b>6. Recalibrate when the prompt, the model, or the document mix changes.</b> A calibration is bound to that triple. Swapping the model silently invalidates every threshold you set.</li>
        </ul>
        <p>What the resulting table looks like — this, not the score itself, is the artifact that authorizes automation:</p>
        <table>
          <thead><tr><th>Confidence band</th><th>n (labeled)</th><th>Measured accuracy</th><th>Routing decision</th></tr></thead>
          <tbody>
            <tr><td>0.90 - 1.00</td><td>4,120</td><td>99.1%</td><td>Auto-accept</td></tr>
            <tr><td>0.80 - 0.90</td><td>980</td><td>96.4%</td><td>Auto-accept (non-financial fields only)</td></tr>
            <tr><td>0.70 - 0.80</td><td>430</td><td>88.2%</td><td>Route to review</td></tr>
            <tr><td>below 0.70</td><td>210</td><td>61.5%</td><td>Route to review</td></tr>
          </tbody>
        </table>
        <p>Read the 0.80-0.90 row: the model's self-assessment is <b>optimistic by roughly 15 points at the low end and accurate at the high end</b>. That non-linearity is normal, and it is invisible without the table. It is also why "set the threshold at 0.85 because that felt right" is the pitfall the guide names outright: <b>using confidence without calibration</b>.</p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/test-and-evaluate/eval-tool#eval-design-principles" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Create strong empirical evaluations, "Eval design principles" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/structured-outputs#json-outputs" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Structured outputs, "JSON outputs" (relevant section) — the mechanism that guarantees the per-field shape above is actually emitted <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §5 "Confidence and Human Review" (repo root, lines 550-566) and §2 "Output: requires_review and Decision Hints" (lines 265-283). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.22-23, Task Statement 5.5, Knowledge bullet 3 and Skills bullet 3.</p>` },
      { id: "sampling", h: "Stratified random sampling of high-confidence output", html: `
        <p>This one is counter-intuitive: after you automate, you keep reviewing a slice of the extractions you <b>decided not to review</b>. That is the only way to find out whether the decision was right, and to catch error patterns nobody wrote a validation rule for.</p>
        <p><b>The strata.</b> Sample within cells, not from the pile:</p>
        <ul>
          <li><b>Document type</b> — typed PDF, EDI feed, scanned fax, handwritten remittance. This is the axis that most often hides failure.</li>
          <li><b>Field</b> — <code>amount_due</code> and <code>payment_terms</code> fail for completely different reasons and at completely different rates.</li>
          <li><b>Confidence band</b> — including the top band. "It was confident" is the hypothesis under test, not an exemption from it.</li>
          <li>The guide's fuller list for evaluation by segment adds <b>prompt version</b>, <b>model</b>, <b>source quality</b>, and <b>reviewer correction category</b>. Those are the axes that tell you whether last month's prompt change actually helped.</li>
        </ul>
        <p><b>Why plain random sampling fails.</b> Suppose handwritten remittance advices are 2% of a 50,000-document month and you review a 1% random sample. That is 500 documents, of which roughly <b>10</b> are handwritten. Ten items cannot distinguish a 5% error rate from a 30% one — the sample is dominated by the easy majority type, in exact proportion to how common it is. Random sampling allocates attention by <b>volume</b>. Stratified sampling allocates it by <b>where you need to know</b>: fix a quota per cell (say 60 per document type per month) and the rare-but-failing segment gets measured at a rate you chose rather than a rate its volume dictated.</p>
        <p><b>Why it is specifically for novel patterns.</b> Validation rules only catch what someone anticipated. A new vendor template that shifts the total into a different column, an OCR update that starts reading "1" as "7", a document type that appeared last week — these produce values that are <b>well-formed, schema-compliant, plausible, and wrong</b>. No syntax check fires. The model is confident because the input looks clean. Human eyes on a random slice of confident output is the only detector that does not require you to have predicted the failure.</p>
        <ul>
          <li><b>Continuous, not a launch gate.</b> A fixed percentage, sampled every period, so you have a time series rather than a snapshot.</li>
          <li><b>It also measures whether fixes worked.</b> Without ongoing sampling you cannot tell whether a prompt change reduced the error rate or just moved it.</li>
          <li><b>Wrong alternatives the guide names:</b> relying on downstream complaints — which misses systematic errors that look reasonable to anyone not reading the source document — and lowering the threshold instead of measuring.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §5 "Validating Automation Plans" (repo root, lines 575-580, ongoing stratified review at line 579) and §11 "Evaluation Loops" (lines 1541-1554). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.22-23, Task Statement 5.5, Knowledge bullet 2 and Skills bullet 1. No current documentation page describes stratified sampling for extraction QA; this rests on the guide and the PDF.</p>` },
      { id: "eli5", h: "In plain terms", html: `
        <p><b>Two separate reasons to send something to a human, and they are independent.</b></p>
        <p><b>Reason one: the model is unsure.</b> Calibrated low confidence on a field. Straightforward — the pipeline says "I could not read this."</p>
        <p><b>Reason two: the document is unsure.</b> The source itself is ambiguous or contradicts itself, and the model can be perfectly confident while reading it. Confidence answers "how sure am I about what this document says" — it does <b>not</b> answer "does what this document says make sense." An invoice whose line items sum to $1,240 while the stated total reads $1,280 can be extracted at 0.97 confidence, because both numbers are printed crisply. The model read it correctly. The document is wrong. Only trigger two catches that, which is why routing on confidence alone leaves a whole class of errors in the automated pile.</p>
        <p>The full routing list adds three more: <b>high-impact fields</b> (route them at a stricter threshold — a wrong vendor name is annoying, a wrong bank account is expensive), <b>failed semantic validation</b> (the arithmetic does not close, the date is in the future), and <b>new or historically error-prone document types</b>.</p>
        <p>All of this exists because reviewer capacity is fixed. You cannot review everything, so review the things most likely to be wrong and most costly if they are.</p>
        <ul>
          <li><b>Self-contradicting invoice.</b> Subtotal plus tax does not equal the printed total. Model confidence high. Extract both, flag <code>total_mismatch</code>, route to a human — and do not silently "correct" the arithmetic.</li>
          <li><b>Amended contract.</b> The document contains the original effective date and an amendment changing it, both still present. There are genuinely two candidate answers in the source. Ambiguity, not low confidence.</li>
          <li><b>A document type first seen last week.</b> No calibration data exists for it yet, so its confidence numbers are uninterpreted. Route it until the labeled set has enough of them to produce a band table.</li>
        </ul>
        <p><b>And stratified sampling, plainly:</b> don't sample the pile, sample each bin. If you scoop a random handful out of a mixed pile, you mostly get whatever is most common — and the rare thing that is quietly broken is the thing you never scoop. So sort into bins first (by document type, by field, by confidence band), then take a fixed number out of <b>every</b> bin, including the bins you are confident about. That is the point: you are checking the confidence, so you must sample the confident stuff.</p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §5 "Confidence and Human Review" routing list (repo root, lines 567-574). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.22-23, Task Statement 5.5, Skills bullet 4.</p>` },
      { id: "rules", h: "Reminders — the 97% trap", html: `
        <p>The exam names this risk directly: <b>aggregate accuracy metrics (e.g. 97% overall) may mask poor performance on specific document types or fields.</b> Worked out, it looks like this:</p>
        <table>
          <thead><tr><th>Document type</th><th>Share of volume</th><th>Measured accuracy</th><th>Contribution to the aggregate</th></tr></thead>
          <tbody>
            <tr><td>Typed PDF invoices</td><td>71%</td><td>99.2%</td><td>70.4</td></tr>
            <tr><td>EDI feeds</td><td>18%</td><td>98.8%</td><td>17.8</td></tr>
            <tr><td>Scanned faxes</td><td>8%</td><td>91.0%</td><td>7.3</td></tr>
            <tr><td>Handwritten remittance</td><td>3%</td><td>78.0%</td><td>2.3</td></tr>
            <tr><td><b>Weighted total</b></td><td><b>100%</b></td><td><b>97.8%</b></td><td><b>97.8</b></td></tr>
          </tbody>
        </table>
