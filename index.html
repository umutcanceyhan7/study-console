<meta charset="utf-8" />
<title>CCAF Study Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<style>
/* ============================================================
   DOSYA — case file. Sıcak kum kâğıt, koyu nar mürekkep.
   Tek dosya, harici bağımlılık yok, sistem fontları.
   Ana kural: YANLIŞ OLMAK RENK TAŞIMAZ. Kroma bütçesi
   yalnızca "resmî kaynak ne diyor" eksenine harcanır.
============================================================ */

:root {
  color-scheme: light;

  --surface:        oklch(.968 .008 75);
  --surface-sunk:   oklch(.942 .010 72);
  --surface-raise:  oklch(.991 .004 80);

  --ink:            oklch(.24  .016 45);
  --ink-2:          oklch(.46  .014 50);
  --ink-3:          oklch(.56  .012 55);

  --rule:           oklch(.885 .010 70);
  --rule-2:         oklch(.820 .012 68);

  --garnet:         oklch(.44  .14  25);
  --garnet-deep:    oklch(.36  .13  25);
  --garnet-wash:    oklch(.935 .028 30);
  --garnet-on:      oklch(.972 .012 40);

  --pine:           oklch(.44  .09  155);
  --pine-wash:      oklch(.948 .026 160);

  --ochre:          oklch(.45  .10  72);
  --ochre-wash:     oklch(.950 .030 80);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono",
          "JetBrains Mono", Menlo, Consolas, monospace;

  --rail: 264px;
  --toc: 220px;
  --measure: 68ch;
  --r-s: 3px;
  --r-m: 6px;

  --ease: cubic-bezier(.16, 1, .3, 1);
  --t: 180ms;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:        oklch(.205 .012 55);
  --surface-sunk:   oklch(.172 .010 55);
  --surface-raise:  oklch(.248 .013 55);
  --ink:            oklch(.93  .008 78);
  --ink-2:          oklch(.74  .010 70);
  --ink-3:          oklch(.55  .010 60);
  --rule:           oklch(.302 .012 55);
  --rule-2:         oklch(.385 .014 55);
  --garnet:         oklch(.66  .15  20);
  --garnet-deep:    oklch(.74  .14  22);
  --garnet-wash:    oklch(.265 .035 28);
  --garnet-on:      oklch(.16  .015 30);
  --pine:           oklch(.68  .11  158);
  --pine-wash:      oklch(.245 .030 158);
  --ochre:          oklch(.75  .11  75);
  --ochre-wash:     oklch(.262 .032 75);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:        oklch(.205 .012 55);
    --surface-sunk:   oklch(.172 .010 55);
    --surface-raise:  oklch(.248 .013 55);
    --ink:            oklch(.93  .008 78);
    --ink-2:          oklch(.74  .010 70);
    --ink-3:          oklch(.55  .010 60);
    --rule:           oklch(.302 .012 55);
    --rule-2:         oklch(.385 .014 55);
    --garnet:         oklch(.66  .15  20);
    --garnet-deep:    oklch(.74  .14  22);
    --garnet-wash:    oklch(.265 .035 28);
    --garnet-on:      oklch(.16  .015 30);
    --pine:           oklch(.68  .11  158);
    --pine-wash:      oklch(.245 .030 158);
    --ochre:          oklch(.75  .11  75);
    --ochre-wash:     oklch(.262 .032 75);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
::selection { background: var(--garnet-wash); color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--garnet);
  outline-offset: 2px;
  border-radius: 2px;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 200;
  background: var(--garnet); color: var(--garnet-on);
  padding: 10px 16px; border-radius: var(--r-s); font-weight: 700; font-size: .9rem;
  transition: top var(--t) var(--ease);
}
.skip:focus { top: 12px; }

/* ---------------- Shell ---------------- */

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--rule);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 26px 14px 48px;
  background: var(--surface);
}

.mast { padding: 0 10px 26px; }
.mast .wordmark {
  font-family: var(--mono); font-size: .8rem; font-weight: 600; letter-spacing: .02em;
  color: var(--garnet); display: block;
}
.mast h1 {
  font-size: 1.02rem; font-weight: 750; letter-spacing: -.02em;
  line-height: 1.25; margin: 4px 0 0;
}
.mast p { font-size: .78rem; color: var(--ink-2); margin: 3px 0 0; line-height: 1.45; }

.navgroup { margin-bottom: 26px; }
.navgroup > .glabel {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); padding: 0 10px 9px; display: block;
}

.nav {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-s);
  font-size: .885rem; color: var(--ink-2);
  transition: background-color var(--t) var(--ease), color var(--t) var(--ease);
  position: relative;
}
.nav:hover { background: var(--surface-sunk); color: var(--ink); }
.nav[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--surface-sunk); }
.nav[aria-current="page"]::before {
  content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 3px; background: var(--garnet); border-radius: 50%;
}
.nav .glyph { color: var(--ink-3); font-size: .82rem; width: 14px; text-align: center; flex: none; }
.nav[aria-current="page"] .glyph { color: var(--garnet); }
.nav .n {
  margin-left: auto; font-family: var(--mono); font-size: .72rem; font-weight: 600;
  color: var(--ink-2); flex: none;
}
.nav .mono-code {
  font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .02em;
  color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 2px;
  width: 30px; text-align: center; flex: none; padding: 1px 0;
}
.nav[aria-current="page"] .mono-code { color: var(--garnet); border-color: var(--garnet); }

/* ---------------- Topbar ---------------- */

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter: saturate(160%) blur(10px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 14px;
  padding: 11px 32px;
}
.crumbs {
  font-size: .8rem; color: var(--ink-2); display: flex; align-items: center; gap: 8px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.crumbs b { color: var(--ink); font-weight: 650; }
.crumbs a { color: var(--ink-2); }
.crumbs a:hover { color: var(--garnet); }
.crumbs .sep { color: var(--ink-3); }

.finder {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--surface-raise); border: 1px solid var(--rule-2);
  border-radius: var(--r-s); padding: 5px 10px; width: 250px; max-width: 38vw;
  transition: border-color var(--t) var(--ease);
}
.finder:focus-within { border-color: var(--garnet); }
.finder .g { color: var(--ink-3); font-size: .85rem; flex: none; }
.finder input {
  border: 0; background: transparent; outline: none; color: var(--ink);
  font-family: var(--sans); font-size: .85rem; width: 100%; min-width: 0;
}
.finder input::placeholder { color: var(--ink-3); }
.finder kbd {
  font-family: var(--mono); font-size: .68rem; color: var(--ink-2);
  border: 1px solid var(--rule-2); border-radius: 2px; padding: 0 5px; flex: none;
}

.iconbtn {
  border: 1px solid var(--rule-2); background: var(--surface-raise); color: var(--ink-2);
  border-radius: var(--r-s); width: 32px; height: 32px; flex: none;
  display: grid; place-items: center; font-size: .95rem;
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.iconbtn:hover { color: var(--garnet); border-color: var(--garnet); }
.menubtn { display: none; }

.content { padding: 40px 32px 120px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.reading { max-width: var(--measure); }
.reading table {
  width: 100%; border-collapse: collapse; margin: 18px 0 4px;
  font-size: .82rem; display: block; overflow-x: auto;
}
.reading table thead th {
  text-align: left; font-weight: 700; color: var(--ink-2);
  font-size: .715rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 0 14px 8px; border-bottom: 1px solid var(--rule-2); white-space: nowrap;
}
.reading table td {
  padding: 8px 14px; border-bottom: 1px solid var(--rule); vertical-align: top;
}
.reading table tbody tr:last-child td { border-bottom: none; }
.reading table td:first-child { font-weight: 650; }

/* ---------------- Type ---------------- */

.eyebrow {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--garnet); margin: 0 0 14px;
}
h2.title {
  font-size: 1.95rem; font-weight: 750; letter-spacing: -.026em; line-height: 1.14;
  margin: 0 0 14px; max-width: 22ch;
}
.briefing {
  font-size: clamp(2rem, 1.5rem + 1.9vw, 2.85rem);
  font-weight: 800; letter-spacing: -.035em; line-height: 1.06;
  margin: 0 0 20px; max-width: 17ch;
}
.briefing .quiet { color: var(--ink-2); font-weight: 750; }
.lede { font-size: 1.02rem; color: var(--ink-2); margin: 0 0 32px; max-width: var(--measure); }

h3 {
  font-size: 1.32rem; font-weight: 700; letter-spacing: -.014em; line-height: 1.3;
  margin: 56px 0 14px; scroll-margin-top: 88px;
}
h3:first-of-type { margin-top: 44px; }
h4 { font-size: 1.02rem; font-weight: 700; letter-spacing: -.005em; margin: 32px 0 10px; }
p { margin: 0 0 16px; }
strong, b { font-weight: 650; }
.small { font-size: .865rem; line-height: 1.6; }
.quiet { color: var(--ink-2); }

.mlabel {
  font-size: .715rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); display: flex; align-items: center; gap: 7px;
}
.mlabel code { text-transform: none; letter-spacing: 0; font-weight: 600; }

code {
  font-family: var(--mono); font-size: .84em;
  background: var(--surface-sunk); border: 1px solid var(--rule);
  border-radius: 2px; padding: 1px 5px; word-break: break-word;
}
pre {
  background: var(--surface-sunk); border: 1px solid var(--rule); border-radius: var(--r-m);
  padding: 16px 18px; overflow-x: auto; margin: 0 0 18px;
  font-size: .8rem; line-height: 1.65;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }

ul, ol { margin: 0 0 16px; padding-left: 22px; }
li { margin-bottom: 7px; }
li::marker { color: var(--ink-3); }

hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 48px 0; }

/* ---------------- Chips ---------------- */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .715rem; font-weight: 700; letter-spacing: .04em;
  border-radius: var(--r-s); padding: 3px 9px;
  border: 1px solid var(--rule-2); color: var(--ink-2); background: transparent;
  white-space: nowrap; line-height: 1.5;
}
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }

.chip.v-ok    { color: var(--pine);   border-color: var(--pine); }
.chip.v-warn  { color: var(--ochre);  border-color: var(--ochre); }
.chip.v-conf  { color: var(--garnet-on); background: var(--garnet); border-color: var(--garnet); }

.tcode {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .02em;
  border: 1px solid var(--rule-2); border-radius: 2px;
  padding: 1px 6px; color: var(--ink-2); flex: none;
}
a:hover > .tcode, .row:hover .tcode { border-color: var(--garnet); color: var(--garnet); }

.stars { font-size: .75rem; color: var(--ink-3); letter-spacing: .12em; flex: none; }
.stars .on { color: var(--garnet); }

.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------------- Ledger rows ---------------- */

.ledger { border-top: 1px solid var(--rule); margin: 0 0 8px; }

.row {
  display: block; position: relative;
  padding: 18px 18px 18px 20px;
  border-bottom: 1px solid var(--rule);
  transition: background-color var(--t) var(--ease);
}
a.row:hover, a.row:focus-visible { background: var(--surface-sunk); }
a.row::before {
  content: ""; position: absolute; left: 5px; top: 24px;
  width: 3px; height: 3px; background: var(--garnet);
  opacity: 0; transition: opacity var(--t) var(--ease);
}
a.row:hover::before, a.row:focus-visible::before { opacity: 1; }

.row .rtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
.row .rid {
  font-family: var(--mono); font-size: .72rem; font-weight: 600; letter-spacing: .04em;
  color: var(--ink-2); flex: none;
}
.row .rq { font-size: .97rem; font-weight: 550; line-height: 1.55; margin-bottom: 8px; max-width: 78ch; }
.row .ra { font-size: .845rem; color: var(--ink-2); max-width: 78ch; }
.row .ra .k { color: var(--pine); font-weight: 700; }

/* ---------------- Data strip ---------------- */

.strip {
  display: flex; flex-wrap: wrap;
  border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2);
  margin: 0 0 44px;
}
.strip > div {
  padding: 16px 28px 16px 0; margin-right: 28px;
  border-right: 1px solid var(--rule);
}
.strip > div:last-child { border-right: 0; margin-right: 0; }
.strip .n {
  font-size: 1.7rem; font-weight: 750; letter-spacing: -.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.strip .n.acc { color: var(--garnet); }
.strip .l { font-size: .78rem; color: var(--ink-2); margin-top: 2px; }

/* ---------------- Cards (sparingly) ---------------- */

.card {
  border: 1px solid var(--rule); border-radius: var(--r-m);
  padding: 20px 22px; background: transparent;
}
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* ---------------- Bars ---------------- */

.bar { height: 5px; background: var(--surface-sunk); border-radius: 20px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--garnet); border-radius: 20px; }
.bar.q > i { background: var(--rule-2); }

/* ---------------- Answer blocks ---------------- */

/* Yanlış olmak renk taşımaz: nötr, çökertilmiş, glif + etiketle işaretli. */
.ans-wrong {
  background: var(--surface-sunk); border: 1px solid var(--rule);
  border-radius: var(--r-m); padding: 15px 18px; margin: 0 0 14px;
}
.ans-wrong .mlabel { color: var(--ink-2); margin-bottom: 8px; }
.ans-wrong .body { font-size: .95rem; color: var(--ink-2); }
.ans-wrong .body code { background: var(--surface); }

.ans-right { border-top: 1px solid var(--pine); padding: 15px 2px 4px; margin: 0 0 8px; }
.ans-right .mlabel { color: var(--pine); margin-bottom: 8px; }
.ans-right .body { font-size: .95rem; color: var(--ink); font-weight: 500; }

/* ---------------- Callouts (no side stripes) ---------------- */

.note {
  border: 1px solid var(--rule-2); border-radius: var(--r-m);
  padding: 18px 20px; margin: 0 0 22px;
}
.note .mlabel { margin-bottom: 9px; }
.note p:last-child { margin-bottom: 0; }
.note.acc { border-color: var(--garnet); background: var(--garnet-wash); }
.note.acc .mlabel { color: var(--garnet); }
.note.warn { border-color: var(--ochre); background: var(--ochre-wash); }
.note.warn .mlabel { color: var(--ochre); }
.note.ok { border-color: var(--pine); background: var(--pine-wash); }
.note.ok .mlabel { color: var(--pine); }

/* Kaynağa atlama satırı — resmî açıklamanın altında, kutunun içinde. */
.srcline {
  margin: 14px 0 0; padding-top: 12px;
  border-top: 1px solid var(--rule-2);
  font-size: .82rem; line-height: 1.5;
}
.srcline a {
  color: var(--garnet); text-decoration: none;
  border-bottom: 1px solid transparent;
}
.srcline a:hover { border-bottom-color: var(--garnet); }
.note.warn .srcline a { color: var(--ochre); }
.note.warn .srcline a:hover { border-bottom-color: var(--ochre); }
.srcline.none { color: var(--ink-3); }

/* ---------------- Kullanım kalıpları (syntax kartları) ----------------
   Doğru form renk taşır (pine), yanlış form taşımaz: .ans-wrong/.ans-right
   ikilisiyle aynı dil. Amaç sınavda şıkkı bakışta ayırt edebilmek. */

.ucard {
  border: 1px solid var(--rule); border-radius: var(--r-m);
  padding: 24px 26px; margin: 0 0 22px;
}
.ucard > h4 { margin: 0 0 6px; font-size: 1.02rem; }
.ucard .uask { font-size: .875rem; color: var(--ink-2); margin: 0 0 20px; line-height: 1.6; }
.ucard .umeta { margin-bottom: 12px; }

.ucols { display: grid; gap: 20px; grid-template-columns: 1fr; }
/* Yan yana yalnızca kod satırı sığdığında. Altında tek sütun — sıkıştırılmış
   kod bloğu yatay kaydırma demek, o da karşılaştırmayı bitirir. */
@media (min-width: 1700px) {
  .ucols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.usnip { margin: 0 0 16px; }
.usnip:last-child { margin-bottom: 0; }
.usnip .mlabel { margin-bottom: 8px; }
.usnip pre { margin: 0; }
.usnip .uwhy { font-size: .82rem; line-height: 1.6; color: var(--ink-2); margin: 8px 0 0; }

.usnip.good .mlabel { color: var(--pine); }
.usnip.good pre { border-color: var(--pine); background: var(--pine-wash); }

.usnip.bad .mlabel { color: var(--ink-2); }
.usnip.bad pre { color: var(--ink-2); border-style: dashed; }

.urule {
  background: var(--surface-sunk); border-radius: var(--r-m);
  padding: 15px 17px; margin: 20px 0 0; font-size: .9rem; line-height: 1.65;
}
.urule .mlabel { margin-bottom: 7px; }
.urule p:last-child { margin-bottom: 0; }

/* ---------------- Flow / remember ---------------- */

.remember { background: var(--surface-sunk); border-radius: var(--r-m); padding: 20px 22px; }
.remember .mlabel { margin-bottom: 14px; color: var(--ink); }
.flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flow.vert { flex-direction: column; align-items: flex-start; gap: 8px; }
.flow .node {
  font-family: var(--mono); font-size: .78rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 6px 11px;
}
.flow .node.no { border-color: var(--rule-2); color: var(--ink-2); text-decoration: line-through; }
.flow .node.yes { border-color: var(--pine); color: var(--pine); }
.flow .arrow { color: var(--ink-3); font-size: .9rem; flex: none; }
.flow.vert .arrow { margin-left: 14px; }

/* ---------------- Doc links ---------------- */

.doc {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border: 1px solid var(--rule); border-radius: var(--r-m);
  margin-bottom: 8px;
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease);
}
.doc:hover, .doc:focus-visible { border-color: var(--garnet); background: var(--surface-sunk); }
.doc .g { color: var(--ink-3); font-size: .85rem; flex: none; }
.doc:hover .g { color: var(--garnet); }
.doc .m { min-width: 0; }
.doc .t { font-size: .9rem; font-weight: 600; }
.doc .u { font-family: var(--mono); font-size: .74rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc .x { margin-left: auto; color: var(--ink-3); font-size: .85rem; flex: none; }

/* ---------------- Pills ---------------- */

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .82rem; border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 5px 11px; color: var(--ink-2);
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.pill:hover, .pill:focus-visible { border-color: var(--garnet); color: var(--garnet); }

/* ---------------- Buttons ---------------- */

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .875rem; font-weight: 650;
  border: 1px solid var(--rule-2); border-radius: var(--r-s);
  padding: 9px 16px; color: var(--ink);
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease), color var(--t) var(--ease);
}

          <li><b>For a single prompt:</b> prefix the prompt with <code>/plan</code>.</li>
          <li><b>From the CLI:</b> <code>claude --permission-mode plan</code>.</li>
          <li><b>Project default:</b> <code>permissions.defaultMode: "plan"</code> in <code>.claude/settings.json</code>. For sessions started by the VS Code extension this setting does not determine the starting mode — set <code>claudeCode.initialPermissionMode</code> to <code>plan</code> in VS Code user settings instead.</li>
          <li><b>Edit the plan:</b> <code>Ctrl+G</code> opens the plan in your default editor so you can change it before Claude proceeds.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/permission-modes#analyze-before-you-edit-with-plan-mode" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Analyze before you edit with plan mode" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "route", h: "When to use what — the routing table", html: `
        <p>Three mechanisms are on the table, and they answer <b>different questions</b>. Getting this straight is what the task statement actually tests:</p>
        <table>
          <thead><tr><th>Mechanism</th><th>What it controls</th><th>What it costs</th></tr></thead>
          <tbody>
            <tr><td><b>Direct execution</b></td><td>Nothing — Claude edits as it goes</td><td>No review gate before the diff exists</td></tr>
            <tr><td><b>Plan mode</b></td><td><b>Permission</b>: edits are blocked until a human approves the plan</td><td>Overhead — an extra round trip before any work happens</td></tr>
            <tr><td><b>Explore subagent</b></td><td><b>Context</b>: verbose discovery happens in a separate context window; only the summary returns</td><td>Latency — it starts fresh and must gather context itself</td></tr>
          </tbody>
        </table>
        <p>So plan mode and Explore are <b>not rivals</b>. One is a gate on writing, the other is a container for reading. A single task can use both, one of them, or neither.</p>
        <table>
          <thead><tr><th>What you are facing</th><th>Route</th></tr></thead>
          <tbody>
            <tr><td>You can describe the diff in one sentence; a stack trace already names the line; one file</td><td><b>Direct execution</b></td></tr>
            <tr><td>Adding a single validation check to one function — a date-validation conditional, a null guard</td><td><b>Direct execution</b></td></tr>
            <tr><td><b>Multiple valid approaches</b>, an architectural decision, or a large-scale multi-file change</td><td><b>Plan mode</b></td></tr>
            <tr><td>Restructuring into microservices; a library migration hitting <b>45+ files</b>; choosing between integration approaches with <b>different infrastructure requirements</b></td><td><b>Plan mode</b></td></tr>
            <tr><td>Answering the question would read hundreds of files, a full test-suite run, or log files — output you will never reference again</td><td><b>Explore subagent</b> (inside whichever mode you are in)</td></tr>
            <tr><td>A big migration: the approach is unsettled <b>and</b> the edit count is high</td><td><b>Plan mode, then exit to direct execution</b></td></tr>
          </tbody>
        </table>
        <p>Four questions, asked in order, decide it every time:</p>
        <ol>
          <li><b>Can I describe the diff in one sentence?</b> Yes → direct execution. Stop here; everything below is overhead.</li>
          <li><b>Is there more than one defensible approach, or an architectural consequence?</b> Yes → plan mode. This is the "preventing costly rework" case: the wrong approach is discovered <b>before</b> 45 files are touched, not after.</li>
          <li><b>Would finding out flood the main context?</b> Yes → Explore subagent. This is judged on the <b>volume of discovery output</b>, not on the size of the change.</li>
          <li><b>Is the plan approved?</b> Yes → <b>leave</b> plan mode and implement. Plan mode is a phase, not a setting you live in.</li>
        </ol>
        <p class="srcline"><a href="https://code.claude.com/docs/en/sub-agents#choose-between-subagents-and-main-conversation" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Choose between subagents and main conversation" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "explore", h: "The Explore subagent — the context route", html: `
        <p>Explore is a <b>built-in</b> subagent; you do not have to define it. Claude delegates to it when it needs to search or understand a codebase without changing it, so the search results stay out of your main conversation.</p>
        <ul>
          <li><b>Read-only</b> — <code>Write</code> and <code>Edit</code> are denied. It cannot make the change it discovers.</li>
          <li><b>Thoroughness is a dial</b>: Claude invokes it at <code>quick</code> (targeted lookup), <code>medium</code> (balanced), or <code>very thorough</code> (comprehensive). Ask for the level you actually need.</li>
          <li><b>Model</b>: as of v2.1.198 it inherits the main conversation's model rather than always running on Haiku; on the Claude API that inheritance is capped at Opus. Define your own subagent named <code>Explore</code> with <code>model: haiku</code> to force exploration back onto a cheap model.</li>
          <li>Explore and the <b>Plan</b> subagent both skip your CLAUDE.md files and the parent session's git status, to keep research fast and cheap. Every other subagent loads both.</li>
          <li>You are already using a subagent in plan mode without asking: when Claude needs to understand the codebase while planning, it delegates research to the built-in <b>Plan</b> subagent, so exploration output lands in a separate context window.</li>
          <li>Invoke it in words — <i>"use subagents to investigate X"</i>. The canonical isolation case in the docs is verbose output: <i>"Use a subagent to run the test suite and report only the failing tests with their error messages."</i></li>
          <li><b>The counter-warning matters as much as the rule.</b> Results return to the main conversation; many subagents each returning detailed findings consume significant context themselves. Isolation is not free, and a subagent spawned for discovery you did not need is a pure loss.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/sub-agents#built-in-subagents" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Built-in subagents" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "combined", h: "Combining the two — plan to investigate, direct to implement", html: `
        <p>The blueprint lists the combination as a skill in its own right, and it is the shape of every realistic large task: <b>plan mode for investigation, direct execution for implementation.</b></p>
        <ol>
          <li><b>Explore</b> — enter plan mode (<code>Shift+Tab</code> until the status bar reads <code>⏸ plan mode on</code>, or start with <code>claude --permission-mode plan</code>). Claude reads and answers without changing anything. Wide discovery here goes to a subagent.</li>
          <li><b>Plan</b> — ask for the implementation plan. <code>Ctrl+G</code> opens it in your editor so you can correct it before a single file is touched.</li>
          <li><b>Implement</b> — approve the plan or press <code>Shift+Tab</code>, which <b>exits</b> plan mode, then let Claude code against the plan.</li>
          <li><b>Commit</b> — a descriptive message and a PR.</li>
        </ol>
        <p>Two symmetric failures sit on either side of this flow:</p>
        <ul>
          <li><b>Never entering</b> — direct execution on a 45-file migration forfeits the review gate; the wrong approach surfaces after the rework is already paid for.</li>
          <li><b>Never leaving</b> — staying in plan mode through the implementation means edits stay blocked and nothing ships. Approval is the exit, not a checkpoint.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/best-practices#explore-first-then-plan-then-code" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Explore first, then plan, then code" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "threshold", h: "The decision threshold — the heart of the exam item", html: `
        <p>The official rule fits in one sentence: <b>if you can describe the diff in a single sentence, skip the plan.</b></p>
        <table>
          <thead><tr><th>Execute directly</th><th>Use plan mode</th></tr></thead>
          <tbody>
            <tr><td>Scope is clear <b>and</b> the fix is small</td><td>You are unsure about the approach</td></tr>
            <tr><td>Typo, added log line, variable rename</td><td>The change touches <b>multiple files</b></td></tr>
            <tr><td>A stack trace already points at the target</td><td>You are <b>unfamiliar</b> with the code being changed</td></tr>
          </tbody>
        </table>
        <ul>
          <li>The documentation warns explicitly: <b>plan mode is useful but adds overhead</b>. For small, well-scoped work, just ask directly.</li>
          <li>The reverse mistake is equally wrong: direct execution on a broad migration loses the <b>review gate and the architectural planning</b>.</li>
          <li>The recommended flow has four phases: <b>Explore → Plan → Code → Commit</b>. Discovery and planning are separated from implementation so you do not solve the wrong problem.</li>
        </ul>` },
      { id: "thinking", h: "Plan mode ≠ extended thinking", html: `
        <ul>
          <li><b>Plan mode is workflow control.</b> It is a permission mode; it gates the transition from "thinking" to "doing" behind human approval.</li>
          <li><b>Extended / adaptive thinking is reasoning depth.</b> It scales how much the model reasons within a single request.</li>
          <li>They compose, but they solve different problems. If the agent <b>edits without discussing</b> → plan mode. If the analysis is <b>shallow</b> → thinking.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §10 "Plan Mode vs Extended Thinking" (repo root, lines 1278-1284) — consistent with the official docs' definition of permission modes. There is no separate documentation page for this distinction.</p>` },
      { id: "blueprint", h: "Blueprint coverage — Task Statement 3.4, bullet by bullet", html: `
        <p>The exam guide states 3.4 as four Knowledge bullets and four Skills bullets. Every one maps to a section above:</p>
        <table>
          <thead><tr><th>Blueprint bullet</th><th>Route it points at</th><th>Where</th></tr></thead>
          <tbody>
            <tr><td>Plan mode for large-scale changes, multiple valid approaches, architectural decisions, multi-file modifications</td><td>Plan mode</td><td>Routing table, rows 3–4</td></tr>
            <tr><td>Direct execution for simple, well-scoped changes (one validation check in one function)</td><td>Direct execution</td><td>Routing table, rows 1–2</td></tr>
            <tr><td>Plan mode enables safe exploration and design before committing to changes, <b>preventing costly rework</b></td><td>Plan mode</td><td>Question 2 of the four questions</td></tr>
            <tr><td>The Explore subagent isolates verbose discovery output and returns summaries, preserving main conversation context</td><td>Explore subagent</td><td>"The Explore subagent"</td></tr>
            <tr><td>Microservice restructuring · library migration affecting 45+ files · choosing between integration approaches with different infrastructure requirements</td><td>Plan mode</td><td>Routing table, row 4</td></tr>
            <tr><td>Single-file bug fix with a clear stack trace · adding a date-validation conditional</td><td>Direct execution</td><td>Routing table, rows 1–2</td></tr>
            <tr><td>Explore subagent for verbose discovery phases, to prevent <b>context window exhaustion during multi-phase tasks</b></td><td>Explore subagent</td><td>Question 3 of the four questions</td></tr>
            <tr><td>Plan mode for investigation combined with direct execution for implementation (plan a library migration, then execute it)</td><td>Both, in sequence</td><td>"Combining the two"</td></tr>
          </tbody>
        </table>
        <p class="quiet small">Two things the exam guide phrases more sharply than the docs do, worth keeping in its wording: <b>"preventing costly rework"</b> as the reason for plan mode, and <b>"context window exhaustion during multi-phase tasks"</b> as the reason for Explore. The docs describe the same mechanisms without naming those two failure modes.</p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p. 14, Task Statement 3.4 (repo root). The exam guide is the authority on <i>what is tested</i>; the product behavior above is taken from the current documentation.</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li><b>Swapping the logging library across 60+ files</b> (usage audit + library choice + staged migration) → <b>start in plan mode</b>, then exit to implement. Multiple files plus an unsettled approach sits right above the threshold; the answer that keeps you in plan mode for the edits is wrong for the opposite reason.</li>
          <li><b>Null-input bug in one function, stack trace points at the line</b> → <b>direct execution</b>. Adding an Explore subagent to check whether "other functions have the same bug" widens the requested scope; the documentation says ask directly here.</li>
          <li>Those two items pin down the Explore rule: the subagent is justified by <b>how much output the discovery produces</b>, never by how important the change feels. Wide reading → Explore. A named file and a named line → nothing.</li>
          <li>"Architectural implications" is the strongest plan-mode signal in an answer stem — <b>infrastructure requirements differing between options</b> is the same signal in disguise, because the choice is not reversible with an edit.</li>
          <li>In the answer options, <code>Shift+Tab</code>, <code>/plan</code>, <code>--permission-mode plan</code>, and <code>permissions.defaultMode</code> are <b>all valid</b> entry paths — none of them is eliminated for being "wrong syntax".</li>
        </ul>` },
    ],
  },
  {
    id: "simplest-first", title: "Simplest Solution First — The Over-Orchestration Trap", topic: "agent", domain: 1, tasks: [], concept: "simplicity", icon: "◈",
    summary: "When two options both do the job, the one with fewer moving parts wins. Verified against Anthropic's own engineering post (12 Aug 2026).",
    source: ["Anthropic Engineering — Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents"],
    sections: [
      { id: "principle", h: "The principle, in the official wording", html: `
        <ul>
          <li>Anthropic's advice: <i>"finding the simplest solution possible, and only increasing complexity when needed"</i>.</li>
          <li>Complexity is not free: agentic systems trade <b>latency and cost</b> for better task performance, and you are expected to judge when that trade-off makes sense.</li>
          <li>Add complexity only when it <b>demonstrably improves outcomes</b>.</li>
          <li>For many applications, optimizing a single LLM call with retrieval and in-context examples is enough; multi-step agentic systems come in <b>only when simpler solutions fall short</b>.</li>
        </ul>` },
      { id: "pattern", h: "Your recurring failure pattern", html: `
        <p>Four of your Set 1 mistakes share one shape: <b>you picked the heavier machinery.</b></p>
        <table>
          <thead><tr><th>Question</th><th>The heavy path you chose</th><th>The light path that was correct</th></tr></thead>
          <tbody>
            <tr><td>Q5</td><td>Write a custom MCP server for every integration</td><td>Existing community server for Jira; custom only for the proprietary workflow</td></tr>
            <tr><td>Q14</td><td>Have the model emit its own confidence score and route on it</td><td>Deterministic routing based on the file path</td></tr>
            <tr><td>Q46</td><td>Extract citations from narrative text with regex</td><td>Have the producing agent return structured output in the first place</td></tr>
            <tr><td>Q57</td><td>Direct execution plus an Explore subagent</td><td>Direct execution alone</td></tr>
          </tbody>
        </table>` },
      { id: "test", h: "Elimination test — apply it to an option in 20 seconds", html: `
        <ol>
          <li><b>Which concrete failure does this mechanism prevent?</b> If you cannot name the failure, the option is decoration — eliminate it.</li>
          <li><b>Can it be solved one layer lower?</b> An option that solves at a higher layer (hook, post-processing, extra agent) what could be solved in the source, the schema, or the tool contract is wrong.</li>
          <li><b>Is a guarantee required?</b> If yes, it must be code / hook / permission rule; the model's self-reported confidence is not a guarantee.</li>
          <li><b>What does the extra agent or handoff cost?</b> Every boundary adds context loss and latency. No named benefit, no new boundary.</li>
        </ol>` },
      { id: "exceptions", h: "Where complexity is justified", html: `
        <p>Simplicity does not mean "do everything in one pass". Extra structure is the <b>correct</b> answer in these four cases:</p>
        <ul>
          <li><b>Broad, multi-file migration</b> → plan mode (it buys a review gate). See the <a class="pill" href="#/note/plan-mode">Plan Mode note</a>.</li>
          <li><b>Wide discovery that would flood the main context</b> → a subagent; the exploration stays in a separate context window and only the findings come back.</li>
          <li><b>Unbiased review</b> → fresh context / separate session / review subagent. This is not about simplicity but <b>correctness</b>: the session that produced the work carries its own rationale and will not question its own decision.</li>
          <li><b>Large partitionable work</b> (auditing 50 tickets) → a per-item pass followed by a separate synthesis pass. Both a single giant prompt and sampling-then-generalizing are wrong.</li>
        </ul>
        <p class="small quiet">Note: the documentation also warns about review subagents — a reviewer primed to look for gaps will report gaps even when the work is sound; ask it to report only gaps that affect correctness or a stated requirement.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/best-practices#add-an-adversarial-review-step" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Add an adversarial review step" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
    ],
  },
  {
    id: "chain-vs-adaptive", title: "Prompt Chaining vs Dynamic Adaptive Decomposition", topic: "agent", domain: 1, tasks: ["1.6"], concept: "simplicity", icon: "◈",
    summary: "Can you write the step list before seeing the data? One question separates the two patterns. Verified against Anthropic's engineering post (16 Aug 2026); the term \"dynamic decomposition\" appears only in the exam material — see section 2. Exam objective: Task Statement 1.6.",
    source: ["Anthropic Engineering — Building effective agents, \"Workflow: Prompt chaining\"", "https://www.anthropic.com/engineering/building-effective-agents#workflow-prompt-chaining"],
    related: [
      { id: "e5q29", why: "Auditing 50 tickets: heterogeneous but <b>mechanical</b> work. Not adaptive investigation — a per-item pass plus a separate synthesis pass. The steps could be written without looking at the data." },
      { id: "e5q45", why: "In an adaptive flow the coordinator decides at each step but <b>does not hand off context</b>. If the findings the next step needs are not placed in the prompt by hand, the pattern collapses." },
      { id: "e1q62", why: "Three independent searches are neither a chain nor an investigation; they are parallel tool use in a single turn. A classic case of misreading the \"shape\"." },
      { id: "e5q57", why: "Layering discovery on top of fixed, one-sentence work is dressing chainable work up as adaptive investigation." },
      { id: "e5q14", why: "Finding triage: bind the output of an adaptive flow to a <b>deterministic</b> gate. If the model produces its own confidence score, the adaptivity goes unchecked." },
    ],
    sections: [
      { id: "definitions", h: "The two patterns, as officially defined", html: `
        <ul>
          <li><b>Prompt chaining</b> — decomposes a task into a <b>fixed</b> sequence of steps, where each LLM call processes the output of the previous one. You can add programmatic <b>gates</b> on intermediate steps to ensure the process is still on track.</li>
          <li>Its purpose is stated as an explicit trade-off: <b>trade latency for higher accuracy</b> by making each LLM call an easier task. Fit condition: the task can be "easily and cleanly decomposed into <b>fixed</b> subtasks".</li>
          <li><b>Dynamic adaptive decomposition</b> — the next step only becomes clear after the current finding. The closest official counterparts are <b>orchestrator-workers</b> (<i>"subtasks aren't pre-defined, but determined by the orchestrator based on the specific input"</i>) and <b>autonomous agents</b> (open-ended problems where "it's difficult or impossible to predict the required number of steps, and where you can't <b>hardcode a fixed path</b>").</li>
          <li>The cost is official too: autonomous operation means <b>higher costs and the potential for compounding errors</b>; the guidance recommends sandboxed testing and guardrails.</li>
        </ul>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/building-effective-agents#workflow-prompt-chaining" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Workflow: Prompt chaining" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "terminology", h: "Terminology warning — \"dynamic decomposition\" is not an official pattern name", html: `
        <p>The only real trap when memorizing this distinction is the vocabulary:</p>
        <ul>
          <li><b>Anthropic's post</b> lists these patterns: prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer, plus agents. <b>There is no heading called "dynamic decomposition".</b></li>
          <li><b>The exam material</b> does use it: the task statement reads <i>"When to use fixed sequential pipelines (prompt chaining) versus dynamic adaptive decomposition based on intermediate findings"</i>, and the study guide lists "Dynamic decomposition — investigation where each discovery changes the plan" as its own row. In scope it sits between orchestrator-workers and an autonomous agent.</li>
          <li>Practical consequence: <b>whatever name appears in the option, read the shape.</b> An option saying "the steps change based on findings" describes the same pattern whether it is labelled dynamic decomposition, orchestrator-workers, or an agent loop.</li>
        </ul>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.8, Task Statement 1.6, "Knowledge of" bullets 1 and 3; and <code>exam-preparation-guide.md</code> §8 (repo root, pattern table lines 1019-1025, adaptive paragraph line 1039, summary lines 1915-1918). This <b>does not contradict</b> the official post — it uses a <i>name</i> the post does not; a vocabulary difference, not a conflict.</p>` },
      { id: "decision", h: "Decision rule — one question", html: `
        <p>Before you look at the options, ask the scenario: <b>can I write the step list without seeing the data?</b></p>
        <table>
          <thead><tr><th>Prompt chaining</th><th>Adaptive decomposition</th></tr></thead>
          <tbody>
            <tr><td>Steps are known <b>in advance</b> and identical every run</td><td>The next step depends on <b>the previous finding</b></td></tr>
            <tr><td>Step count is fixed and budgetable</td><td>Step count is unpredictable — needs a cap</td></tr>
            <tr><td>Intermediate output can be <b>gated</b> (schema/threshold check)</td><td>Intermediate output sets the <b>direction</b>, not the target</td></tr>
            <tr><td>The work is <b>mechanical</b> and well-defined</td><td>The work is <b>investigation</b> — goal known, path unknown</td></tr>
            <tr><td>Misapplied: no wasted tool calls, but shallow analysis</td><td>Misapplied: coordinator effort is wasted, output becomes inconsistent</td></tr>
          </tbody>
        </table>
        <p>A third answer is always on the table: if the work is <b>partitionable and uniform</b>, neither chaining nor investigation is right — <b>partition-then-parallel</b> (parallel subagents plus a synthesis pass) is.</p>` },
      { id: "examples", h: "Use cases, side by side", html: `
        <table>
          <thead><tr><th>Scenario</th><th>Pattern</th><th>Why</th></tr></thead>
          <tbody>
            <tr><td>Generate marketing copy, then translate it</td><td>Chaining</td><td>Two fixed steps; the second processes the first's output <span class="quiet">(official example)</span></td></tr>
            <tr><td>Write an outline → check it meets criteria → write the document</td><td>Chaining</td><td>The middle step is a textbook <b>gate</b> <span class="quiet">(official example)</span></td></tr>
            <tr><td>Fixed three-stage review: style → security → documentation</td><td>Chaining</td><td>The stages are the same on every PR</td></tr>
            <tr><td>Billing dispute: verify identity → fetch invoice → check policy → propose adjustment</td><td>Chaining</td><td>The flow runs in the <b>same order every time</b></td></tr>
            <tr><td>Debugging an intermittent backend failure</td><td>Adaptive</td><td>Logs, config, or local repro — the first finding decides</td></tr>
            <tr><td>Security incident triage: examine alert → pull logs / query SIEM / page on-call</td><td>Adaptive</td><td>The branch depends on what the alert contains</td></tr>
            <tr><td>Root-causing an unusual customer error report · narrowing a flaky test</td><td>Adaptive</td><td>A pre-written checklist misses the actual cause</td></tr>
            <tr><td>A code change where the number of files affected is unknown upfront</td><td>Adaptive <span class="quiet">(orchestrator-workers)</span></td><td>Subtasks are determined by the orchestrator from the input <span class="quiet">(official example)</span></td></tr>
            <tr><td>Multi-source search where which source to open depends on findings</td><td>Adaptive</td><td>The official post gives this as an orchestrator-workers example</td></tr>
            <tr><td>Auditing 40 contracts against the same 12 clauses</td><td><b>Neither</b> — partition-then-parallel</td><td>Independent and uniform work; adaptivity is pure coordination overhead</td></tr>
          </tbody>
        </table>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/building-effective-agents#workflow-orchestrator-workers" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Workflow: Orchestrator-workers" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "cost", h: "The cost of a mismatch, in both directions", html: `
        <ul>
          <li><b>Chaining forced onto investigation:</b> coordinator effort is wasted and the analysis stays <b>shallow</b> — fixed steps never ask about the actual cause, they just run the list end to end.</li>
          <li><b>Adaptivity forced onto fixed work:</b> you get unnecessary tool calls and <b>inconsistent output</b>; every run takes a different path, so results are not comparable.</li>
          <li><b>The control for adaptive flows:</b> because the plan is unpredictable it is hard to budget — set explicit <b>termination criteria</b> and a <b>step cap</b>. This mirrors what the official post says about autonomous agents: stopping conditions such as a maximum number of iterations maintain control.</li>
          <li><b>The control for chains:</b> put programmatic gates on intermediate steps. Without a gate, a chain carries a bad intermediate output all the way to the end.</li>
          <li>In either pattern, if you use subagents: <b>context is not inherited.</b> Every finding the next step needs must be written into the prompt explicitly — see <a class="pill" href="#/q/e5q45">E5·Q45</a>.</li>
        </ul>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/building-effective-agents#agents" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Agents" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "perfile", h: "The canonical chained code review: per-file pass plus a cross-file pass", html: `
        <p>The exam material's concrete example of prompt chaining is a single pattern: <b>analyze each file individually, then run a separate cross-file integration pass.</b> The stated reason is <b>attention dilution</b> — one pass that reviews 30 files in a single prompt reviews none of them deeply.</p>
        <ul>
          <li><b>Phase 1 — local analysis:</b> one call or subagent per file. Each looks only at its own file: null checks, error handling, boundary conditions. This phase <b>parallelizes</b>, because the files do not wait on each other.</li>
          <li><b>Phase 2 — cross-file pass:</b> a single call that takes all local findings and asks only the <b>between-files</b> questions: does a changed signature break callers, do two files update shared state inconsistently, has a contract drifted.</li>
          <li>Phase 2's input is not raw file content but the <b>structured output</b> of phase 1. Re-shipping the raw content eats the chain's cost advantage.</li>
          <li>This is a <b>chain</b>, not an adaptive flow: the step list can be written without looking at the PR. Which files change varies; which steps run does not.</li>
          <li>The official Claude Code documentation shows the same pattern as a dynamic-workflow example: <i>"review every file changed in this PR ... then merge the per-file findings into one ranked summary"</i> — one reviewer per file, then one agent that ranks and deduplicates the findings.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/workflows#review-every-changed-file-and-write-one-summary" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "Review every changed file and write one summary" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>If the scenario says <b>"every time", "standard flow", "the same order"</b> → chaining. If it says <b>"depending on what it finds", "based on the findings", "the number of steps is not known"</b> → adaptive.</li>
          <li>When you see <b>uniform + independent + many items</b>, discard both patterns: the answer is partition-then-parallel. Scenario 8 in the study guide tests exactly this — the option "let the coordinator decide what to examine after each contract" is wrong because it loads investigation overhead onto mechanical work.</li>
          <li>An option like "one fixed stage per clause, each stage processing all 40 contracts" is <b>chaining misapplied</b>: it re-reads the same documents 12 times and splits a single judgment across stages.</li>
          <li>Once you pick the adaptive pattern, <b>a second question follows</b>: how does the coordinator pass findings to the subagent? The answer is always "the complete findings, inside the prompt".</li>
          <li>Read pattern selection together with the <a class="pill" href="#/note/simplest-first">Simplest Solution First</a> note: if both patterns do the job, the one with <b>fewer moving parts</b> — the chain — wins.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §8, lines 1035-1039 (two-way cost) and lines 2113-2120 + 2201 (Scenario 8 and its solution).</p>` },
    ],
  },
  {
    id: "hook-vs-prompt", title: "Deterministic Enforcement vs Probabilistic Compliance", topic: "agent", domain: 1, tasks: ["1.4", "1.5"], concept: "determinism", icon: "◈",
    summary: "Hooks and prerequisite gates give guarantees; prompt instructions shift probabilities. Verified against the official Claude Code and Agent SDK hook documentation (16 Aug 2026). Critical nuance: not every hook is deterministic. Exam objectives: Task Statements 1.4 and 1.5.",
    source: ["Claude Code Docs — Hooks reference, \"PreToolUse\"", "https://code.claude.com/docs/en/hooks#pretooluse"],
    sections: [
      { id: "distinction", h: "The distinction — guarantee or tendency", html: `
        <p>The exam measures this in two separate task statements (1.4 and 1.5), and both rest on one sentence: <b>when deterministic compliance is required, prompt instructions alone have a non-zero failure rate.</b></p>
        <table>
          <thead><tr><th></th><th>Programmatic enforcement</th><th>Prompt-based guidance</th></tr></thead>
          <tbody>
            <tr><td>Where it lives</td><td>Hooks, permission rules, the tool's server-side code</td><td>System prompt, CLAUDE.md, <code>.claude/rules/</code>, skill text</td></tr>
            <tr><td>What it gives</td><td><b>A guarantee</b> — a code path, independent of the model's decision</td><td><b>A tendency</b> — it raises the probability of compliance</td></tr>
            <tr><td>Failure mode</td><td>A badly written rule (testable, reproducible)</td><td>Attention decays over long context; prompt injection bends it</td></tr>
            <tr><td>When it is right</td><td>The rule must hold <b>100%</b> of the time: identity verification, monetary thresholds, destructive commands</td><td>Behavior that requires judgment and varies with context: tone, priorities, exploration strategy</td></tr>
          </tbody>
        </table>
        <p>Rule of thumb: <b>if violating a behavior costs money, data, or security, do not leave it in the prompt layer.</b> A prompt changes what the model <i>wants</i> to do; a hook changes what it <i>can</i> do.</p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.7 — Task Statement 1.4 "Knowledge of" bullets 1-2 and Task Statement 1.5 "Knowledge of" bullet 3. This is the exam's own phrasing; the product documentation does not state it in these words.</p>` },
      { id: "mechanics", h: "Hook mechanics — how blocking actually happens", html: `
        <ul>
          <li><b>PreToolUse</b> fires <b>before</b> a tool call executes and <b>can block it</b>. The decision field is <code>hookSpecificOutput.permissionDecision</code>: <code>"allow"</code>, <code>"deny"</code>, <code>"ask"</code>, <code>"defer"</code>. Returning an empty object (<code>{}</code>) means "no decision" and the normal permission flow applies.</li>
          <li><b>Precedence is explicit:</b> <code>deny</code> &gt; <code>defer</code> &gt; <code>ask</code> &gt; <code>allow</code>. If any hook returns <code>deny</code>, the operation is blocked regardless of the other hooks.</li>
          <li><b>Exit code 2 is a blocking error.</b> On events that can block, exit 2 blocks whether or not you print JSON — even a JSON <code>permissionDecision</code> of <code>"allow"</code> cannot override it. The documentation states it plainly: exit 2's block is the one outcome JSON cannot override.</li>
          <li><b>PostToolUse</b> intercepts the result <b>before the model processes it</b>: <code>additionalContext</code> appends information to the tool result, and <code>updatedToolOutput</code> replaces the output itself. This is where heterogeneous data normalization belongs (Unix timestamps, ISO 8601, numeric status codes) — instead of telling the model to normalize, you normalize what reaches the model.</li>
          <li>In the Agent SDK, hooks are <b>callback functions</b> passed in <code>options.hooks</code>; Claude Code additionally supports shell command, HTTP, MCP tool, prompt, and agent hook types. Same mechanism, different carrier.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/hooks#exit-code-2" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Hooks reference, "Exit code 2" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "gate", h: "Prerequisite gates — enforce ordering in code, not in the prompt", html: `
        <p>"Verify identity before processing a refund" is an <b>ordering</b> rule, and ordering rules leak when they live in the prompt. The programmatic equivalent: <b>block the downstream tool call until the prerequisite step has completed.</b></p>
        <ul>
          <li>Implementation: a <b>PreToolUse</b> hook on <code>process_refund</code> checks session state for evidence that <code>get_customer</code> returned a verified customer ID. If it is missing, it returns <code>deny</code> plus a reason; the model reads the reason and follows the correct order.</li>
          <li>The second application of the same idea is a <b>policy gate</b>: block an operation that exceeds a threshold (for example a refund above $500) and <b>redirect to an alternative workflow</b> (human escalation). The block message is the only ground truth the model sees, so the reason must carry the "what to do instead" information.</li>
          <li>The threshold must be held <b>server-side</b>. If the tool interface exposes something like an <code>approved: true</code> parameter to the model, you have handed the model the gate — and there is no gate.</li>
          <li>Typical wrong options: enforcing the order with prompt text only (injection-vulnerable), detecting violations after the fact (it runs after the money has left), or adding few-shot examples (that shifts probabilities, and policy compliance must be deterministic).</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/hooks#pretooluse" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Hooks reference, "PreToolUse" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "nuance", h: "Critical nuance — not every hook is deterministic", html: `
        <p>"Hook equals deterministic" is not quite what the documentation says. Claude Code runs two hook types <b>through a model</b>:</p>
        <ul>
          <li><b><code>type: "prompt"</code></b> — the hook input and your prompt are sent to a Claude model (Haiku by default), which returns a structured JSON decision. The decision itself is <b>probabilistic</b>.</li>
          <li><b><code>type: "agent"</code></b> — spawns an agentic verifier with tool access. More capable, equally probabilistic.</li>
          <li><b>The deterministic ones:</b> <code>command</code>, <code>http</code>, <code>mcp_tool</code> — and the Agent SDK's callback functions. In a scenario that demands a guarantee, these are the right answer.</li>
        </ul>
        <p>On the exam, "use a hook" is not a complete answer; <b>which hook type</b> carries the distinction. Wiring a monetary threshold to a prompt hook puts enforcement back in the prompt layer, only more expensively.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/hooks#prompt-based-hooks" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Hooks reference, "Prompt-based hooks" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "selection", h: "Four mechanisms — which one for which job", html: `
        <table>
          <thead><tr><th>Mechanism</th><th>When it loads</th><th>What it does</th><th>Use for</th></tr></thead>
          <tbody>
            <tr><td><code>CLAUDE.md</code></td><td>Every session</td><td>Soft guidance (context)</td><td>Project facts needed in every session</td></tr>
            <tr><td><code>.claude/rules/</code></td><td>Every session, or only when matching paths are read</td><td>Soft guidance (context)</td><td>Topic- or area-specific instructions, scoped with <code>paths:</code></td></tr>
            <tr><td>Skills</td><td>On demand</td><td>Structured procedure — still soft</td><td>Multi-step workflows invoked intentionally</td></tr>
            <tr><td>Hooks</td><td>Lifecycle events</td><td><b>Hard enforcement</b></td><td>Allow/deny rules, mandatory approvals, formatters</td></tr>
          </tbody>
        </table>
        <p>The discriminating question is one line: <b>must this run whether or not the model decides to?</b> If yes, it is a hook. If no, it is context.</p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §10 "CLAUDE.md vs rules vs skills vs hooks" (repo root, lines 1387-1397). Consistent with the official docs; no single documentation page compares all four in one table.</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>If the scenario says <b>"guaranteed", "always", "never", "compliance", "auditable"</b> → programmatic enforcement. <b>"prefer", "usually", "encourage"</b> → prompt layer.</li>
          <li>"Strengthen the wording in the system prompt" / "add few-shot examples" / "repeat the rule in capitals" are <b>all wrong</b> when the requirement is deterministic — they all play in the same probabilistic layer.</li>
          <li>"Detect it afterwards and log it" is not enforcement but <b>observation</b>; the violation has already happened.</li>
          <li>Data format mismatch (different MCP tools return different time formats) → the fix is not telling the model to normalize, it is <b>PostToolUse</b> normalizing before the data reaches the model.</li>
          <li>After choosing a hook, the next question is <b>which event</b>: blocking is <b>PreToolUse</b>, result transformation is <b>PostToolUse</b>. Confusing these two is the most commonly lost point here.</li>
        </ul>` },
    ],
  },
  {
    id: "coordinator-prompt", title: "Coordinator Prompts — Goals and Quality Criteria, Not Procedures", topic: "agent", domain: 1, tasks: ["1.2", "1.3"], concept: "delegation", icon: "◈",
    summary: "Subagents adapt only when the coordinator specifies research goals and quality criteria instead of step-by-step procedural instructions. But \"goal-oriented\" is not \"vague\" — Anthropic's multi-agent research post draws that line (16 Aug 2026). Exam objectives: Task Statements 1.2 and 1.3.",
    source: ["Anthropic Engineering — How we built our multi-agent research system", "https://www.anthropic.com/engineering/multi-agent-research-system#prompt-engineering-and-evaluations-for-research-agents"],
    sections: [
      { id: "principle", h: "The principle and its rationale", html: `
        <ul>
          <li>Exam wording: design coordinator prompts that specify <b>research goals and quality criteria</b> rather than step-by-step procedural instructions, <b>to enable subagent adaptability</b>.</li>
          <li>The rationale is built into the pattern: a subagent <b>evaluates intermediate results</b> and narrows its next query accordingly. A procedural lock ("run these three searches in this order") kills that loop; the agent runs the list regardless of what it found.</li>
          <li>The study guide states the same rule: <b>"Give goals and quality criteria, not brittle step-by-step search strings, when adaptability matters."</b> The word <i>brittle</i> matters — fixed search strings silently return nothing once the data moves.</li>
          <li>The official strategic framing: prompting strategy focuses on <b>instilling good heuristics rather than rigid rules</b>, and the best multi-agent prompts are "not just strict instructions, but <b>frameworks for collaboration</b> that define the division of labor, problem-solving approaches, and effort budgets".</li>
        </ul>` },
      { id: "boundary", h: "The boundary — \"goal-oriented\" does not mean vague", html: `
        <p>This is the easiest part of the objective to misread. The same official post also measured the concrete damage of <b>under-specified</b> delegation:</p>
        <ul>
          <li>Under "Teach the orchestrator how to delegate": each subagent needs <b>an objective, an output format, guidance on the tools and sources to use, and clear task boundaries</b>.</li>
          <li>Without detailed task descriptions, agents <b>duplicate work, leave gaps, or fail to find necessary information</b>.</li>
          <li>The reported example: when the lead agent was allowed to give short instructions like "research the semiconductor shortage", one subagent explored the 2021 automotive chip crisis while <b>two others duplicated work</b> on current 2025 supply chains — no effective division of labor.</li>
        </ul>
        <p>The correct reading has two layers: <b>the "how" is left open; the "what" and the "how good" are constrained.</b></p>
        <table>
          <thead><tr><th>Belongs in the prompt</th><th>Does not belong</th></tr></thead>
          <tbody>
            <tr><td>Objective: which question is being answered</td><td>Verbatim search strings</td></tr>
            <tr><td>Task boundary: which subtopic or source type is this agent's</td><td>A fixed tool call order</td></tr>
            <tr><td>Quality criteria: source quality, dates, flagging contradictions</td><td>A fixed number of rounds ("run exactly 3 searches")</td></tr>
            <tr><td>Output format: a structured result, field by field</td><td>Deciding in advance which result counts as correct</td></tr>
            <tr><td>Effort budget: an approximate tool-call range</td><td>Unbounded, open-ended exploration</td></tr>
          </tbody>
        </table>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/multi-agent-research-system#prompt-engineering-and-evaluations-for-research-agents" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Prompt engineering and evaluations for research agents" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "effort", h: "Effort budgets — the cost brake on adaptability", html: `
        <p>Agents struggle to judge appropriate effort on their own, so Anthropic <b>embedded scaling rules directly in the prompts</b>:</p>
        <ul>
          <li>Simple fact-finding → <b>1 agent, 3-10 tool calls</b>.</li>
          <li>Direct comparison → <b>2-4 subagents, 10-15 calls each</b>.</li>
          <li>Complex research → <b>more than 10 subagents</b> with clearly divided responsibilities.</li>
        </ul>
        <p>Without these rules, the observed failures were: spawning <b>50 subagents</b> for simple queries, scouring the web endlessly for nonexistent sources, and distracting each other with excessive updates. So "give goals, not procedures" has a <b>mandatory companion rule</b> — the effort budget. The two are written together.</p>
        <p>Search strategy follows the same shape — a heuristic, not a rule: <b>"start wide, then narrow down"</b>. Agents otherwise default to overly long, specific queries that return few results.</p>` },
      { id: "context", h: "To adapt, it first needs the context", html: `
        <ul>
          <li>A subagent's context window starts <b>fresh</b>. The only content passed from parent to subagent is the <b>Agent tool's prompt string</b>, so file paths, error messages, and prior decisions must be written into it directly.</li>
          <li>The subagent <b>does not receive</b>: the parent's conversation history, the parent's tool results, or the parent's system prompt. It <b>does receive</b>: its own system prompt (<code>AgentDefinition.prompt</code>), the Agent tool prompt, the project CLAUDE.md (via <code>settingSources</code>), and tool definitions.</li>
          <li>Consequence: writing a "goal-oriented prompt" does not mean withholding findings. You must pass the search results and document analyses to the synthesis subagent <b>in full</b>; otherwise it has nothing to adapt to.</li>
          <li>When attribution must survive, separate content from metadata (source URLs, document names, page numbers) using a <b>structured format</b>. A flat prose summary is the classic way to break the citation chain.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/agent-sdk/subagents#what-subagents-inherit" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Agent SDK Docs, "What subagents inherit" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "conflict", h: "Source conflict — Task tool or Agent tool?", html: `
        <ul>
          <li><b>Exam guide (PDF p.6, Task Statement 1.3):</b> the mechanism for spawning subagents is the <b>Task tool</b>, and the coordinator's <code>allowedTools</code> must include <b>"Task"</b>.</li>
          <li><b>Current official documentation:</b> Claude invokes subagents through the <b>Agent tool</b>; include <b><code>Agent</code></b> in <code>allowedTools</code> to auto-approve subagent invocations without a permission prompt.</li>
          <li><b>Resolution:</b> same behavior, <b>renamed surface</b>. If "Task" appears on the exam, that is the expected answer; the code you write in production needs <code>Agent</code>. The study guide hedges the same way: "typically named <code>Task</code> or <code>Agent</code>".</li>
          <li>The idea under test is name-independent: <b>the delegation mechanism is itself a tool.</b> If it is missing from the parent's allow list, the coordinator cannot launch anything even though the subagent definitions exist.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/agent-sdk/subagents#programmatic-definition-recommended" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Agent SDK Docs, "Programmatic definition" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>In options about coordinator prompts, any choice containing <b>verbatim search strings</b>, a <b>fixed tool order</b>, or a <b>fixed number of rounds</b> is wrong — it removes adaptability.</li>
          <li>But the <b>shortest</b> option is wrong too. A one-sentence handoff like "research the topic" produces duplicated work and coverage gaps. The correct option carries the goal <b>and</b> the boundary <b>and</b> the output shape.</li>
          <li>When partitioning scope, the criterion is <b>minimizing duplication</b>: a distinct subtopic or a distinct source type per agent.</li>
          <li>Parallel spawning means emitting <b>multiple Task/Agent tool calls in a single coordinator response</b>; splitting them across separate turns runs them serially.</li>
          <li>If synthesis finds gaps, the flow is not over: the coordinator re-delegates to the search and analysis subagents with <b>targeted queries</b> and re-invokes synthesis. "Strict one-pass research" is a standard wrong option.</li>
        </ul>` },
    ],
  },
  {
    id: "resume-stale", title: "Session Resumption — Changed Files and Stale Tool Results", topic: "ctx", domain: 1, tasks: ["1.7"], concept: "sessionstate", icon: "▤",
    summary: "A resumed session restores tool results too; if the file changed on disk, the agent does not know. Verified against the official Claude Code and Agent SDK session documentation (16 Aug 2026). Exam objective: Task Statement 1.7.",
    source: ["Claude Code Docs — Manage sessions, \"What a resumed session restores\"", "https://code.claude.com/docs/en/sessions#what-a-resumed-session-restores"],
    sections: [
      { id: "root-cause", h: "The root cause — sessions persist the conversation, not the filesystem", html: `
        <ul>
          <li>Official documentation: a resumed session restores the <b>full conversation history, including tool calls and results</b>.</li>
          <li>The Agent SDK adds the other half: <b>sessions persist the conversation, not the filesystem.</b> To snapshot and revert file changes you need file checkpointing instead.</li>
          <li>Put together, you get the dangerous case: a <code>Read</code> result in context is a snapshot of the file <b>at the moment it was read</b>. If you changed that file since, the agent still treats the old content as ground truth and reasons from it.</li>
          <li>Fork has the same limit: forking branches the <b>conversation history</b>, not the filesystem. If a forked agent edits files, those changes are real and visible to any session working in the same directory.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/agent-sdk/sessions#fork-to-explore-alternatives" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Agent SDK Docs, "Fork to explore alternatives" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "practice", h: "The correct behavior — inform the agent, then ask for targeted re-analysis", html: `
        <p>The reflex the exam expects: <b>when resuming a session after code modifications, inform the agent about changes to previously analyzed files.</b> In practice that is three steps:</p>
        <ul>
          <li><b>Name the files that changed.</b> "These changed: <code>auth/session.ts</code>, <code>api/refund.ts</code>" — a vague "some things changed" does nothing.</li>
          <li><b>Ask for a re-read.</b> The agent does not poll the disk on its own; the stale content in its context looks perfectly adequate to it.</li>
          <li><b>Bound the scope.</b> A full re-exploration (re-scanning the whole codebase) is unnecessary and expensive — the changed files and their dependents are enough. The exam states this as "informing a resumed session about specific file changes for <b>targeted re-analysis</b> rather than requiring full re-exploration".</li>
        </ul>
        <p>The same staleness affects hook-injected context: Claude Code saves the injected text in the session transcript, and when you resume with <code>--continue</code> or <code>--resume</code> it <b>replays the saved text</b> for mid-session events like <code>PostToolUse</code> or <code>UserPromptSubmit</code> rather than re-running the hook, so values like timestamps or commit SHAs become stale. <code>SessionStart</code> hooks <b>do run again</b> on resume with <code>source</code> set to <code>"resume"</code> (or <code>"fork"</code>), which makes that the place to refresh context.</p>
        <p class="srcline"><a href="https://code.claude.com/docs/en/hooks#add-context-for-claude" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, Hooks reference, "Add context for Claude" (relevant section) <span aria-hidden="true">↗</span></a></p>` },
      { id: "threshold", h: "Resume or start fresh — the threshold", html: `
        <table>
          <thead><tr><th>Resume (<code>--resume</code> / <code>resume</code>)</th><th>New session + structured summary</th></tr></thead>
          <tbody>
            <tr><td>Prior context is <b>mostly still valid</b></td><td>Prior tool results are <b>stale</b></td></tr>
            <tr><td>Files did not change, or the changes were reported</td><td>External state moved on (hours passed, records were updated)</td></tr>
            <tr><td>The reasoning chain must be preserved</td><td>History is long and largely irrelevant now</td></tr>
          </tbody>
        </table>
        <p>The study guide explains why "resume the old session and add an instruction to prefer the most recent tool results" is the wrong option: <b>the agent often references old tool results regardless of instructions</b>, especially when the older results are more detailed than the newer ones. Filtering <code>tool_result</code> messages out of the resumed history is also bad — earlier turns then reference data the model cannot see. Re-calling every previous tool at session start wastes calls on tools whose results may be irrelevant to the new question.</p>
        <p>A structured summary beats a prose summary: explicit fields (known IDs, completed steps, open gaps, a "fresh lookup required" flag) leave no ambiguity.</p>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §5 "Returning Users and Stale Data" (repo root, lines 737-757) and §8 "State Persistence" (lines 1096-1115). PDF counterpart: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.8, Task Statement 1.7 — "Why starting a new session with a structured summary is more reliable than resuming with stale tool results".</p>` },
      { id: "toolkit", h: "The toolkit — which flag does what", html: `
        <ul>
          <li><b>Named resumption:</b> <code>--resume &lt;session-name&gt;</code> continues a specific prior conversation. <code>--continue</code> instead finds the <b>most recent</b> session in the directory and needs no ID tracking.</li>

    summary: "Four places project instructions can live, separated by one question: when does the text enter the context window. Verified against the current Claude Code memory, skills, and tools documentation (16 Aug 2026); two divergences from the exam guide are recorded below. Exam objectives: Task Statements 3.1, 3.2 and 3.3.",
