        <p>The headline says 97.8%. The handwritten segment is wrong <b>more than one time in five</b>, and it contributes so little volume that no amount of staring at the aggregate will ever reveal it. Automating on the strength of "97.8% overall" automates a 22% error rate on a real segment of real documents.</p>
        <p><b>The same trap runs along the field axis</b>, and it is easy to forget because document type is the more obvious cut. Inside that same 97.8%, <code>amount_due</code> can sit at 99.4% while <code>payment_terms</code> sits at 74% — because terms are phrased in prose ("net 30 from receipt", "2/10 net 30") and the model normalizes them inconsistently. Segment by <b>type and field</b>, both.</p>
        <ul>
          <li><b>Break accuracy down by segment before raising any automation threshold.</b> The guide is explicit that lowering the threshold, or comparing candidate thresholds, <b>before</b> the segment-level analysis is premature.</li>
          <li><b>"Consistent performance across all segments" is the bar</b>, not "good average". One failing segment blocks automation for that segment, not for the pipeline — segment the routing too.</li>
          <li><b>Aggregate improvement can hide segment regression.</b> A change that lifts the common type by a point and drops a rare one by ten shows up as a win.</li>
          <li><b>Reviewer corrections are data, not noise.</b> Capture the correction category so recurring patterns surface; the guide's example is informal measurements ("a handful", "a splash") being invented or omitted in 23% of corrections.</li>
          <li><b>When a recurring failure mode shows up, the first fix is a few-shot example</b> demonstrating the correct handling — not fine-tuning, regex post-processing, or new schema fields. Those are heavier interventions for when focused prompt and schema changes fail to move the metric.</li>
          <li><b>Valid JSON is not correct data.</b> Schema compliance guarantees shape, never that the source supports the value. A constrained decoder cannot tell you the number it emitted is on the page.</li>
        </ul>
        <p class="srcline none">Source: <code>exam-preparation-guide.md</code> §5 "Validating Automation Plans" (repo root, lines 575-580), §11 "Evaluation Loops" (lines 1541-1554), §11 "Common Pitfalls" (line 1558), §5 "Common Pitfalls" (lines 606-610). Exam wording: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> pp.22-23, Task Statement 5.5, Knowledge bullets 1 and 4, Skills bullet 2.</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>Stem quotes an <b>aggregate accuracy number</b> and asks what to do before automating → break it down <b>by document type and field</b>. Any option that adjusts, compares, or lowers the threshold first is premature.</li>
          <li>"Route on the model's confidence score" is only correct when the option also says <b>calibrated against a labeled validation set</b>. Uncalibrated thresholds are the named pitfall.</li>
          <li>Confidence must be <b>per field</b>. A document-level score is a distractor.</li>
          <li>There are <b>two</b> routing triggers. If the stem mentions contradictory or ambiguous source documents, the answer is not "raise the confidence threshold" — confidence was never measuring that.</li>
          <li>After automation, the ongoing check is <b>stratified random sampling of high-confidence output</b>. "Wait for downstream complaints" and "sample only the low-confidence items" are both wrong; the second one is subtly wrong because it never tests the automated pile.</li>
          <li>"Detect novel error patterns" in a stem points at <b>sampling</b>, not at more validation rules — rules only catch anticipated failures.</li>
          <li><code>requires_review</code> should arrive as a <b>derived boolean plus reasons</b>, computed outside the model. Handing the agent a raw score to interpret is the anti-pattern.</li>
          <li>Cross-reference: 5.2 calls self-reported confidence unreliable, and that is not a contradiction — see the reconciliation table in <a class="pill" href="#/note/escalation-ambiguity">Escalation and Ambiguity</a>.</li>
        </ul>` },
    ],
  },
  {
    id: "provenance-conflicts", title: "Provenance and Conflicting Sources — Annotate, Do Not Arbitrate", topic: "ctx", domain: 5, tasks: ["5.6"], concept: "provenance", icon: "▤",
    summary: "When two credible sources disagree, the analysis agent completes with both values annotated and lets the coordinator reconcile. Attribution dies in summarization, so claim-source mappings and dates must be structured and carried through. Covers every bullet of Task Statement 5.6; verified against Anthropic's multi-agent research post and the Citations documentation (16 Aug 2026).",
    source: ["Anthropic Engineering — How we built our multi-agent research system, \"Architecture overview\"", "https://www.anthropic.com/engineering/multi-agent-research-system#architecture-overview-for-research"],
    sections: [
      { id: "conflict", h: "Conflicting statistics: carry both, attributed", html: `
        <p>The objective's wording leaves no room: <b>handle conflicting statistics from credible sources by annotating conflicts with source attribution rather than arbitrarily selecting one value.</b> "Credible" is doing work there — this is not a quality-filtering problem where one source is junk. Two defensible sources disagree, and the pipeline's job is to <b>preserve the disagreement</b>, not to end it.</p>
        <p><b>The base record every subagent emits — one claim, fully sourced:</b></p>
        <pre><code>{
  "claim_id": "c_41",
  "statement": "EU installed industrial battery cell capacity reached 184 GWh in 2025.",
  "source_id": "src_17",
  "source_url": "https://example.org/eu-battery-review-2026.pdf",
  "document_name": "EU Battery Alliance Annual Review 2026",
  "excerpt": "installed cell capacity stood at 184 GWh at end-2025",
  "locator": "p.42",
  "publication_date": "2026-03-11",
  "data_collection_period": "2025-01-01/2025-12-31",
  "methodology": "plant-level survey, self-reported nameplate capacity",
  "source_characterization": "reported by the source as preliminary",
  "status": "established"
}</code></pre>
        <p><b>The conflict record — what the analysis agent hands back when two of those disagree:</b></p>
        <pre><code>{
  "claim_id": "c_44",
  "topic": "EU industrial battery cell capacity, 2025",
  "status": "contested",
  "conflict_type": "metric_definition_and_period",
  "values": [
    {
      "value": "184 GWh",
      "source_id": "src_17",
      "publication_date": "2026-03-11",
      "data_collection_period": "2025-01-01/2025-12-31",
      "methodology": "nameplate capacity, self-reported",
      "source_characterization": "preliminary"
    },
    {
      "value": "151 GWh",
      "source_id": "src_23",
      "publication_date": "2026-01-08",
      "data_collection_period": "2025-01-01/2025-09-30",
      "methodology": "customs-cleared shipments",
      "source_characterization": "final"
    }
  ],
  "resolution": null,
  "analyst_note": "Not necessarily contradictory: nameplate installed vs shipped,
                   over different windows. Reconciliation requires a decision about
                   which metric the report is answering."
}</code></pre>
        <p><b>The rule, stated as the exam states it:</b> the analysis agent <b>completes</b> document analysis with the conflicting values included and explicitly annotated, <b>letting the coordinator decide how to reconcile</b> before passing to synthesis.</p>
        <ul>
          <li><b>"Completes" is load-bearing.</b> The analysis agent does not stall, does not ask permission, does not return an error. It finishes its job and its job includes the conflict. <code>resolution: null</code> is a <b>legitimate terminal state</b> for that agent, not an unfinished one.</li>
          <li><b>The coordinator decides, because only the coordinator has cross-source context.</b> A subagent looking at one document cannot tell "these measure different things" from "one of these is wrong". The coordinator, holding both records and the research question, can.</li>
          <li><b>And it may decide not to decide.</b> If the conflict cannot be resolved on the evidence, it survives into the report as a contested finding with both values and both attributions. That is a correct outcome, not a failure.</li>
          <li><b>Every way of ending the conflict inside the analysis agent is wrong:</b> picking the more recent, picking the more authoritative publisher, picking the one that matches other sources, averaging the two, or dropping the outlier. Averaging is the worst of them — it manufactures a number that <b>no source supports</b> and that no citation can back.</li>
          <li>This is the same instinct the hallucination guidance encodes at the single-model level: let the model say it does not know, ground claims in direct quotes, and <b>retract any claim you cannot find a supporting quote for</b>. A silently arbitrated value is a claim with no quote behind it.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations#basic-hallucination-minimization-strategies" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Reduce hallucinations, "Basic hallucination minimization strategies" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> (repo root) p.23, Task Statement 5.6, Knowledge bullet 3 and Skills bullet 3. Supporting: <code>exam-preparation-guide.md</code> §8 "Provenance, Time, and Uncertainty" (lines 1117-1130).</p>` },
      { id: "attrition", h: "Where attribution dies — and the two dates that stop false contradictions", html: `
        <p>The failure mode named in 5.6 is specific: <b>source attribution is lost during summarization steps when findings are compressed without preserving claim-source mappings.</b> The loss is structural, not careless. Summarization optimizes for readable prose, and URLs, page numbers, dates, and methodology notes are not prose — so they are the first thing dropped at every hop. Two hops in, you have a fluent paragraph of unattributed assertions, and nothing downstream can tell which sentence came from where.</p>
        <ul>
          <li><b>The structural fix is to separate content from metadata.</b> A flat prose summary is the classic way to break the citation chain; a structured claim-source index survives compression because the fields are named. If citations are required downstream, the handoff between agents is a <b>source index</b> — claims mapped to source IDs, URLs, excerpts, dates, and uncertainty notes — never a prose summary alone.</li>
          <li><b>The synthesis agent's contract is preservation and merge</b>, not rewriting. It combines claim-source mappings from multiple subagents; it does not get to drop the mapping because the sentence reads better without it.</li>
          <li><b>Anthropic's production answer is a dedicated pass.</b> In the Research system, once the loop exits, all findings go to a <b>CitationAgent</b> that processes the documents and the draft report to identify specific locations for citations — so that every claim is attributed. Attribution is treated as its own stage with its own agent, not as something each writer is trusted to remember.</li>
          <li><b>The other production answer is not to copy content at all.</b> The same post's "game of telephone" pattern: subagents store their work in external systems and pass <b>lightweight references</b> back to the coordinator. Content that is never re-copied through conversation history is content that never degrades in transit.</li>
          <li><b>The API-level version of the same idea</b> is the Citations feature, which returns the exact passages supporting each claim with a machine-checkable locator: <b>page ranges</b> for PDFs (1-indexed), <b>character ranges</b> for plain text (0-indexed), <b>content-block indices</b> for custom content. Worth knowing for design instincts: <code>title</code> and <code>context</code> are passed to the model but are <b>not citable</b> — <code>context</code> is the intended parking spot for document metadata as text or stringified JSON.</li>
          <li><b>It is also a graded property.</b> The Research system's LLM-judge rubric scores <b>citation accuracy</b> (do the cited sources match the claims?) and <b>source quality</b> (primary sources over lower-quality secondary ones) as first-class criteria — and human testers caught early agents systematically preferring SEO-optimized content farms over authoritative but lower-ranked academic PDFs.</li>
        </ul>
        <p><b>Dates: two fields, not one.</b> 5.6 requires <b>publication or data collection dates in structured outputs to enable correct temporal interpretation</b>, and the reason is the failure it prevents. Without dates, a synthesis agent treats an older and a newer statistic as <b>contradictory when they actually show a trend</b>. 151 GWh and 184 GWh are not a conflict if one covers three quarters and the other covers four; they are growth. Strip the dates and you have manufactured a contradiction out of a time series.</p>
        <ul>
          <li>Carry <b>publication date</b> and <b>data collection period</b> separately. A report published in March 2026 can carry data collected through September 2025 — collapsing them into one "date" field reintroduces exactly the confusion the requirement exists to prevent.</li>
          <li>Missing dates are a <b>gap to report</b>, not a field to guess. An undated figure is not comparable to a dated one, and the record should say so.</li>
          <li>The reciprocal error matters too: two figures with the <b>same</b> period and different values are a genuine conflict, and dates are what let you tell the two situations apart.</li>
        </ul>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/multi-agent-research-system#architecture-overview-for-research" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Architecture overview for Research" (relevant section) — the CitationAgent stage <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/multi-agent-research-system#appendix" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Appendix" (relevant section) — subagent output to a filesystem, to minimize the game of telephone <span aria-hidden="true">↗</span></a></p>
        <p class="srcline"><a href="https://platform.claude.com/docs/en/build-with-claude/citations#how-citations-work" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Docs, Citations, "How citations work" (relevant section) <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.23, Task Statement 5.6, Knowledge bullets 1, 2, 4 and Skills bullets 1, 4. Supporting: <code>exam-preparation-guide.md</code> §8 "Multi-Agent Context Passing" (lines 1053-1074, source-index rule at line 1070) and "Provenance, Time, and Uncertainty" (lines 1117-1119).</p>` },
      { id: "report", h: "The report: established, contested, and rendered by type", html: `
        <p>Provenance that survives the pipeline still has to survive the write-up. 5.6 asks for reports <b>structured with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.</b> Three requirements packed together:</p>
        <ul>
          <li><b>Separate sections, not inline hedging.</b> A reader should be able to see, structurally, which findings multiple independent sources support and which rest on one contested figure. Hedging language scattered through prose ("some sources suggest…") does not do this — it makes everything read as equally soft, which is its own distortion.</li>
          <li><b>Three buckets, not two.</b> The guide's per-claim field is <b>established / contested / insufficiently supported</b>. The third is not the same as the second: contested means credible sources disagree, insufficiently supported means nobody has really established it. Collapsing them loses the distinction a reader most needs.</li>
          <li><b>Preserve the source's own characterization.</b> If the source called a figure "preliminary", "estimated", or "revised", that word travels with the value. Normalizing it into a flat assertion is a quiet upgrade in confidence that the source never granted — and it is the same failure as arbitrating a conflict, applied to a single value.</li>
          <li><b>Carry methodology.</b> "184 GWh (nameplate, self-reported survey)" and "151 GWh (customs-cleared shipments)" stop looking like a contradiction the moment the method is attached. Methodology is often the entire explanation of a conflict.</li>
          <li><b>Uncertainty needs structure, or reports come out either overconfident or over-hedged.</b> Both failures come from the same cause: uncertainty carried as tone instead of as a field.</li>
          <li><b>Render by content type.</b> The Skills bullet is explicit — <b>financial data as tables, news as prose, technical findings as structured lists</b> — rather than converting everything to a uniform format. Forcing quarterly figures into paragraphs destroys comparability; forcing a qualitative development into a table invents precision.</li>
          <li><b>Annotate coverage, not just content.</b> Neighboring 5.3 asks synthesis output to mark which findings are well-supported and which topic areas have <b>gaps due to unavailable sources</b>. A silent gap reads as "nothing to report" when it means "we could not look."</li>
        </ul>
        <p class="srcline"><a href="https://www.anthropic.com/engineering/multi-agent-research-system#effective-evaluation-of-agents" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Engineering, "Effective evaluation of agents" (relevant section) — citation accuracy and source quality as graded rubric criteria <span aria-hidden="true">↗</span></a></p>
        <p class="srcline none">Source: <code>ClaudeCertifiedArchitectFoundationsGuide.pdf</code> p.23, Task Statement 5.6, Skills bullets 2 and 5; Task Statement 5.3 Skills bullet 4 (p.21). Supporting: <code>exam-preparation-guide.md</code> §8 "Provenance, Time, and Uncertainty" (repo root, lines 1117-1128).</p>` },
      { id: "exam", h: "Exam reflex", html: `
        <ul>
          <li>"Two credible sources report different figures — what should the analysis agent do?" → <b>complete the analysis with both values, explicitly annotated with their sources</b>, and let the coordinator reconcile. Every option that ends the conflict inside the analysis agent is wrong.</li>
          <li>Wrong-option vocabulary to recognize instantly: <b>select the more recent</b>, <b>prefer the more authoritative source</b>, <b>average the values</b>, <b>discard the outlier</b>, <b>ask the model to resolve the discrepancy</b>.</li>
          <li>"Halt and wait for coordinator instructions" is <b>also</b> wrong. The verb in the objective is <b>completing</b> — the agent finishes and hands off; it does not block.</li>
          <li>Statistics that disagree → first ask whether they cover the <b>same period and the same metric</b>. Missing dates turn trends into fake contradictions, which is why dates are a required field rather than a nice-to-have.</li>
          <li>If citations are required downstream, the inter-agent handoff is a <b>structured claim-source index</b>, never a prose summary. Any option that summarizes findings into prose before synthesis breaks attribution.</li>
          <li>Attribution loss is caused by <b>summarization</b>, not by the model forgetting. The fix is structural (keep the mapping as fields), not motivational (tell it to remember citations).</li>
          <li>Report structure: <b>well-established and contested get their own sections</b>, and source characterizations like "preliminary" travel unchanged.</li>
          <li>"Convert everything into one consistent format" is a distractor — financial data belongs in tables, news in prose, technical findings in lists.</li>
        </ul>` },
    ],
  },
  {
    id: "context-reset", title: "Context Resets — /clear, /compact, /rewind, and What Survives", topic: "cc", domain: 5, tasks: [], concept: "sessionstate", icon: "⟲",
    summary: "Four different resets, four different things kept. Verified against the official Claude Code commands, context-window and checkpointing documentation (20 Aug 2026). The practice exams get this one wrong more than once.",
    source: ["Claude Code Docs — Commands, \"All commands\"", "https://code.claude.com/docs/en/commands#all-commands"],
    sections: [
      { id: "four", h: "The four resets — pick by what you need to keep", html: `
        <ul>
          <li><b><code>/compact [instructions]</code></b> — "Free up context by summarizing the conversation so far." Same session, same thread, history replaced by a summary. Optional focus instructions: <code>/compact focus on the auth bug fix</code> keeps what you choose instead of what the automatic pass guesses.</li>
          <li><b><code>/clear [name]</code></b> — "Start a new conversation with empty context." Aliases: <b><code>/reset</code></b>, <b><code>/new</code></b>. Nothing on disk changes; files the session already wrote stay written.</li>
          <li><b>Automatic compaction</b> — runs on its own as the window fills; "a full context window doesn't end your session". <code>/autocompact 500k</code> moves the trigger point earlier.</li>
          <li><b><code>/rewind</code></b> (aliases <code>/checkpoint</code>, <code>/undo</code>) — goes back to an earlier point and can also <b>revert code</b>, which none of the others do. "Summarize from here" inside the rewind menu behaves like a targeted <code>/compact</code>.</li>
          <li>The decision rule: <b>continuing the same work → <code>/compact</code>. Switching to unrelated work → <code>/clear</code>. Undoing → <code>/rewind</code>.</b> The docs put it inside the <code>/clear</code> entry itself: "To free up context while continuing the same conversation, use <code>/compact</code> instead."</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/commands#all-commands" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "All commands" (relevant section)</a></p>` },
      { id: "survives", h: "What survives a compaction — and what silently does not", html: `
        <ul>
          <li><b>Unchanged:</b> system prompt and output style — they were never part of message history.</li>
          <li><b>Re-injected from disk:</b> project-root <code>CLAUDE.md</code>, unscoped rules, auto memory.</li>
          <li><b>Lost until re-triggered:</b> rules with <code>paths:</code> frontmatter, and nested <code>CLAUDE.md</code> in subdirectories — they only load when a matching file is read, so the summary eats them and they come back the next time Claude reads such a file.</li>
          <li><b>Re-injected but capped:</b> invoked skill bodies — 5,000 tokens per skill, 25,000 total, oldest dropped first, truncation keeps the <b>start</b> of the file.</li>
          <li><b>Not applicable:</b> hooks — "hooks run as code, not context". A guarantee you need to survive every reset belongs in a hook, not in a sentence someone hopes stays in the window.</li>
          <li><code>PreCompact</code> / <code>PostCompact</code> hooks fire around the operation, with a matcher of <code>manual</code> or <code>auto</code> — see the <a class="pill" href="#/note/hook-events">hook events note</a>.</li>
        </ul>
        <p class="srcline"><a href="https://code.claude.com/docs/en/context-window#what-survives-compaction" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Claude Code Docs, "What survives compaction" (relevant section)</a></p>` },
      { id: "not-a-reset", h: "What a reset does not fix", html: `
        <ul>
          <li><b>It does not clean the machine.</b> <code>/clear</code> is scoped to the conversation; files written, environment variables set, packages installed and credentials cached all survive. Between CI runs the isolation boundary is an ephemeral container, not a command (<a class="pill" href="#/q/e6q47">E6-Q47</a>).</li>
          <li><b>It does not un-stale a tool result.</b> Resuming restores tool calls <i>and</i> their results — a <code>Read</code> in restored history is a snapshot from when it ran. See <a class="pill" href="#/note/resume-stale">session resumption</a>.</li>
          <li><b>It is not a memory feature.</b> Nothing carries across a <code>/clear</code> except what is on disk: <code>CLAUDE.md</code>, rules, files. If the next session must know something, write it down — see <a class="pill" href="#/note/memory-surfaces">memory surfaces</a>.</li>
          <li><b><code>max_tokens</code> is not in this family at all.</b> It caps <b>output</b> length for one API call; it neither enlarges the context window nor relieves attention dilution. A distractor in both <a class="pill" href="#/q/e6q12">E6-Q12</a>'s neighbourhood and the exam's CI questions.</li>
        </ul>` },
      { id: "exam", h: "Exam reflex — and two errors in the course's own key", html: `
        <ul>
          <li>Scenario shape "long session, suggestions degrading, want peak performance back" → the option list decides: if <code>/compact</code> is present it wins; if only <code>/clear</code> is offered, take <code>/clear</code> <b>plus a concise state summary</b>, because a bare clear throws away the brief too.</li>
          <li>"Restart the terminal", "switch model", "raise <code>max_tokens</code>" are the three standard distractors. None of them prunes context.</li>
          <li><b>Course error 1:</b> <a class="pill" href="#/q/e6q12">E6-Q12</a>'s feedback claims "<code>/compact</code> is not a standard Claude Code command". It is documented, and it is the recommended move for continuing work.</li>
          <li><b>Course error 2:</b> the same item offers <code>/reset</code> as a distractor — it is a documented <b>alias of <code>/clear</code></b>, so the item has two correct answers. Answer <code>/clear</code> and move on.</li>
        </ul>` },
    ],
    related: [
      { id: "e6q12", why: "The item where the course's key and its justification are both worth checking." },
      { id: "e6q47", why: "Same instinct applied one layer too high: /clear cannot isolate CI runs." },

  {
    id: "hook-events", title: "Hook Events — Which Moment Each One Catches", topic: "cc", domain: 3, tasks: [], concept: "determinism", icon: "⎔",
    summary: "A hook is only as good as the moment it fires at. The event timeline, which events can block, and the three the exam confuses. Verified against the official Claude Code hooks reference (20 Aug 2026).",
    source: ["Claude Code Docs — Hooks reference", "https://code.claude.com/docs/en/hooks"],
    sections: [
      { id: "timeline", h: "The timeline of one turn", html: `
        <ul>
          <li><b><code>SessionStart</code></b> — session begins or resumes. Matcher: <code>startup</code> | <code>resume</code> | <code>clear</code> | <code>compact</code> | <code>fork</code>. For loading context at the start of a run.</li>
          <li><b><code>UserPromptSubmit</code></b> — "when the user submits a prompt, <b>before</b> Claude processes it… add additional context based on the prompt/conversation, validate prompts, or block certain types of prompts." This is the event that sees the <b>user's</b> text.</li>
          <li><b><code>PreToolUse</code></b> — "after Claude creates tool parameters and <b>before</b> processing the tool call". The one event that can stop an action before it happens.</li>
          <li><b><code>PermissionRequest</code></b> / <b><code>PermissionDenied</code></b> — around the permission decision itself.</li>
          <li><b><code>PostToolUse</code></b> — "immediately after a tool completes <b>successfully</b>"; <b><code>PostToolUseFailure</code></b> is the failing twin, and <b><code>PostToolBatch</code></b> fires once after a whole batch of parallel calls resolves.</li>
          <li><b><code>Stop</code></b> — "when the main Claude Code agent has finished responding". This is the event that sees the <b>model's</b> finished answer. It does not run on user interrupt; API errors fire <code>StopFailure</code>.</li>

        <ul>
          <li><b>Volume — shrink the input.</b> No ceiling and no trade-off: sending a PR's <code>git diff</code> instead of the repository cuts input by orders of magnitude. Every other lever is a percentage <i>of whatever you send</i>, so this one is applied first (<a class="pill" href="#/q/e6q48">E6-Q48</a>).</li>
          <li><b>Model — route by complexity.</b> Per-MTok input/output: Opus 5 $5 / $25, Sonnet 5 $2 / $10, Haiku 4.5 $1 / $5. So Opus 5 → Haiku 4.5 is 5×, Sonnet 5 → Haiku 4.5 is 2×. Anthropic's own guidance: "Sonnet handles most coding tasks well and costs less than Opus. Reserve Opus for complex architectural decisions… For simple subagent tasks, specify <code>model: haiku</code>."</li>
          <li><b>Cache — pay once for what repeats.</b> Cache <b>reads</b> cost 0.1× base input (90% off); the write costs 1.25× for the 5-minute TTL, 2× for the 1-hour TTL. Best ratio of the four, but only on a <b>stable prefix</b> that is actually re-sent.</li>
          <li><b>Batch — 50% off, paid for in latency.</b> "All usage is charged at 50% of the standard API prices", asynchronous, results "when all messages have completed or after 24 hours, whichever comes first", and batches expire if they do not finish inside 24 hours.</li>
        </ul>
        <p class="srcline"><a href="https://platform.claude.com/en/docs/build-with-claude/prompt-caching#pricing" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❖</span> Go to source — Anthropic Docs, prompt caching pricing multipliers (relevant section)</a></p>` },
      { id: "stack", h: "They stack — which is why the exam asks which one the scenario needs", html: `
        <ul>
          <li>A real high-volume pipeline uses several at once: triage by complexity, route to the cheapest adequate model, cache the shared instruction prefix, submit the non-urgent lanes as batches. Nothing here is exclusive.</li>
          <li>So a question offering "use batches" against "route by complexity" is not asking which is cheaper — <b>batching is available to both</b>. It is asking which lever answers the property the scenario describes.</li>
          <li>Read the scenario for its <b>discriminating fact</b>: a deadline → not batch. Repeated identical prefix → cache. Wide spread in document size or difficulty → route. Enormous input where most of it is irrelevant → cut volume first.</li>
        </ul>` },

        <ul>
          <li><b>Batch, when anything is blocking.</b> A PR gate, a chat reply, an interactive agent: 24-hour worst-case latency disqualifies it regardless of the discount (<a class="pill" href="#/q/e6q48">E6-Q48</a>). Batch is for "can run overnight".</li>
          <li><b>Batch, when the workload is uniform-but-varied.</b> A flat 50% does not respond to variance in document size; routing does (<a class="pill" href="#/q/e6q60">E6-Q60</a>).</li>

    ask: "\"How do you stop Claude Code editing outside <code>/src</code>?\" — with <code>permissions.deny</code> / <code>permissions.allow</code> rules in <code>settings.json</code>. The distractors are an invented env var, an invented <code>.claudeignore</code>, and \"just start it in that folder\" — the working directory is a default, not a boundary.",

/* ============================================================

============================================================ */

const LS_KEY = "ccaf_state_v3";
const LS_KEY_LEGACY = "ccaf_imported_v2";

/* v2 → v3 tek seferlik taşıma: reviewLog + settings eklenir. Eski key güvenli
   geri dönüş için silinmez; v3 bir kez yazıldıktan sonra ondan okunur. */
function loadStore(){
  const empty = { mistakes: [], exams: {}, reviewLog: {}, cardLog: {}, settings: {} };
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      const legacy = localStorage.getItem(LS_KEY_LEGACY);
      if (legacy) {
        const s = JSON.parse(legacy);
        const migrated = { mistakes: s.mistakes || [], exams: s.exams || {}, reviewLog: {}, cardLog: {}, settings: {} };
        try { localStorage.setItem(LS_KEY, JSON.stringify(migrated)); } catch (e) {}
        return migrated;
      }
      return empty;
    }
    const s = JSON.parse(raw);
    return {
      mistakes: s.mistakes || [], exams: s.exams || {},
      reviewLog: s.reviewLog || {}, cardLog: s.cardLog || {}, settings: s.settings || {},
    };
  } catch (e) { return empty; }
}
function persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STORE)); } catch (e) {} }

let STORE = loadStore();
let M = M_BUILTIN.concat(STORE.mistakes);
let EXAMS = Object.assign({}, EXAMS_BUILTIN, STORE.exams);
function rebuild(){
  M = M_BUILTIN.concat(STORE.mistakes);
  EXAMS = Object.assign({}, EXAMS_BUILTIN, STORE.exams);
}

const byId = id => M.find(m => m.id === id);
const inTopic = t => M.filter(m => m.topic === t);
const isImported = m => STORE.mistakes.some(x => x.id === m.id);

const TOPIC_CODE = { pe: "PE", tool: "MCP", cc: "CC", agent: "AG", ctx: "CTX" };

/* Verdict tek kroma eksenidir: "resmî kaynak ne diyor". */
const VERDICT = {

  conflict:      { glyph: "⚠", label: "Kurs cevabı resmî dokümanla ÇELİŞİYOR", short: "Çelişki", cls: "v-conf" },

/* İçe aktarılan metin ham yapıştırmadır — kaçırılır. Built-in kayıtlar HTML içerir. */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function field(m, key){ return isImported(m) ? esc(m[key]) : (m[key] || ""); }

const view = document.getElementById("view");
const crumbEl = document.getElementById("crumbs");
const mainEl = document.getElementById("main");

function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [base, arg] = h.split("/");
  return { base: base || "", arg: arg ? decodeURIComponent(arg) : "" };
}

let booted = false;

function router(){
  const { base, arg } = parseHash();
  const finder = document.getElementById("finder");
  if (finder) finder.value = "";
  window.scrollTo(0, 0);

  const handler = App.router.routes[base] || App.router.routes["*"];
  handler(arg);

  buildRail();
  closeMobileNav();
  if (booted) mainEl.focus({ preventScroll: true });
  booted = true;
}
window.addEventListener("hashchange", router);

/* Rail veri-güdümlü: App.router.navGroups üzerinden çizilir. Özellikler kendi
   nav öğelerini App.router.addNav(group, item) ile ekler; bu fonksiyon dokunulmaz. */
function navItemHTML(it, base, arg){
  const active = it.active ? it.active(base, arg) : false;
  const count = typeof it.count === "function" ? it.count() : it.count;
  const badge = it.code
    ? `<span class="mono-code" aria-hidden="true">${it.code}</span>`
    : `<span class="glyph" aria-hidden="true">${it.glyph}</span>`;
  return `<a class="nav" href="#/${it.hash}"${active ? ' aria-current="page"' : ""}>
    ${badge}
    <span>${it.label}</span>
    ${count != null ? `<span class="n">${count}</span>` : ""}
  </a>`;
}

function buildRail(){
  const { base, arg } = parseHash();
  const groups = App.router.navGroups.map(g => {
    const items = g.items.map(it => navItemHTML(it, base, arg)).join("");
    return `<div class="navgroup"><span class="glabel">${g.label}</span>${items}</div>`;
  }).join("");

  document.getElementById("rail").innerHTML = `
    <div class="mast">
      <a href="#/" aria-label="Panele dön">
        <span class="wordmark">CCA-F</span>
        <h1>Study Console</h1>
        <p>Yanlışlardan türetilmiş kişisel dosya</p>
      </a>
    </div>
    ${groups}`;
}

function setCrumbs(arr){
  crumbEl.innerHTML = arr.map((c, i) => {
    if (i === arr.length - 1) return `<b>${c.t}</b>`;
    const node = c.h ? `<a href="${c.h}">${c.t}</a>` : `<span>${c.t}</span>`;
    return `${node}<span class="sep" aria-hidden="true">/</span>`;
  }).join("");
}

============================================================ */

function topicTag(k){
  return `<span class="tcode" title="${TOPICS[k].name}">${TOPIC_CODE[k]}</span>
    <span class="small quiet">${TOPICS[k].short}</span>`;
}

function diffStars(d){
  const labels = ["", "kolay", "orta", "zor"];
  return `<span class="stars" title="Zorluk: ${labels[d]}" aria-label="Zorluk: ${labels[d]}">
    <span class="on">${"★".repeat(d)}</span>${"☆".repeat(3 - d)}</span>`;
}

function verdictChip(v, full){
  const x = VERDICT[v]; if (!x) return "";
  return `<span class="chip ${x.cls}"><span aria-hidden="true">${x.glyph}</span>${full ? x.label : x.short}</span>`;
}

function rowHTML(m){
  const c = field(m, "correct");
  const short = c.length > 130 ? c.slice(0, 128) + "…" : c;
  return `<a class="row" href="#/q/${m.id}">
    <div class="rtop">
      <span class="rid">E${m.exam}·Q${m.q}</span>
      ${topicTag(m.topic)}
      ${diffStars(m.diff)}
      ${m.verdict !== "ok" ? verdictChip(m.verdict) : ""}
      ${isImported(m) ? badge("İçe aktarıldı") : ""}
    </div>
    <div class="rq">${field(m, "scenario")}</div>
    <div class="ra"><span class="k">Doğrusu:</span> ${short}</div>
  </a>`;
}

function ledger(items, emptyMsg){
  if (!items.length) return `<p class="empty">${emptyMsg || "Kayıt yok."}</p>`;
  return `<div class="ledger">${items.map(rowHTML).join("")}</div>`;
}

function docHTML(title, url){
  let host = url; try { host = new URL(url).host; } catch (e) {}
  return `<a class="doc" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
    <span class="g" aria-hidden="true">❖</span>
    <span class="m"><span class="t">${esc(title)}</span><span class="u">${esc(host)}</span></span>
    <span class="x" aria-hidden="true">↗</span>
  </a>`;
}

/* Resmî açıklamanın dayandığı kaynağa doğrudan atlama satırı.
   URL'de #fragment varsa doküman o bölümde açılır — iddia ile kaynak arasındaki
   mesafe bir tıklama olmalı, "şu sayfada bir yerde" değil. */
function srcJump(docs){
  const d = (docs || [])[0];
  if (!d) return `<p class="srcline none">Kaynak: bu çıkarım yalnızca <code>exam-preparation-guide.md</code> ile doğrulandı — çevrimiçi doküman bağlantısı yok.</p>`;
  const anchored = /#/.test(d[1]);
  return `<p class="srcline"><a href="${esc(d[1])}" target="_blank" rel="noopener noreferrer">
    <span aria-hidden="true">❖</span> Kaynağa git — ${esc(d[0])}${anchored ? " (ilgili bölüm)" : ""} <span aria-hidden="true">↗</span>
  </a></p>`;
}

/* ------------------------------------------------------------
   Parça kütüphanesi — tekrar eden HTML tek yerde.
   Görünüm değişince buradan değişir. Yeni özellikler App.components.* kullanır.
------------------------------------------------------------ */

/* Sayaç rozeti. Varsayılan nokta glifi; opts.cls/opts.glyph durum rozetleri için. */
function badge(text, opts){
  const o = opts || {};
  const cls = o.cls ? " " + o.cls : "";
  const mark = o.glyph ? `<span aria-hidden="true">${o.glyph}</span>` : `<span class="dot"></span>`;
  return `<span class="chip${cls}">${mark}${text}</span>`;
}

/* İlerleme çubuğu. opts.muted → soluk (.q), opts.maxWidth → satır-içi genişlik. */
function progressBar(pct, opts){
  const o = opts || {};
  const cls = o.muted ? " q" : "";
  const style = o.maxWidth ? ` style="max-width:${o.maxWidth}"` : "";
  return `<div class="bar${cls}"${style}><i style="width:${pct}%"></i></div>`;
}

/* Kılcal-kutu callout (.note). tone: acc | warn | ok. body ham HTML. */
function callout(o){
  const tone = o.tone ? " " + o.tone : "";
  const reading = o.reading === false ? "" : " reading";
  const style = o.style ? ` style="${o.style}"` : "";
  const label = o.label
    ? `<span class="mlabel">${o.glyph ? `<span aria-hidden="true">${o.glyph}</span>` : ""}${o.label}</span>`
    : "";
  return `<div class="note${tone}${reading}"${style}>${label}${o.body || ""}</div>`;
}

/* Sağ sütun içindekiler. items: [{href,label}] veya falsy (atlanır). */
function toc(title, items){
  const links = items.filter(Boolean).map(it => `<a href="${it.href}">${it.label}</a>`).join("");
  return `<aside class="toc" aria-label="Sayfa içeriği">
    <span class="mlabel">${title}</span>
    ${links}
  </aside>`;
}

/* Genel bölüm: başlık + gövde. Yeni view'lar için. */
function section(title, body, opts){
  const o = opts || {};
  const id = o.id ? ` id="${o.id}"` : "";
  return `<h3${id}>${title}</h3>${body}`;
}

/* Sınav kartı (panel). */
function examCard(ex){
  const pct = ex.total ? Math.round(ex.correct / ex.total * 100) : 0;
  const pass = pct >= 72;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <h4 style="margin:0">${esc(ex.name)}</h4>
      <span class="small quiet">${esc(ex.attempt || "")}</span>
    </div>
    <div class="small quiet" style="margin:6px 0 14px">${ex.correct} doğru · ${ex.wrong} yanlış · ${ex.total} soru</div>
    ${progressBar(pct)}
    <div class="small quiet" style="margin-top:9px">
      %${pct} · geçme eşiği ~%72
      ${pass ? `<span class="chip v-ok" style="margin-left:6px"><span aria-hidden="true">✓</span>Geçer</span>`
             : `<span class="chip v-warn" style="margin-left:6px"><span aria-hidden="true">◑</span>Eşik altı</span>`}
    </div>
  </div>`;
}

/* Not kartı (notlar listesi satırı). */
function noteCard(n){
  const tasks = (n.tasks || []).length ? ` ${n.tasks.join(" · ")}` : "";
  return `<a class="row" href="#/note/${n.id}">
    <div class="rtop">
      <span class="tcode" title="${DOMAINS[n.domain].name}">D${n.domain}</span>
      <b>${n.title}</b>
      ${badge(`${DOMAINS[n.domain].short}${tasks}`)}
      ${badge(`${n.sections.length} sections`)}
    </div>
    <div class="ra">${n.summary}</div>
  </a>`;
}

  const conflicts = M.filter(m => m.verdict === "conflict").length;

  const stats = Object.keys(TOPICS).map(k => ({ k, n: inTopic(k).length }))

/* Sayfa-içi atlama. Düz `href="#id"` burada işe yaramaz: hash router onu rota
   olarak okur ve panele düşer. Bağlantı mevcut rotada kalır, kaydırmayı JS yapar. */
function jumpTo(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  return false;
}

function tocJump(title, hash, items){
  const links = items.filter(Boolean).map(it =>
    `<a href="${esc(hash)}" onclick="return jumpTo('${esc(it.id)}')">${esc(it.label)}</a>`).join("");
  return `<aside class="toc" aria-label="Sayfa içeriği">
    <span class="mlabel">${esc(title)}</span>
    ${links}
  </aside>`;
}

let parsed = null;

function mapDomain(s){
  s = (s || "").toLowerCase();
  if (s.includes("prompt engineering")) return "pe";
  if (s.includes("tool design") || s.includes("mcp")) return "tool";
  if (s.includes("claude code")) return "cc";
  if (s.includes("agentic")) return "agent";
  if (s.includes("context")) return "ctx";
  return "pe";
}

function parseUdemy(text){
  const lines = text.split("\n").map(l => l.trim()).filter(l => l.length);
  const exNum   = (text.match(/Practice Exam\s+(\d+)/i) || [])[1] || "";
  const attempt = (text.match(/Deneme\s+\d+/i) || [])[0] || "";
  const total   = (text.match(/(\d+)\s*tümü/) || [])[1];
  const correct = (text.match(/(\d+)\s*doğru/) || [])[1];
  const wrong   = (text.match(/(\d+)\s*yanlış/) || [])[1];
  const nameM   = text.match(/(Practice Exam[^\n]*?)\s*-\s*Sonuçlar/i);

  const CORR  = ["Doğru cevap", "Doğru seçim"];
  const WRONG = ["Cevabınız yanlış", "Seçiminiz yanlış"];
  const MARK  = ["Doğru cevap", "Doğru seçim", "Cevabınız yanlış", "Seçiminiz yanlış", "Seçiminiz doğru"];

  const hdr = [];
  lines.forEach((l, i) => { if (/^Soru\s+\d+$/.test(l)) hdr.push(i); });

  const mistakes = [];
  hdr.forEach((start, hi) => {
    const end = (hi + 1 < hdr.length) ? hdr[hi + 1] : lines.length;
    let B = lines.slice(start, end);
    const fi = B.findIndex(l => /Sonuçlara genel bakış|En üste geri dön|Kurs içeriği/.test(l));
    if (fi > 0) B = B.slice(0, fi);
    if (!B.some(l => WRONG.includes(l))) return; // yalnızca yanlışlar

    const qNum = (B[0].match(/^Soru\s+(\d+)$/) || [])[1];
    const dai = B.findIndex(l => l.includes("Bunu daha detaylı açıkla"));
    const sStart = dai >= 0 ? dai + 1 : 2;
    let sEnd = B.findIndex((l, idx) => idx >= sStart && MARK.includes(l));
    if (sEnd < 0) sEnd = sStart + 1;
    const scenario = B.slice(sStart, sEnd).join(" ");

    const correctParts = [], yourParts = [];
    let whyText = "";
    B.forEach((l, idx) => {
      if (CORR.includes(l) && B[idx + 1]) correctParts.push(B[idx + 1]);
      if (WRONG.includes(l) && B[idx + 1]) {
        yourParts.push(B[idx + 1]);
        if (!whyText && B[idx + 2] === "Açıklama" && B[idx + 3]) whyText = B[idx + 3];
      }
    });

    const gi = B.findIndex(l => l.includes("Genel açıklama"));
    const ei = B.findIndex(l => l.includes("Etki alanı"));
    let official = "", docs = [];
    if (gi >= 0) official = B.slice(gi + 1, ei > gi ? ei : B.length).join(" ");
    const ref = (official.match(/(?:Ref|Reference)\.?:\s*(https?:\/\/\S+)/i) || [])[1];
    official = official.replace(/(?:Ref|Reference)\.?:\s*https?:\/\/\S+/i, "").trim();
    if (ref) docs.push(["Kursun verdiği kaynak", ref]);
    const domain = (ei >= 0 && B[ei + 1]) ? B[ei + 1] : "";

    mistakes.push({
      id: "u" + exNum + "q" + qNum, exam: +exNum, q: +qNum,
      topic: mapDomain(domain), diff: 2,
      concepts: [], related: [], verdict: "unverified", docs,
      scenario: scenario || "(senaryo ayrıştırılamadı)",
      your: yourParts.join("  ·  ") || "—",
      correct: correctParts.join("  ·  ") || "—",
      why: whyText || "İçe aktarıldı. Resmî doğrulama ve koçluk için aşağıdaki kopyala düğmesini kullan.",
      official: official || "Kurs genel açıklaması bulunamadı.",
    });
  });

  const exam = {
    num: +exNum,
    name: nameM ? nameM[1].trim() : ("Practice Exam " + exNum),
    attempt, total: +total || 0, correct: +correct || 0, wrong: +wrong || mistakes.length,
  };
  return { exam, mistakes };
}

function parseAndPreview(){
  const box = document.getElementById("pasteBox");
  const out = document.getElementById("previewArea");
  const txt = ((box && box.value) || "").trim();

  if (!txt) {

    return;

  parsed = parseUdemy(txt);

          <span class="chip v-warn"><span aria-hidden="true">◷</span>Doğrulanmadı</span>

      <button class="btn pri" onclick="commitImport()">${parsed.mistakes.length} yanlışı kaydet</button>
      <button class="btn" onclick="cancelImport()">Vazgeç</button>
    </div>`;
}

function cancelImport(){ parsed = null; document.getElementById("previewArea").innerHTML = ""; }

function commitImport(){
  if (!parsed) return;
  const ids = new Set(parsed.mistakes.map(m => m.id));
  STORE.mistakes = STORE.mistakes.filter(m => !ids.has(m.id)).concat(parsed.mistakes);
  if (parsed.exam && parsed.exam.num) {
    STORE.exams[parsed.exam.num] = {
      name: parsed.exam.name, attempt: parsed.exam.attempt,
      total: parsed.exam.total, correct: parsed.exam.correct, wrong: parsed.exam.wrong,
    };
  }
  persist(); rebuild(); parsed = null;
  renderImport(); buildRail();
}

function deleteImportedExam(num){
  STORE.mistakes = STORE.mistakes.filter(m => String(m.exam) !== String(num));
  delete STORE.exams[num];
  persist(); rebuild(); renderImport(); buildRail();
}

                 "e" + m.exam + "q" + m.q, "q" + m.q].join(" ").toLowerCase();
    return hay.includes(needle);

/* ============================================================
   SERVİSLER — saf mantık, UI yok. Faz 4 özellikleri bunlara dayanır.
   reviewLog okunur; not/derece YOK — yalnızca tekrar sinyali (zaman + sayı).
============================================================ */

const analytics = {
  DAY: 864e5,

  /* Konu yanlış yoğunluğu, çoktan aza. */
  topicLoad(){
    return Object.keys(TOPICS)
      .map(k => ({ topic: k, count: inTopic(k).length }))
      .sort((a, b) => b.count - a.count);
  },
  weakTopics(n = 3){ return analytics.topicLoad().slice(0, n); },
  strongTopics(n = 3){ return analytics.topicLoad().slice().reverse().slice(0, n); },

  conflictCount(){ return M.filter(m => m.verdict === "conflict").length; },
  datedCount(){ return M.filter(m => m.verdict === "dated").length; },

  reviewCount(id){ const l = STORE.reviewLog[id]; return l ? l.length : 0; },
  lastReviewed(id){ const l = STORE.reviewLog[id]; return l && l.length ? l[l.length - 1] : null; },
  daysSince(id){ const t = analytics.lastReviewed(id); return t == null ? Infinity : (Date.now() - t) / analytics.DAY; },

  /* Ustalık 0..1: tekrar derinliği + tazelik. Derece değil, tekrar sinyali. */
  mastery(id){
    const c = analytics.reviewCount(id);
    if (!c) return 0;
    const recency = Math.max(0, 1 - analytics.daysSince(id) / 30); // ~30 günde unutma
    const depth = Math.min(1, c / 3);                              // ~3 tekrarda oturur
    return Math.round((0.5 * depth + 0.5 * recency) * 100) / 100;
  },

  /* Tekrar önceliği (yüksek = önce). Hiç görülmemiş / vadesi geçmiş / çelişki / zor öne çıkar. */
  reviewPriority(id){
    const m = byId(id); if (!m) return 0;
    const c = analytics.reviewCount(id);
    const d = analytics.daysSince(id);
    const overdue = d === Infinity ? 2 : Math.min(2, d / 14);
    const conflictBoost = m.verdict === "conflict" ? 1 : (m.verdict === "dated" ? 0.5 : 0);
    const diffBoost = (m.diff || 1) / 3;
    const unseen = c === 0 ? 1 : 0;
    return overdue + conflictBoost + diffBoost + unseen;
  },

  /* Son `days` günün günlük review sayıları, eski→yeni. */
  trend(days = 14){
    const now = Date.now(); const buckets = {};
    for (const id in STORE.reviewLog) {
      for (const t of STORE.reviewLog[id]) {
        const idx = Math.floor((now - t) / analytics.DAY);
        if (idx >= 0 && idx < days) buckets[idx] = (buckets[idx] || 0) + 1;
      }
    }
    const arr = []; for (let i = days - 1; i >= 0; i--) arr.push(buckets[i] || 0);
    return arr;
  },

  totalReviews(){ let n = 0; for (const id in STORE.reviewLog) n += STORE.reviewLog[id].length; return n; },
  reviewedCount(){ return Object.keys(STORE.reviewLog).filter(id => STORE.reviewLog[id].length).length; },

  stats(){
    return {
      weakTopics: analytics.weakTopics(), strongTopics: analytics.strongTopics(),
      conflictCount: analytics.conflictCount(), datedCount: analytics.datedCount(),
      totalReviews: analytics.totalReviews(), reviewedCount: analytics.reviewedCount(),
      total: M.length, trend: analytics.trend(),
    };
  },
};
App.services.analytics = analytics;

const graphSvc = {
  /* Zincirlenebilir filtre. App.services.graph.query().topic("pe").verdict("conflict").results() */
  query(source){
    let items = (source || M).slice();
    const api = {
      topic(t){ items = items.filter(m => m.topic === t); return api; },
      concept(c){ items = items.filter(m => (m.concepts || []).includes(c)); return api; },
      verdict(v){ items = items.filter(m => m.verdict === v); return api; },
      exam(n){ items = items.filter(m => String(m.exam) === String(n)); return api; },
      diff(d){ items = items.filter(m => m.diff === d); return api; },
      diffGte(d){ items = items.filter(m => (m.diff || 0) >= d); return api; },
      docHost(h){ items = items.filter(m => (m.docs || []).some(d => hostOf(d[1]).includes(h))); return api; },
      imported(flag = true){ items = items.filter(m => isImported(m) === flag); return api; },
      reviewedWithin(days){ const cut = Date.now() - days * analytics.DAY;
        items = items.filter(m => { const l = STORE.reviewLog[m.id]; return l && l.some(t => t >= cut); }); return api; },
      unreviewed(){ items = items.filter(m => { const l = STORE.reviewLog[m.id]; return !l || !l.length; }); return api; },
      where(fn){ items = items.filter(fn); return api; },
      sort(fn){ items = items.slice().sort(fn); return api; },
      limit(n){ items = items.slice(0, n); return api; },
      results(){ return items; },
      count(){ return items.length; },
      ids(){ return items.map(m => m.id); },
    };
    return api;
  },

  byConcept(c){ return graphSvc.query().concept(c).results(); },

  /* Docs-as-node çekirdeği: her benzersiz doc URL → onu referanslayan sorular + kavramlar. F-E kullanır. */
  docIndex(){
    const idx = {};
    for (const m of M) {
      for (const d of (m.docs || [])) {
        const url = d[1];
        if (!idx[url]) idx[url] = { title: d[0], url, host: hostOf(url), questions: [], concepts: new Set() };
        idx[url].questions.push(m.id);
        for (const c of (m.concepts || [])) idx[url].concepts.add(c);
      }
    }
    return Object.values(idx).map(x => ({ ...x, concepts: [...x.concepts] }));
  },
};
App.services.graph = graphSvc;

/* URL host'u güvenli çıkar (paylaşılan yardımcı). */
function hostOf(url){ try { return new URL(url).host; } catch (e) { return String(url); } }

      <div><div class="n acc">${s.conflictCount}</div><div class="l">Kurs ↯ resmî çelişki</div></div>

/* === FEATURE: ACTIVE-RECALL (soru reveal-gate) === */
/* Cevap baştan gizli; kullanıcı hatırlamaya çalışır, sonra açar. Açılış bir
   review olayı yazar (not/derece YOK). renderQuestion #recall-gate + #recall-body üretir. */
function recallAgo(ts){
  if (ts == null) return "—";
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d <= 0 ? "bugün" : (d === 1 ? "dün" : d + " gün önce");
}
function recallGate(m){
  const A = App.services.analytics;
  const c = A.reviewCount(m.id);
  const seen = c
    ? `<span class="small quiet"><span aria-hidden="true">◷</span> ${c} kez tekrar edildi · son ${recallAgo(A.lastReviewed(m.id))}</span>`
    : `<span class="small quiet">Bu soruyu ilk kez tekrar ediyorsun.</span>`;
  return `<div id="recall-gate" class="note acc reading">
    <span class="mlabel"><span aria-hidden="true">◆</span>Aktif hatırlama</span>
    <p>Cevabı açmadan önce kendine sor: doğrusu ne, sen ne demiştin, neden kaçırdın? Hazır olunca aç.</p>
    <div class="btnrow" style="margin-top:4px;align-items:center;gap:16px">
      <button class="btn pri" onclick="recallReveal('${m.id}')">Cevabımı gördüm — Göster</button>
      ${seen}
    </div>
  </div>`;
}
function recallReveal(id){
  const body = document.getElementById("recall-body");
  const gate = document.getElementById("recall-gate");
  if (body) body.hidden = false;
  if (gate) gate.hidden = true;
  (STORE.reviewLog[id] = STORE.reviewLog[id] || []).push(Date.now());
  persist();
}
App.services.learning = App.services.learning || {};
App.services.recall = { reveal: recallReveal, gate: recallGate, ago: recallAgo };

  miniQuiz(n = 5){

  },
  plan(){

             readingDocs: learning.readingDocs(), miniQuiz: learning.miniQuiz() };

};

/* === FEATURE: GRAPH-QUERY (#/query) === */
/* graph.query() zincirini görsel filtreye bağlar. Anlık sonuç, sayfa yeniden çizilmez. */
function qVal(id){ const el = document.getElementById(id); return el ? el.value : ""; }

function runQuery(){
  const g = App.services.graph;
  const t = qVal("qTopic"), vd = qVal("qVerdict"), df = +qVal("qDiff") || 0, dh = qVal("qHost"), rv = qVal("qReviewed");
  let q = g.query();
  if (t)  q = q.topic(t);
  if (vd) q = q.verdict(vd);
  if (df) q = q.diffGte(df);
  if (dh) q = q.docHost(dh);
  if (rv === "yes") q = q.reviewedWithin(1e6);
  if (rv === "no")  q = q.unreviewed();
  const res = q.results();

  const chain = ["query()", t && `.topic("${t}")`, vd && `.verdict("${vd}")`, df && `.diffGte(${df})`,
    dh && `.docHost("${dh}")`, rv === "yes" && ".reviewedWithin(∞)", rv === "no" && ".unreviewed()"]
    .filter(Boolean).join("");

  document.getElementById("qresults").innerHTML = `
    <div class="meta" style="margin:6px 0 6px"><b>${res.length}</b> sonuç</div>
    <pre class="qchain" style="font-family:var(--mono);font-size:.78rem;color:var(--ink-2);background:var(--surface-sunk);padding:8px 12px;border-radius:4px;margin:0 0 20px;overflow-x:auto">${esc(chain)}</pre>
    ${ledger(res, "Bu filtreyle eşleşen yanlış yok. Bir filtreyi gevşet.")}`;
}

function renderQuery(){
  setCrumbs([{ t: "Graph sorgu" }]);
  const hosts = [...new Set(App.services.graph.docIndex().map(d => d.host))].sort();
  const sel = (id, opts) => `<select id="${id}" onchange="runQuery()" style="padding:7px 10px;border:1px solid var(--rule-2);background:var(--surface-raise);color:var(--ink);border-radius:3px;font:inherit">
    ${opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>`;

  view.innerHTML = `
    <p class="eyebrow">Bilgi grafiği</p>
    <h2 class="title">Graph sorgu</h2>
    <p class="lede">Filtreleri zincirle: konu + verdict + zorluk + resmî kaynak + tekrar durumu. Sonuç ve eşdeğer sorgu ifadesi anında güncellenir.</p>

    <div style="display:flex;flex-wrap:wrap;gap:14px 18px;align-items:end;margin-bottom:12px">
      <label class="small quiet" style="display:flex;flex-direction:column;gap:6px">Konu${sel("qTopic", [["", "Tümü"], ...Object.keys(TOPICS).map(k => [k, TOPICS[k].short])])}</label>
      <label class="small quiet" style="display:flex;flex-direction:column;gap:6px">Verdict${sel("qVerdict", [["", "Tümü"], ["ok", "Uyumlu"], ["conflict", "Çelişki"], ["dated", "Güncel değil"], ["authoritative", "Referans"], ["unverified", "Doğrulanmadı"]])}</label>
      <label class="small quiet" style="display:flex;flex-direction:column;gap:6px">Min zorluk${sel("qDiff", [["0", "Tümü"], ["1", "≥ kolay"], ["2", "≥ orta"], ["3", "= zor"]])}</label>
      <label class="small quiet" style="display:flex;flex-direction:column;gap:6px">Kaynak${sel("qHost", [["", "Tümü"], ...hosts.map(h => [h, h])])}</label>
      <label class="small quiet" style="display:flex;flex-direction:column;gap:6px">Tekrar${sel("qReviewed", [["", "Tümü"], ["yes", "Tekrar edilenler"], ["no", "Hiç edilmeyenler"]])}</label>
    </div>

    <div id="qresults"></div>`;
  runQuery();
}

/* === FEATURE: DOCS-AS-NODE (#/doc/:slug) === */
/* Doküman artık pasif link değil düğüm: onu kullanan sorular + kavramlar burada birleşir.
   Türetilmiş veri graph.docIndex()'ten gelir. DOCS_META opsiyonel elle zenginleştirme
   (alıntı paragraf) tutar — boşsa sayfa yine tam çalışır, uydurma içerik yok. */
const DOCS_META = {
  // "https://docs.anthropic.com/...": { paragraph: "resmî dokümandan birebir alıntı" },
};

function docSlug(url){
  let h = 0; for (let i = 0; i < url.length; i++) h = (h * 31 + url.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* Kaynaklar sayfası için: dışa değil doküman düğümüne (içe) link. */
function docNodeLink(d){
  return `<a class="doc" href="#/doc/${docSlug(d[1])}">
    <span class="g" aria-hidden="true">❖</span>
    <span class="m"><span class="t">${esc(d[0])}</span><span class="u">${esc(hostOf(d[1]))} · detay</span></span>
    <span class="x" aria-hidden="true">→</span>
  </a>`;
}

function renderDoc(slug){
  const doc = App.services.graph.docIndex().find(d => docSlug(d.url) === slug);
  if (!doc) return renderResources();
  setCrumbs([{ t: "Resmî kaynaklar", h: "#/resources" }, { t: doc.title }]);
  const meta = DOCS_META[doc.url] || {};
  const questions = doc.questions.map(byId).filter(Boolean);

  view.innerHTML = `
    <div class="with-toc">
      <div>
        <a class="back" href="#/resources"><span aria-hidden="true">←</span>Resmî kaynaklar</a>
        <p class="eyebrow">${esc(doc.host)}</p>
        <h2 class="title" id="dtop">${esc(doc.title)}</h2>
        <div class="btnrow" style="margin:8px 0 28px">
          <a class="btn pri" href="${esc(doc.url)}" target="_blank" rel="noopener noreferrer">Resmî dokümanı aç ↗</a>
        </div>

        ${meta.paragraph
          ? `<h3 id="alinti">İlgili paragraf</h3>${callout({ tone: "acc", glyph: "❖", label: "Dokümandan", body: `<p style="margin-bottom:0">${meta.paragraph}</p>` })}`
          : callout({ tone: "acc", glyph: "◷", label: "Alıntı henüz eklenmedi", body: `<p style="margin-bottom:0">Bu kaynaktan birebir paragraf DOCS_META'ya eklenince burada vurgulanır. Şimdilik dokümanı açıp okuyabilirsin.</p>` })}

        <h3 id="sorular">Bu kaynağı kullanan sorular <span class="quiet">(${questions.length})</span></h3>
        <p class="small quiet reading" style="margin-bottom:20px">Bu dokümana dayanan yanlışların. Doğrulama zinciri burada birleşiyor.</p>
        ${ledger(questions, "Bu kaynağı kullanan soru yok.")}

        ${doc.concepts.length ? `<h3 id="kavram">İlişkili kavramlar</h3>
          <div class="pills">${doc.concepts.map(c => `<a class="pill" href="#/connections">${CONCEPTS[c] || c}</a>`).join("")}</div>` : ""}
      </div>
      ${toc("Bu kaynakta", [
        { href: "#alinti", label: "İlgili paragraf" },
        { href: "#sorular", label: `Sorular (${questions.length})` },
        doc.concepts.length && { href: "#kavram", label: "Kavramlar" },
      ])}
    </div>`;
}

   dokümanla doğrulanmış geçişler; gerisini kullanıcı ekler. */
const VERSIONS = {
  thinking: {
    title: "Extended → Adaptive thinking",
    timeline: [
      { date: "2025", label: "Extended thinking",
        note: "Uzun akıl yürütme <code>thinking: { type: 'enabled', budget_tokens: N }</code> ile açılır (min 1024, &lt; max_tokens).",
        docs: [["Extended thinking", "https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking"]] },
      { date: "2026", label: "Adaptive thinking",
        note: "En yeni modeller (Opus 4.7/4.8, Sonnet 5) <code>enabled</code>'ı reddeder: <code>thinking: { type: 'adaptive' }</code> + <code>output_config: { effort }</code>.",
        docs: [["Steering thinking (adaptive)", "https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost"]] },
    ],
  },
};

function versionTimeline(key){
  const v = VERSIONS[key]; if (!v) return "";
  const steps = v.timeline.map(s => `
    <div style="display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--rule)">
      <span class="mono-code" style="flex:none;align-self:flex-start">${esc(s.date)}</span>
      <div style="min-width:0">

        ${(s.docs || []).map(d => docHTML(d[0], d[1])).join("")}
      </div>
    </div>`).join("");
  return `<div class="reading">${steps}</div>`;
}

/* Soru sayfası için: sorunun kavramlarından sürüm geçmişi olanları göster. */
function questionVersions(m){
  const keys = (m.concepts || []).filter(c => VERSIONS[c]);
  return keys.map(c => `<h3 id="surum-${c}">Sürüm geçmişi — ${esc(VERSIONS[c].title)}</h3>

    ${versionTimeline(c)}`).join("");
}
App.services.versions = { timeline: versionTimeline, forQuestion: questionVersions, has: k => !!VERSIONS[k] };

/* PDF s.3 blueprint ağırlıkları — sınavda hangi domainin kaç puan getirdiği. */
const BANK_WEIGHT = { agent: 27, cc: 20, pe: 20, tool: 18, ctx: 15 };

const BANK_KEY = "ccaf_bank_v1";
const BANK_PW_KEY = "ccaf_bank_pw";

let BANK = null;           /* çözülmüş sorular; kilit açılana kadar null */
let bankBusy = false;

function bankLoadStore(){
  const empty = { attempts: {}, flagged: [], sessions: {} };
  try { return Object.assign(empty, JSON.parse(localStorage.getItem(BANK_KEY)) || {}); }
  catch (e) { return empty; }
}
let BSTORE = bankLoadStore();
function bankPersist(){ try { localStorage.setItem(BANK_KEY, JSON.stringify(BSTORE)); } catch (e) {} }

/* ---- Şifre çözme (WebCrypto + DecompressionStream, harici bağımlılık yok) ---- */
/* Düzen build-bank.mjs ile birebir: salt(16) | iv(12) | tag(16) | ciphertext.
   Node tag'i ayrı verir, WebCrypto ciphertext'in sonuna ekli bekler. */
async function bankDecrypt(password){
  if (!BANK_BLOB) throw new Error("banka gömülü değil");
  const bin = Uint8Array.from(atob(BANK_BLOB.d), c => c.charCodeAt(0));
  const salt = bin.slice(0, 16), iv = bin.slice(16, 28), tag = bin.slice(28, 44), ct = bin.slice(44);

  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: BANK_BLOB.kdf.iter, hash: BANK_BLOB.kdf.hash },
    material, BANK_BLOB.kdf.keyLen);
  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);

  const sealed = new Uint8Array(ct.length + tag.length);
  sealed.set(ct); sealed.set(tag, ct.length);
  /* Yanlış parolada auth tag tutmaz ve burası atar — sessiz bozuk veri yok. */
  const packed = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, sealed);

  const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function bankTryUnlock(pw, opts){
  const o = opts || {};
  if (bankBusy || !pw) return false;
  bankBusy = true;
  const btn = document.getElementById("unlockBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Çözülüyor…"; }
  /* Önceki denemenin hatası ekranda kalmasın — yeni deneme temiz başlar. */
  const prev = document.getElementById("lockMsg");
  if (prev) prev.innerHTML = "";
  try {
    BANK = await bankDecrypt(pw);
    if (o.remember) localStorage.setItem(BANK_PW_KEY, pw);
    bankBusy = false;
    App.router.refresh();
    return true;
  } catch (e) {
    bankBusy = false;
    /* Hatırlanan parola artık çalışmıyorsa (yeniden şifrelendi) at gitsin. */
    if (o.silent) { localStorage.removeItem(BANK_PW_KEY); return false; }
    const msg = document.getElementById("lockMsg");
    if (msg) msg.innerHTML = callout({ tone: "warn", glyph: "⚠", label: "Parola hatalı",
      body: `<p style="margin-bottom:0">Şifre çözülemedi. Parolayı kontrol edip tekrar dene.</p>` });
    if (btn) { btn.disabled = false; btn.textContent = "Kilidi aç"; }
    return false;
  }
}

function bankUnlockSubmit(ev){
  if (ev) ev.preventDefault();
  const el = document.getElementById("bankPw");
  const rem = document.getElementById("bankRemember");
  bankTryUnlock(el ? el.value : "", { remember: rem ? rem.checked : false });
  return false;
}

function bankLock(){
  BANK = null;
  localStorage.removeItem(BANK_PW_KEY);
  App.router.refresh();
}

/* ---- Sorgular ---- */

function bankAll(){ return BANK || []; }
function bankById(id){ return bankAll().find(b => b.id === id); }
function bankInTopic(t){ return bankAll().filter(b => b.topic === t); }
function bankAttempts(id){ return BSTORE.attempts[id] || []; }
function bankLastAttempt(id){ const a = bankAttempts(id); return a.length ? a[a.length - 1] : null; }
function bankFlagged(id){ return BSTORE.flagged.indexOf(id) >= 0; }

function bankTopicStats(t){
  const qs = bankInTopic(t);
  let seen = 0, ok = 0;
  for (const q of qs) {
    const last = bankLastAttempt(q.id);
    if (last) { seen++; if (last.ok) ok++; }
  }
  return { total: qs.length, seen, ok, pct: seen ? Math.round(ok / seen * 100) : 0 };
}

function bankSummary(){
  const out = { total: bankAll().length, seen: 0, ok: 0, flagged: BSTORE.flagged.length, topics: {} };
  for (const k of Object.keys(TOPICS)) {
    const s = bankTopicStats(k);
    out.topics[k] = s; out.seen += s.seen; out.ok += s.ok;
  }
  out.pct = out.seen ? Math.round(out.ok / out.seen * 100) : 0;
  return out;
}
